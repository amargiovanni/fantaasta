<!doctype html>
<meta charset="utf-8">
<title>fantaasta smoke test</title>
<iframe id="f" src="index.html" style="width:1400px;height:900px"></iframe>
<pre id="out">PENDING</pre>
<script>
const results = [];
const ok = (name, cond, extra='') => results.push(`${cond ? 'PASS' : 'FAIL'} ${name}${extra ? ' — ' + extra : ''}`);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const kbd = (el, key, opts={}) => el.dispatchEvent(new KeyboardEvent('keydown', {key, bubbles:true, cancelable:true, ...opts}));

window.addEventListener('load', async () => {
  try {
    const W = document.getElementById('f').contentWindow;
    const D = W.document;
    W.localStorage.clear();
    W.document.cookie = 'fantaasta_bk=;max-age=0;path=/';
    W.location.reload();
    await sleep(700);
    const W2 = document.getElementById('f').contentWindow, D2 = W2.document;
    const $ = s => D2.querySelector(s);

    ok('boot: crediti 1000', $('#stCred').textContent === '1000', $('#stCred').textContent);
    ok('boot: slot 25', $('#stSlots').textContent === '25');
    ok('boot: meters 4', D2.querySelectorAll('.meter').length === 4);
    ok('boot: rosa tab con 25 righe slot', D2.querySelectorAll('#tabbody tbody tr').length === 25);
    ok('boot: advice presente', D2.querySelectorAll('#advice .chip').length >= 10, String(D2.querySelectorAll('#advice .chip').length));

    // search
    const q = $('#q');
    q.value = 'svil'; q.dispatchEvent(new Event('input', {bubbles:true}));
    await sleep(100);
    ok('search: risultati aperti', $('#results').classList.contains('open'));
    ok('search: Svilar primo', $('#results .res .nm')?.textContent === 'Svilar', $('#results .res .nm')?.textContent);
    ok('search: badge wishlist con max', /P1 #1.*max 65/.test($('#results .res .wish')?.textContent || ''), $('#results .res .wish')?.textContent);

    // buy flow: Enter -> price -> Enter
    kbd(q, 'Enter');
    await sleep(100);
    ok('buy: card aperta', !$('#buycard').hidden);
    ok('buy: prezzo autofocus', D2.activeElement === $('#price'), D2.activeElement?.id);
    ok('buy: cap assoluto 976', $('#buycard').textContent.includes('976'));
    $('#price').value = '62';
    kbd($('#price'), 'Enter');
    await sleep(150);
    ok('buy: crediti 938', $('#stCred').textContent === '938', $('#stCred').textContent);
    ok('buy: card chiusa e focus su search', $('#buycard').hidden && D2.activeElement === q);
    ok('buy: rosa 1/25', $('#cntRosa').textContent === '1/25', $('#cntRosa').textContent);

    // dynamic budget + plan delta
    const dv = W2.derive();
    ok('plan: indicatore vs piano', /^[+\-−]?\d+$/.test($('#stPlan').textContent.trim()), $('#stPlan').textContent);
    ok('plan: factor = residuo/pianificato', Math.abs(dv.factor - dv.left / dv.emptyPlanSum) < 1e-9, String(dv.factor));
    ok('plan: delta = residuo - pianificato', dv.planDelta === dv.left - dv.emptyPlanSum, String(dv.planDelta));

    // scarcity helper excludes bought players
    ok('scarsità: P1 esclude Svilar', !W2.slotAvailable('P1', dv).some(x => x.p.name === 'Svilar'));

    // csv export
    const csv = W2.buildCsv();
    ok('csv: header', csv.split('\r\n')[0] === 'slot;ruolo;nome;squadra;prezzo', csv.split('\r\n')[0]);
    ok('csv: 26 righe (header + 25 slot)', csv.split('\r\n').length === 26, String(csv.split('\r\n').length));
    ok('csv: Svilar a 62', /;Svilar;[^;]*;62/.test(csv));

    // buy card: "Se lo perdi" + tetto slot (open first advice chip)
    D2.querySelector('#advice .chip').click();
    await sleep(120);
    const altsTxt = $('#bcalts')?.textContent || '';
    ok('alts: sezione presente', /Se lo perdi|Ultimo della lista/.test(altsTxt), altsTxt.slice(0, 50));
    ok('alts: tetto slot valorizzato', /\d/.test($('#capSlot')?.textContent || ''), $('#capSlot')?.textContent);
    kbd(D2.body, 'Escape');
    await sleep(80);

    // buy same player again should show "già tuo"
    q.value = 'svilar'; q.dispatchEvent(new Event('input', {bubbles:true}));
    await sleep(80);
    ok('search: tag mio su Svilar', /mio · 62/.test($('#results')?.textContent || ''));

    // gone flow: Shift+Enter -> price -> buyer key
    q.value = 'butez'; q.dispatchEvent(new Event('input', {bubbles:true}));
    await sleep(80);
    kbd(q, 'Enter', {shiftKey:true});
    await sleep(120);
    ok('gone: card compratore aperta', !!$('#gonePrice'), $('#buycard')?.hidden ? 'hidden' : 'shown');
    $('#gonePrice').value = '25';
    kbd($('#gonePrice'), 'Enter');
    await sleep(80);
    ok('gone: step compratore', D2.activeElement === $('#goneWho'), D2.activeElement?.id);
    kbd($('#goneWho'), '1');
    await sleep(120);
    const lastGone = W2.state.actions[W2.state.actions.length - 1];
    ok('gone: prezzo e compratore registrati', lastGone.t === 'gone' && lastGone.price === 25 && lastGone.buyer === W2.state.oppNames[0], JSON.stringify({p:lastGone.price, b:lastGone.buyer}));
    const dOpp = W2.derive();
    ok('opp: budget avversario scalato', dOpp.opps[0].left === 975, String(dOpp.opps[0].left));
    ok('opp: slot P avversario scalato', dOpp.opps[0].cnt.P === 1, String(dOpp.opps[0].cnt.P));
    ok('opp: oppbar renderizzata', D2.querySelectorAll('#oppbar .opp').length === 9, String(D2.querySelectorAll('#oppbar .opp').length));
    q.value = 'butez'; q.dispatchEvent(new Event('input', {bubbles:true}));
    await sleep(80);
    ok('gone: tag andato su Butez', /andato/.test($('#results')?.textContent || ''));

    // gone flow fallback: Esc sul prezzo registra senza dettagli
    q.value = 'thiam'; q.dispatchEvent(new Event('input', {bubbles:true}));
    await sleep(80);
    kbd(q, 'Enter', {shiftKey:true});
    await sleep(100);
    kbd($('#gonePrice'), 'Escape');
    await sleep(100);
    const lastGone2 = W2.state.actions[W2.state.actions.length - 1];
    ok('gone: Esc registra senza dettagli', lastGone2.t === 'gone' && lastGone2.name === 'Thiam' && !lastGone2.buyer, JSON.stringify({n:lastGone2.name, b:lastGone2.buyer}));
    W2.undo();
    await sleep(80);

    // fantascore
    ok('score: presente sui giocatori', W2.DATA.players.every(p => typeof p.score === 'number'), 'score mancante');
    ok('score: range 1-99', W2.DATA.players.every(p => p.score >= 1 && p.score <= 99));
    // walk-away su chip advice
    D2.querySelector('#advice .chip').click();
    await sleep(120);
    ok('walkaway: valorizzato', /\d/.test($('#capWalk')?.textContent || ''), $('#capWalk')?.textContent);
    ok('walkaway: info presenti', !!$('#walkinfo'), 'manca #walkinfo');
    kbd(D2.body, 'Escape');
    await sleep(80);

    // price cap enforcement: try to buy Martinez L. for 999
    q.value = 'martinez l'; q.dispatchEvent(new Event('input', {bubbles:true}));
    await sleep(80);
    kbd(q, 'Enter');
    await sleep(80);
    $('#price').value = '999';
    kbd($('#price'), 'Enter');
    await sleep(80);
    ok('cap: acquisto oltre cap bloccato', $('#buyerr').textContent.includes('al massimo'), $('#buyerr').textContent.slice(0,60));
    kbd($('#price'), 'Escape');
    await sleep(80);

    // listone: colonna e ordinamento score
    D2.querySelector('#tabs button[data-tab="listone"]').click();
    await sleep(120);
    const lsort = D2.querySelector('#lsort');
    ok('listone: opzione score', !!lsort.querySelector('option[value="score"]'));
    lsort.value = 'score'; lsort.dispatchEvent(new Event('change', {bubbles:true}));
    await sleep(100);
    const scoreCells = [...D2.querySelectorAll('#lrows tr td:nth-child(6)')].slice(0, 5).map(td => parseInt(td.textContent, 10));
    ok('listone: ordinato per score desc', scoreCells.every((v, i) => i === 0 || scoreCells[i-1] >= v), scoreCells.join(','));
    D2.querySelector('#tabs button[data-tab="rosa"]').click();
    await sleep(100);

    // persistence
    const st = JSON.parse(W2.localStorage.getItem('fantaasta_2627_v1') || '{}');
    ok('persist: 2 azioni in localStorage', (st.actions || []).length === 2, String((st.actions||[]).length));
    ok('persist: oppNames salvati', (st.oppNames || []).length === 9, String((st.oppNames||[]).length));
    ok('persist: cookie backup scritto', W2.document.cookie.includes('fantaasta_bk='));

    // undo
    kbd(D2.body, 'z', {ctrlKey:true});
    await sleep(100);
    const st2 = JSON.parse(W2.localStorage.getItem('fantaasta_2627_v1') || '{}');
    ok('undo: 1 azione dopo ctrl+z', (st2.actions || []).length === 1, String((st2.actions||[]).length));

    // tabs
    for (const [tab, probe] of [['liste', '.wl-slot'], ['listone', '#lrows tr'], ['log', '.logrow'], ['news', '.alert-item']]) {
      D2.querySelector(`#tabs button[data-tab="${tab}"]`).click();
      await sleep(120);
      ok(`tab ${tab}: contenuto`, D2.querySelectorAll(`#tabbody ${probe}`).length > 0, String(D2.querySelectorAll(`#tabbody ${probe}`).length));
    }
    // news: rigoristi table has 20 teams
    ok('news: rigoristi 20 squadre', D2.querySelectorAll('#tabbody .newsblock table tbody tr').length === 20, String(D2.querySelectorAll('#tabbody .newsblock table tbody tr').length));

    // reload persistence
    W2.location.reload();
    await sleep(700);
    const D3 = document.getElementById('f').contentWindow.document;
    ok('reload: crediti ancora 938', D3.querySelector('#stCred').textContent === '938', D3.querySelector('#stCred').textContent);

    // simulation mode
    const W3 = document.getElementById('f').contentWindow, D5 = W3.document;
    D5.querySelector('#btnSim').click();
    await sleep(150);
    ok('sim: banner e body.sim', !D5.querySelector('#simbar').hidden && D5.body.classList.contains('sim'));
    ok('sim: stato pulito a 1000', D5.querySelector('#stCred').textContent === '1000', D5.querySelector('#stCred').textContent);
    W3.simNext();
    await sleep(120);
    ok('sim: chiamata aperta con quota bot', !!D5.querySelector('#buycard .simline'), D5.querySelector('#buycard')?.hidden ? 'hidden' : 'no simline');
    kbd(D5.body, 'Escape');
    await sleep(120);
    const simSt = JSON.parse(W3.localStorage.getItem('fantaasta_2627_sim') || '{}');
    const lastSim = (simSt.actions || [])[(simSt.actions || []).length - 1] || {};
    ok('sim: il bot ha comprato', lastSim.t === 'gone' && (lastSim.price ?? 0) >= 1, JSON.stringify({t:lastSim.t, p:lastSim.price, b:lastSim.buyer}));
    D5.querySelector('#simAutoBtn').click();
    await sleep(250);
    ok('sim: auto x10', W3.state.actions.length >= 11, String(W3.state.actions.length));
    const realSt = JSON.parse(W3.localStorage.getItem('fantaasta_2627_v1') || '{}');
    ok('sim: asta vera intatta', (realSt.actions || []).length === 1, String((realSt.actions||[]).length));
    ok('sim: cookie backup non toccato dalla sim', W3.document.cookie.includes('fantaasta_bk='));
    D5.querySelector('#simExitBtn').click();
    await sleep(150);
    ok('sim: uscita ripristina asta vera', D5.querySelector('#stCred').textContent === '938', D5.querySelector('#stCred').textContent);

    // report tab
    D5.querySelector('#tabs button[data-tab="report"]').click();
    await sleep(120);
    ok('report: acquisti con Svilar', /Svilar/.test(D5.querySelector('#tabbody')?.textContent || ''));
    ok('report: sezioni presenti', /[Ss]peso/.test(D5.querySelector('#tabbody')?.textContent || '') && D5.querySelectorAll('#tabbody table').length >= 2, String(D5.querySelectorAll('#tabbody table').length));
    D5.querySelector('#tabs button[data-tab="rosa"]').click();
    await sleep(100);

    // second screen (mirror ?view=liste)
    const f2 = document.createElement('iframe');
    f2.src = 'index.html?view=liste';
    f2.style.cssText = 'width:1000px;height:600px';
    document.body.appendChild(f2);
    await new Promise(r => f2.addEventListener('load', r));
    await sleep(400);
    const W6 = f2.contentWindow, D6 = W6.document;
    ok('mirror: liste renderizzate', D6.querySelectorAll('.wl-slot').length >= 20, String(D6.querySelectorAll('.wl-slot').length));
    ok('mirror: colonna ricerca nascosta', getComputedStyle(D6.querySelector('main>section')).display === 'none');
    ok('mirror: azioni header nascoste', getComputedStyle(D6.querySelector('.hactions')).display === 'none');
    ok('mirror: stato condiviso (Svilar mio)', !!D6.querySelector('.wl-list li.mine'));
    const W7 = document.getElementById('f').contentWindow;
    W7.doGone(W7.findPlayer('Meret', 'Napoli'));
    await sleep(500);
    ok('mirror: sync live su storage event', [...D6.querySelectorAll('.wl-list li.dead .nm')].some(el => /Meret/.test(el.textContent)), 'Meret non depennato nel mirror');
    W7.undo();
    await sleep(200);
    f2.remove();
  } catch (e) {
    results.push('EXCEPTION ' + (e.stack || e));
  }
  document.getElementById('out').textContent = 'TESTRESULTS\n' + results.join('\n') + '\nDONE';
  try { await fetch('/__RESULTS__?' + encodeURIComponent(results.join('|'))); } catch (e) {}
});
</script>
