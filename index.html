<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FantaAsta 2026-27 · Sala d'asta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=Spline+Sans+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c1210; --panel:#131c18; --panel2:#0f1613; --raise:#182420;
  --line:#233129; --line2:#2e4136;
  --ink:#eaf1ec; --mut:#8fa39a; --faint:#5d6f66;
  --volt:#c6f14d; --volt-ink:#16200a; --gold:#ecc65c;
  --warn:#f5a524; --bad:#ff5d5d; --ok:#43cf8e;
  --rP:#f2a33c; --rD:#43cf8e; --rC:#5aabff; --rA:#ff6363;
  --radius:10px;
  --num:'Spline Sans Mono',ui-monospace,'SF Mono',monospace;
  --cond:'Barlow Condensed','Arial Narrow',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scrollbar-color:#2e4136 #0c1210}
body{
  background:
    radial-gradient(1200px 500px at 50% -180px, rgba(198,241,77,.07), transparent 60%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.011) 0 90px, transparent 90px 180px),
    var(--bg);
  color:var(--ink);
  font:15px/1.45 Barlow,system-ui,sans-serif;
  min-height:100vh;
}
b,strong{font-weight:600}
button{font:inherit;cursor:pointer;border:1px solid var(--line2);background:var(--raise);color:var(--ink);border-radius:8px;padding:6px 12px;transition:.15s}
button:hover{border-color:var(--volt);color:var(--volt)}
button.primary{background:var(--volt);border-color:var(--volt);color:var(--volt-ink);font-weight:700}
button.primary:hover{filter:brightness(1.1);color:var(--volt-ink)}
button.ghost{background:transparent}
button.danger:hover{border-color:var(--bad);color:var(--bad)}
input,select{font:inherit;background:var(--panel2);border:1px solid var(--line2);color:var(--ink);border-radius:8px;padding:7px 10px;outline:none}
input:focus,select:focus{border-color:var(--volt)}
::placeholder{color:var(--faint)}
h2{font-family:var(--cond);text-transform:uppercase;letter-spacing:.08em;font-size:15px;font-weight:600;color:var(--mut)}

/* ---------- header scoreboard ---------- */
header{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(180deg,#0e1512 0%,rgba(14,21,18,.94) 100%);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(8px);
  padding:10px 22px;
  display:flex;align-items:center;gap:26px;flex-wrap:wrap;
}
.brand{font-family:var(--cond);font-weight:700;font-size:26px;letter-spacing:.04em;text-transform:uppercase}
.brand em{font-style:normal;color:var(--volt)}
.brand small{display:block;font-size:11px;letter-spacing:.28em;color:var(--mut);font-weight:500}
.score{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.stat{min-width:64px}
.stat label{display:block;font-family:var(--cond);text-transform:uppercase;letter-spacing:.14em;font-size:10.5px;color:var(--mut)}
.stat b{font-family:var(--num);font-size:22px;font-weight:700;letter-spacing:-.02em}
.stat.hero b{font-size:34px;color:var(--gold);text-shadow:0 0 24px rgba(236,198,92,.35)}
.stat b.flash{animation:flash .6s}
@keyframes flash{0%{color:var(--volt)}100%{}}
.meters{display:grid;grid-template-columns:repeat(4,minmax(90px,120px));gap:6px 14px;margin-left:8px}
.meter{font-size:11px}
.meter .mrow{display:flex;justify-content:space-between;color:var(--mut);font-family:var(--num);font-size:10.5px}
.meter .mrow b:first-child{color:var(--ink)}
.meter .bar{height:5px;border-radius:3px;background:var(--line);margin-top:3px;overflow:hidden}
.meter .bar i{display:block;height:100%;border-radius:3px;transition:width .3s}
.meter.over .bar i{background:var(--warn)!important}
.meter.over .mrow{color:var(--warn)}
.hactions{margin-left:auto;display:flex;gap:8px;align-items:center}
.hactions button{padding:5px 10px;font-size:13px}

/* ---------- opponents strip ---------- */
#oppbar{max-width:1560px;margin:10px auto 0;padding:0 22px;display:flex;gap:8px;flex-wrap:wrap}
.opp{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12px;display:flex;gap:8px;align-items:baseline;white-space:nowrap}
.opp .on{font-family:var(--cond);text-transform:uppercase;letter-spacing:.05em;font-size:12px;color:var(--mut)}
.opp .ol{font-family:var(--num);font-size:14px;font-weight:700;color:var(--gold)}
.opp .os{font-family:var(--num);font-size:10.5px;color:var(--faint)}
.opp .om{font-family:var(--num);font-size:10.5px;color:var(--mut)}
.opp.done{opacity:.45}
.opp.rich .ol{color:var(--volt)}

/* ---------- gone card & walk-away ---------- */
.gonewho{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.gonewho button{font-size:12.5px;padding:4px 9px}
.gonewho button b{font-family:var(--num);color:var(--volt);margin-right:5px}
#goneWho{width:120px;font-family:var(--num)}
.cap.walk{border-color:rgba(198,241,77,.4)}
.cap.walk b{color:var(--volt)}
#walkinfo{font-size:12.5px;color:var(--mut);margin:2px 0 8px}
#walkinfo b{color:var(--ink)}
.scpill{font-family:var(--num);font-size:11px;border:1px solid var(--line2);border-radius:5px;padding:1px 6px;color:var(--mut);white-space:nowrap}
.scpill.hi{color:var(--volt);border-color:rgba(198,241,77,.4)}
.scpill.mid{color:var(--gold);border-color:rgba(236,198,92,.4)}

/* ---------- mirror (second screen) ---------- */
body.mini main{grid-template-columns:1fr}
body.mini main>section:first-child,body.mini .hactions,body.mini #simbar{display:none}
body.mini .tabbody{pointer-events:none}
body.mini .tabs{top:0}
.minitag{font-family:var(--cond);text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--rC);border:1px solid rgba(90,171,255,.4);border-radius:5px;padding:1px 8px;margin-left:10px}

/* ---------- report ---------- */
.repgrid{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.rep-deal{color:var(--ok);font-family:var(--num);font-size:13px}
.rep-over{color:var(--warn);font-family:var(--num);font-size:13px}

/* ---------- simulation mode ---------- */
#simbar{margin:10px 0 0;padding:8px 12px;border:1px dashed rgba(245,165,36,.6);border-radius:8px;font-size:13px;color:var(--warn);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#simbar[hidden]{display:none}
#simbar button{padding:3px 10px;font-size:12.5px}
body.sim header{border-bottom-color:rgba(245,165,36,.7)}
body.sim #btnSim{border-color:var(--warn);color:var(--warn)}
.simline{margin-top:8px;font-size:13.5px;color:var(--warn)}
.simline b{font-family:var(--num)}

/* ---------- layout ---------- */
main{max-width:1560px;margin:18px auto;padding:0 22px;display:grid;grid-template-columns:minmax(400px,4.4fr) 7fr;gap:20px;align-items:start}
@media(max-width:1080px){main{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}

/* ---------- search ---------- */
.searchbox{position:relative}
#q{
  width:100%;padding:15px 18px;font-size:19px;border-radius:12px;
  background:var(--panel);border:1px solid var(--line2);
  box-shadow:0 8px 30px rgba(0,0,0,.35);
}
#q:focus{border-color:var(--volt);box-shadow:0 0 0 3px rgba(198,241,77,.14),0 8px 30px rgba(0,0,0,.35)}
.hint{margin:7px 4px 0;font-size:12px;color:var(--faint)}
.hint kbd{background:var(--raise);border:1px solid var(--line2);border-radius:4px;padding:0 5px;font-family:var(--num);font-size:11px;color:var(--mut)}
#results{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:40;background:var(--panel);border:1px solid var(--line2);border-radius:12px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.55);display:none}
#results.open{display:block}
.res{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.res:last-child{border-bottom:0}
.res.sel{background:rgba(198,241,77,.09)}
.res .nm{font-weight:600;font-size:15.5px;white-space:nowrap}
.res .tm{color:var(--mut);font-size:13px}
.res .fig{margin-left:auto;font-family:var(--num);font-size:12px;color:var(--mut);white-space:nowrap}
.res.dead .nm,.res.dead .tm{text-decoration:line-through;color:var(--faint)}
.res .why{font-size:11.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.rb{font-family:var(--cond);font-weight:700;font-size:12px;width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;flex:none;color:#10150d}
.rb.P{background:var(--rP)}.rb.D{background:var(--rD)}.rb.C{background:var(--rC)}.rb.A{background:var(--rA)}
.wish{font-family:var(--num);font-size:11px;background:rgba(198,241,77,.13);color:var(--volt);border:1px solid rgba(198,241,77,.3);border-radius:5px;padding:1px 6px;white-space:nowrap}
.sleep{font-family:var(--num);font-size:11px;background:rgba(90,171,255,.12);color:var(--rC);border:1px solid rgba(90,171,255,.3);border-radius:5px;padding:1px 6px;white-space:nowrap}
.tag{font-family:var(--cond);text-transform:uppercase;font-size:10.5px;letter-spacing:.08em;border-radius:5px;padding:1px 7px}
.tag.mine{background:rgba(67,207,142,.15);color:var(--ok);border:1px solid rgba(67,207,142,.4)}
.tag.gone{background:rgba(255,93,93,.12);color:var(--bad);border:1px solid rgba(255,93,93,.35)}
.adot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none;box-shadow:0 0 8px var(--warn)}

/* ---------- buy card ---------- */
#buycard{margin-top:14px;padding:16px 18px;border-color:var(--line2);box-shadow:0 14px 40px rgba(0,0,0,.4);animation:pop .18s}
@keyframes pop{from{transform:translateY(-6px);opacity:0}}
#buycard .bctop{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
#buycard .bcname{font-family:var(--cond);font-size:30px;font-weight:700;letter-spacing:.01em}
#buycard .bcteam{color:var(--mut)}
#buycard .figs{margin-left:auto;font-family:var(--num);font-size:13px;color:var(--mut)}
.bcwish{margin:10px 0 4px;display:flex;flex-direction:column;gap:5px}
.bcwish .wrow{font-size:13.5px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.bcwish .wrow .pos{font-family:var(--num);color:var(--volt);font-size:12.5px;white-space:nowrap}
.bcwish .wrow .nt{color:var(--mut);font-size:12.5px}
.bcalert{margin-top:8px;font-size:13px;color:var(--warn);display:flex;gap:8px;align-items:baseline}
.bcrig{margin-top:8px;font-size:12.5px;color:var(--mut)}
.caps{display:flex;gap:10px;margin:12px 0;flex-wrap:wrap}
.cap{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 12px;min-width:96px}
.cap label{display:block;font-family:var(--cond);text-transform:uppercase;font-size:10px;letter-spacing:.12em;color:var(--faint)}
.cap b{font-family:var(--num);font-size:19px}
.cap.main b{color:var(--volt)}
.bcalts{margin:2px 0 10px}
.bcalts .altshead{font-family:var(--cond);text-transform:uppercase;letter-spacing:.1em;font-size:11px;color:var(--faint);margin-bottom:3px}
.bcalts .altrow{display:flex;gap:8px;align-items:baseline;font-size:13px;padding:2px 0}
.bcalts .pr{font-family:var(--num);color:var(--faint);font-size:11px}
.bcalts .tm{color:var(--mut);font-size:12.5px}
.bcalts .mx{font-family:var(--num);color:var(--gold);font-size:12px}
.buyrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
#price{width:130px;font-family:var(--num);font-size:24px;font-weight:700;padding:8px 12px;text-align:center}
#slotSel{max-width:230px}
.buyerr{color:var(--bad);font-size:13px;margin-top:8px;min-height:18px}

/* ---------- advice ---------- */
.advice{margin-top:16px;padding:14px 16px}
.advice h2{margin-bottom:10px}
.adv-role{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:13.5px}
.chip:hover{border-color:var(--volt)}
.chip .px{font-family:var(--num);color:var(--gold);font-size:12px}
.chip .sl{font-family:var(--num);color:var(--faint);font-size:11px}
.chip .sc{font-family:var(--num);font-size:10.5px;color:var(--warn)}
.chip.scarce{border-color:rgba(245,165,36,.55)}
.chip.last{border-color:rgba(255,93,93,.6)}
.chip.last .sc{color:var(--bad)}
.scbadge{font-family:var(--num);font-size:10.5px;color:var(--warn);border:1px solid rgba(245,165,36,.4);border-radius:4px;padding:0 5px;margin-left:6px;white-space:nowrap}
.scbadge.last{color:var(--bad);border-color:rgba(255,93,93,.45)}
.adjup{color:var(--ok);font-weight:600}
.adjdown{color:var(--warn);font-weight:600}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:4px;padding:8px 10px;border-bottom:1px solid var(--line);position:sticky;top:74px;background:var(--panel);z-index:30;border-radius:var(--radius) var(--radius) 0 0;flex-wrap:wrap}
.tabs button{border:0;background:transparent;color:var(--mut);font-family:var(--cond);text-transform:uppercase;letter-spacing:.08em;font-size:14.5px;font-weight:600;padding:7px 14px;border-radius:7px}
.tabs button.on{background:var(--raise);color:var(--volt)}
.tabs .cnt{font-family:var(--num);font-size:11px;opacity:.8}
.tabbody{padding:14px 16px;min-height:300px}

/* rosa */
.rgroup{margin-bottom:18px}
.rghead{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.rghead h3{font-family:var(--cond);text-transform:uppercase;letter-spacing:.1em;font-size:16px}
.rghead .rgfig{font-family:var(--num);font-size:12px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-family:var(--cond);text-transform:uppercase;letter-spacing:.09em;font-size:11px;color:var(--faint);text-align:left;padding:4px 8px;border-bottom:1px solid var(--line)}
td{padding:6px 8px;border-bottom:1px solid var(--line)}
tr:hover td{background:rgba(255,255,255,.02)}
td.num,th.num{text-align:right;font-family:var(--num);font-size:13px}
.slotid{font-family:var(--num);color:var(--faint);font-size:12px}
.owned{color:var(--ok);font-weight:600}
.emptyslot{color:var(--faint)}
.nexthint{color:var(--mut);font-size:12.5px}
.nexthint b{color:var(--ink);font-weight:500}
.xbtn{border:0;background:none;color:var(--faint);padding:2px 6px;font-size:14px}
.xbtn:hover{color:var(--bad)}

/* liste */
.wl-slot{margin-bottom:16px}
.wl-slot>header{position:static;display:flex;gap:10px;align-items:baseline;background:none;border:0;padding:4px 0;backdrop-filter:none}
.wl-slot h3{font-family:var(--cond);font-size:16px;text-transform:uppercase;letter-spacing:.06em}
.wl-slot .wsb{font-family:var(--num);color:var(--gold);font-size:12px}
.wl-list{list-style:none}
.wl-list li{display:flex;gap:9px;align-items:baseline;padding:5px 6px;border-bottom:1px dashed var(--line);cursor:pointer;flex-wrap:wrap}
.wl-list li:hover{background:rgba(255,255,255,.025)}
.wl-list .pr{font-family:var(--num);color:var(--faint);font-size:12px;width:18px;flex:none}
.wl-list .nm{font-weight:600}
.wl-list .tm,.wl-list .ti{color:var(--mut);font-size:12.5px}
.wl-list .mx{margin-left:auto;font-family:var(--num);color:var(--gold);font-size:12.5px;white-space:nowrap}
.wl-list li.dead .nm,.wl-list li.dead .tm{text-decoration:line-through;color:var(--faint)}
.wl-list li.mine .nm{color:var(--ok)}
.wl-list .note{flex-basis:100%;font-size:12px;color:var(--faint);padding-left:27px}
.rig-yes{color:var(--gold);font-size:12px}
.filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.fchip{border-radius:20px;padding:4px 14px;font-family:var(--cond);text-transform:uppercase;letter-spacing:.06em;font-size:13px}
.fchip.on{background:var(--volt);color:var(--volt-ink);border-color:var(--volt);font-weight:700}

/* log */
.logrow{display:flex;gap:10px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line);font-size:14px;flex-wrap:wrap}
.logrow .lt{font-family:var(--num);color:var(--faint);font-size:11px;width:44px}
.logrow input{padding:3px 8px;font-family:var(--num);font-size:13px}
.logrow input.pz{width:70px}
.logrow input.by{width:130px}

/* news */
.newsblock{margin-bottom:20px}
.alert-item{display:flex;gap:9px;padding:7px 4px;border-bottom:1px dashed var(--line);font-size:13.5px;align-items:baseline}
.alert-item .at{font-family:var(--cond);text-transform:uppercase;font-size:10.5px;letter-spacing:.08em;border-radius:4px;padding:1px 7px;flex:none}
.at.infortunio{background:rgba(255,93,93,.14);color:var(--bad)}
.at.mercato{background:rgba(90,171,255,.14);color:var(--rC)}
.at.ballottaggio{background:rgba(245,165,36,.14);color:var(--warn)}
.at.ok{background:rgba(67,207,142,.14);color:var(--ok)}
.at.squalifica{background:rgba(255,93,93,.14);color:var(--bad)}
.at.fairplay{background:rgba(186,120,255,.14);color:#ba78ff}
.srcs{font-size:12px;color:var(--faint);line-height:1.8}

/* toast */
#toasts{position:fixed;left:20px;bottom:20px;z-index:100;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--raise);border:1px solid var(--line2);border-left:3px solid var(--volt);border-radius:8px;padding:10px 16px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:pop .2s}
.toast.err{border-left-color:var(--bad)}
.toast.warn{border-left-color:var(--warn)}

/* dialog */
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line2);border-radius:12px;padding:20px 22px;min-width:320px}
dialog::backdrop{background:rgba(5,8,7,.7)}
dialog h2{margin-bottom:14px;color:var(--ink)}
.setrow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.setrow label{width:150px;color:var(--mut);font-size:14px}
.setrow input{width:90px;font-family:var(--num)}
.dlgbtns{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.footer-note{max-width:1560px;margin:8px auto 30px;padding:0 22px;color:var(--faint);font-size:12px}
</style>
</head>
<body>

<header>
  <div class="brand">Fanta<em>·</em>Asta <small>Serie A 2026–27 · Classic</small></div>
  <div class="score">
    <div class="stat hero"><label>Crediti rimasti</label><b id="stCred">–</b></div>
    <div class="stat"><label>Speso</label><b id="stSpent">–</b></div>
    <div class="stat"><label>Slot liberi</label><b id="stSlots">–</b></div>
    <div class="stat"><label>Media / slot</label><b id="stAvg">–</b></div>
    <div class="stat"><label>Max singolo</label><b id="stCap">–</b></div>
    <div class="stat" title="Residuo reale meno somma dei budget pianificati degli slot vuoti"><label>Vs piano</label><b id="stPlan">–</b></div>
    <div class="meters" id="meters"></div>
  </div>
  <div class="hactions">
    <button id="btnUndo" title="Annulla ultima operazione (Ctrl+Z)">↩ Undo</button>
    <button id="btnMirror" title="Apri le Liste in una finestra separata (secondo schermo, sola lettura, si aggiorna da sola)">⧉</button>
    <button id="btnSim" title="Modalità simulazione: prova generale con bot, senza toccare l'asta vera">🤖</button>
    <button id="btnSet" title="Budget e impostazioni">⚙</button>
    <button id="btnExp" title="Scarica backup JSON">⬇</button>
    <button id="btnImp" title="Ripristina da backup">⬆</button>
    <button id="btnCsv" title="Scarica la rosa in CSV (Excel)">CSV</button>
    <button id="btnReset" class="danger" title="Azzera l'asta">✕</button>
    <input type="file" id="impFile" accept=".json" hidden>
  </div>
</header>

<div id="oppbar"></div>

<main>
  <section>
    <div class="searchbox">
      <input id="q" placeholder="Digita un nome o una squadra…" autocomplete="off" spellcheck="false" autofocus>
      <div id="results"></div>
    </div>
    <div class="hint"><kbd>↑↓</kbd> scegli · <kbd>Invio</kbd> l'ho comprato · <kbd>Shift+Invio</kbd> preso da altri (poi prezzo + tasto <kbd>1-9</kbd> per chi) · <kbd>Esc</kbd> pulisci · <kbd>Ctrl+Z</kbd> undo</div>

"punizioni":"Vlasic, Oristanio, Ilic","corner":"Vlasic, Oristanio, Ilic"},"Udinese":{"rigori":"Davis K. (4/4) confermato unanime; Solet 2°, Zaniolo 3°","punizioni":"ZANIOLO 1° (fantacalcio.it), Vojvoda, Ekkelenkamp, Miller L.","corner":"Vojvoda, Ekkelenkamp, Miller L., Zaniolo"},"Venezia":{"rigori":"CAMBIATO verso ADAMS A.: 1° per 5 fonti (Sky/Fantacalcio.it/Goal/F-online/TMW) contro la sola FantaMaster per Rrahmani (SOS: parità). Doppietta in Coppa ma su azione. YEBOAH NON è designato (2/4 scorsa stagione, solo alternativa)","punizioni":"BUSIO 1°, Yeboah 2° (fantacalcio.it), Basic, Helgason","corner":"Busio, Perez K., Basic, Helgason"}},"alerts":[{"name":"Nkunku","team":"Milan","type":"mercato","text":"AGGRAVATO: fuori progetto con Tomori/Fofana/Odogu, allenamenti separati, per Calciomercato.com avrebbe già lasciato la città. La Roma è alla finestra ma NESSUNA trattativa avviata (Milan apre al prestito con parte d'ingaggio, chiede 35M a titolo definitivo); Barcellona smentito. NON comprare."},{"name":"Leao","team":"Milan","type":"mercato","text":"CAMBIATO: il Milan ha ABBASSATO la richiesta a 40-45M (da ~60) e Amorim ha dato l'ok alla cessione ('deve lottare per il posto'); rilancio Gala atteso a 45M (Fotomac 16/8). Più il quadricipite (in dubbio 1ª-2ª): il rischio è SALITO, ora esiste un prezzo pagabile. EVITARE finché il mercato è aperto."},{"name":"Maignan","team":"Milan","type":"ballottaggio","text":"CONFLITTO TRA FILONI, ballottaggio VERO: il filone porte (Fantacalcio.it/MilanNews24 16/8) lo dà favorito 65-70% dopo il rientro anticipato; il filone probabili (milanvibes/milanreports) dà TORRIANI 60-65 — Maignan è rientrato a Milanello solo il 15-16/8 con zero precampionato (Sportmediaset pro-Maignan). Trattarlo come 50/50 fino alle rifiniture: non pagare la porta Milan da titolare certo."},{"name":"Ramos G.","team":"Milan","type":"ok","text":"ALZARE: rigorista 1° per TUTTE le fonti del 16/8 (11/13 in carriera) con Nkunku fuori rosa e Pulisic ko; titolare e gol col Man United (7,5). Il 9 del Milan senza rivali."},{"name":"Jashari","team":"Milan","type":"ok","text":"Perno d'avvio confermato dal campo (7 Sky col Man United, Rabiot rientrato solo il 16/8, Fofana verso la Juve). MA a regime la formazione-tipo dà Modric-Rabiot con Jashari alternativa: non pagarlo oltre 8-10."},{"name":"Pulisic","team":"Milan","type":"infortunio","text":"Out atteso fino a inizio settembre (microfrattura perone + edema) MA il dato non è più verificabile con fonti fresche di agosto: le uniche news trovate sono della stagione 25/26. Trattarlo come out per le prime, riverificare prima dell'asta."},{"name":"Gimenez","team":"Milan","type":"mercato","text":"MOLTO PIÙ AVANTI: accordo di massima Milan-Porto per prestito con DIRITTO oltre 20M (il Milan ha mollato l'obbligo), accordo giocatore-Porto trovato, annuncio atteso a ore. Frizioni: la caviglia in valutazione e l'inserimento del Betis. Lasciarlo."},{"name":"Gabbia","team":"Milan","type":"infortunio","text":"Caviglia, non convocato per lo United, entità NON quantificata: APERTO per la 1ª. Monitorare le rifiniture Milan."},{"name":"Gila","team":"Milan","type":"infortunio","text":"CONFLITTO DI FONTI: per noi era recuperato (entrato col Man United il 15/8) ma pianetafanta/SOS/FantaMaster segnalano LESIONE al retto femorale con rientro incerto. Braccetto sinistro titolare nel tipo di Amorim: verificare prima dell'asta, non pagarlo da certezza."},{"name":"Tomori","team":"Milan","type":"mercato","text":"Fuori dal progetto e fuori dai convocati. L'ipotesi scambio con NUNO TAVARES sale di peso (ora Repubblica + SportMediaset, non solo Il Messaggero): ostacolo ingaggio 3,5M vs tetto Lazio 2,5M, si studia la spalmatura. Nessun accordo. Non è una scommessa da fare."},{"name":"Thuram","team":"Inter","type":"infortunio","text":"Polpaccio: rimasto ad Appiano anche col Betis per lavoro supplementare; Chivu non forzerà (titolare solo se risolve del tutto, altrimenti spezzone). fantacalcio.it lo dà 80% titolare: ott .","team":"Napoli","type":"ballottaggio","text":"Titolare d'emergenza in coppia con Rrahmani MA Badiashile è IN CHIUSURA (call decisiva, visite 18/8): il rischio è concreto e imminente. Da 1-2 crediti, non di più."},{"name":"Badiashile","team":"Napoli","type":"mercato","text":"IN CHIUSURA: prestito oneroso + riscatto ~27M, 'call decisiva nelle prossime ore' (Fantacalcio.it 16/8), visite martedì 18/8 a Villa Stuart (insieme a Favasuli). Se listato in tempo è il titolare al posto di Marin."},{"name":"Noa Lang","team":"Napoli","type":"mercato","text":"Risulta IN USCITA dal Napoli (non più solo un caso infermeria); ginocchio mai chiarito. Doppia incertezza: lasciarlo."},{"name":"Gilmour","team":"Napoli","type":"infortunio","text":"NUOVO: indietro di condizione, lavoro personalizzato con Neres e Beukema. Non è un'opzione d'avvio."},{"name":"Vergara","team":"Napoli","type":"ok","text":"RECUPERATO (rientrato in gruppo): la scommessa da 1-2 crediti torna valida."},{"name":"Vicario","team":"Juventus","type":"mercato","text":"PORTA JUVE ancora nel caos ma il domino si muove: Suzuki al Villa SBLOCCA Dibu Martinez (nuova offerta ~7M+3, 'distanza minima' per Tuttosport/Sky vs 'resta difficile' per Mediaset — conflitto nello stesso giorno). Alternative aggiornate: Vicario (Tottenham apre al prestito con diritto per una fonte), Ederson, Trubin, Chevalier. Alla 1ª gioca PERIN (80-85%). Porta da non toccare all'asta salvo Perin a 2-3."},{"name":"Di Gregorio","team":"Juventus","type":"mercato","text":"Fuori dal progetto, non giocherà l'esordio ('stavolta gioca Perin' — Spalletti). Monza ci pensa (nessun contatto ufficiale) e spunta il VALENCIA (~15M prestito+obbligo); valutazione ~10M."},{"name":"Lucumì","team":"Juventus","type":"mercato","text":"VISITE FATTE il 16/8 al J-Medical: 18+2M, 5 anni a 3M. In ballottaggio con Kelly alla Juve; il buco che lascia al Bologna apre a VITIK/HEGGEM (entrambi low cost)."},{"name":"Kolo Muani","team":"Juventus","type":"ok","text":"Titolare certo, rigorista in pole per 4 fonti MA Goal 16/8 dà Yildiz e la designazione è dedotta (zero parole di Spalletti): premio-rigori ridotto. David ora VUOLE RESTARE (3 proposte rifiutate): concorrenza interna minima comunque."},{"name":"David","team":"Juventus","type":"mercato","text":"CAMBIATO: né PSG né Aston Villa arrivano ai ~30M chiesti (si ragiona di prestito con obbligo) e David avrebbe RIFIUTATO 3 proposte volendo restare a Torino (fonte canadese 15/8). Zirkzee vincolato alla sua uscita. Resta da lasciare: minutaggio incerto."},{"name":"Yildiz","team":"Juventus","type":"infortunio","text":"MIGLIORATO: superata la fase acuta della tendinopatia, parzialmente in gruppo con carichi progressivi, obiettivo 23/8. 'Non al 100%' confermato: rischio-gestione da prezzare."},{"name":"Thuram K.","team":"Juventus","type":"infortunio","text":"MIGLIORATO: tornato PARZIALMENTE in gruppo il 15/8 (non più 'saltata tutta la preparazione'). Per la 1ª resta difficile."},{"name":"Alajbegovic","team":"Juventus","type":"ballottaggio","text":"RIDIMENSIONATO: solo ALTERNATIVA nella formazione-tipo Juve ed è finito nelle scommesse-1-credito di Goal (bruciato). A 10 è caro: 5-6 max."},{"name":"Koopmeiners","team":"Juventus","type":"ballottaggio","text":"Invariato: alternativa da centrale di difesa, nessuna fonte lo mette nell'XI. Trappola a prezzo pieno."},{"name":"Kalulu","team":"Juventus","type":"ok","text":"Terzino destro titolare ma il ballottaggio con Celik resta APERTO (si sono alternati nelle amichevoli). Da difensore normale."},{"name":"Zhegrova","team":"Juventus","type":"mercato","text":"Nessuna notizia fresca 15-16/8: resta esubero (Trabzonspor/Besiktas ~12-14M). Non investire."},{"name":"Fofana Y.","team":"Milan","type":"mercato","text":"Verso la Juve (sì del giocatore, Milan chiede 17-18M) ma la contropartita Nico Gonzalez si complica: oggi lascerebbe la Juve solo per l'Atletico. Concorrenza Premier. Fuori progetto Milan: non comprarlo."},{"name":"Frattesi","team":"Lazio","type":"ok","text":"UFFICIALE alla Lazio: titolare atteso da Gattuso col Bologna MA in panchina al debutto di Coppa (Dele-Bashiru 70/30). Comprime il reparto (occhio Taylor). Investimento, non low cost."},{"name":"Zaccagni","team":"Lazio","type":"fairplay","text":"Rigorista 1° confermato (7 fonti), titolare col Mantova. NOVITÀ piazzati: le punizioni sono di ROVELLA (fantacalcio.it). Resta il malus disciplina (6 gialli + 1 rosso nel 25/26); insidia Pinamonti ridotta (trattativa ferma)."},{"name":"Cataldi","team":"Lazio","type":"infortunio","text":"PEGGIORATO: post-operatorio pubalgia, servono 2-3 settimane; prima finestra realistica Lazio-Genoa del 30/8. OUT per la 1ª e non più rigorista per nessuna fonte fresca (2° solo per Sky/Goal): l'assicurazione a 2-4 vale poco."},{"name":"Tavares N.","team":"Lazio","type":"infortunio","text":"Infiammazione al ginocchio (ha saltato TUTTE e 6 le amichevoli, consulto in Portogallo) + ipotesi scambio con Tomori RAFFORZATA (Repubblica/SportMediaset). Solo a saldo estremo. Nota: la formazione-tipo di Goal lo dà ancora titolare — non fidarsi."},{"name":"Pedraza","team":"Lazio","type":"ballottaggio","text":"Titolare a sinistra col Mantova (Tavares ko) MA la formazione-tipo lo esclude: low cost d'avvio a 1-2, non di più."},{"name":"Dia","team":"Lazio","type":"ballottaggio","text":"CONFLITTO TRA FONTI PRE-GARA: una probabile dà DIA da 9 col Mantova (Dia 55/Ratkov 35, lalaziosiamonoi), un'altra l'XI annunciato con RATKOV da 9 e Dia fuori. Noslin gioca comunque da ESTERNO, non da 9. Il conteso resta apertissimo: verificare il tabellino VERO di stasera; e se arriva Pinamonti diventano tutti riserve."},{"name":"Ratkov","team":"Lazio","type":"ballottaggio","text":"Conteso col Mantova: un XI annunciato lo dà da 9 titolare, la probabile concorrente dà Dia (55/35). Verificare il tabellino vero. Solo a 2-4, quadro instabile."},{"name":"Patric","team":"Lazio","type":"infortunio","text":"Out fino a ~3ª (protocollo clinico); out anche Gigot e Furlanetto (non verificabili su fonti live), Pellegrini Lu. a rischio (caviglia). Lazio ancora contata; e ROMAGNOLI è stato escluso dai convocati del 16/8 (vedi alert dedicato)."},{"name":"Isaksen","team":"Lazio","type":"infortunio","text":"PEGGIORATO: operato di ernia sportiva bilaterale (SOS), assente col Mantova; prima finestra 30/8 (pianetafanta lo dà '1ª giornata': discordanza, prudenza). Sconto d'avvio obbligato."},{"name":"Pinamonti","team":"Sassuolo","type":"mercato","text":"FRENATO: la Lazio dopo Frattesi ha 3-4M per DUE colpi → un'operazione da 12M regge solo a prestito quasi secco, e serve prima il rinnovo col Sassuolo (scadenza 2027). Icardi (svincolato) più compatibile col bilancio; Gazzetta: 'Piccoli il preferito'. Resta OUT dal Cesena per mercato. Il trigger-Bowie NON è attivabile oggi."},{"name":"Bowie","team":"Sassuolo","type":"ballottaggio","text":"RIDIMENSIONATO: è il vice-Pinamonti (alternativa nella formazione-tipo) e il trigger-Lazio è congelato dal budget biancoceleste. FantaMaster e Goal lo hanno già bruciato. Scommessa condizionata a 4-6, non di più."},{"name":"Berardi","team":"Sassuolo","type":"infortunio","text":"Non compare in nessuna tabella infortunati (buon segno) ma NESSUNA fonte lo dà in gruppo pieno e la probabile col Cesena lo esclude. Le sue parole (12/8): 'miglioriamo giorno dopo giorno'. Convocati del 17/8 = test decisivo. Scontare."},{"name":"Muric","team":"Sassuolo","type":"ok","text":"Titolare 75-80% (riscattato, ha chiesto lui di restare). CAMBIO: Turati RESTA come vice (pista Samp raffreddata) — il 'vice ignoto' non esiste più. Test finale: Sassuolo-Cesena 17/8. Prezzo ancora schiacciato = occasione."},{"name":"Obrador","team":"Sassuolo","type":"ok","text":"PROMOSSO: nella formazione-tipo del 16/8 la fascia sinistra del Sassuolo è SUA (Doig fuori dall'XI). Il ballottaggio si è ribaltato in una settimana: ora è Obrador il low cost mancino da prendere."},{"name":"Boloca","team":"Sassuolo","type":"infortunio","text":"Confermati lungodegenti: Boloca (settembre), Candè, Pieragnolo, Konè I. (gennaio: frattura tibia-perone), Walukiewicz (zero minuti). Lista ferma al 27/7: guardare i convocati col Cesena (17/8)."},{"name":"Suzuki","team":"Parma","type":"mercato","text":"FATTA: Parma→Aston Villa, 30M+5, contratto 5 anni, visite in corso (Sky/CorSport 16/8). Il PSG era saltato. Depennare; l'effetto domino sblocca Dibu-Juve. Il Parma resta senza portiere titolare designato oltre Corvi."},{"name":"Corvi","team":"Parma","type":"ok","text":"RAFFORZATO: Suzuki venduto E Daffara INFORTUNATO (lesione di basso grado alla coscia, rientro 2ª): alla 1ª è titolare senza rivali. Bruciato dalle guide (SOS/Goal): 3-5 crediti."},{"name":"Tourè E.","team":"Parma","type":"ballottaggio","text":"Titolare confermato; sui rigori Goal 16/8 lo dà 1° (unica fonte, F-online dà Bernabè): resta NON designato. Occhio a LONTANI (2008, doppietta in Coppa, NON listato): insidia minutaggio. Pagarlo da titolare."},{"name":"Romero D.","team":"Parma","type":"ok","text":"SALITO: titolare nel tridente della formazione-tipo del Parma (con Elphege e Tourè). Non era disponibile in Coppa: scommessa da 4-6."},{"name":"Nicolussi Caviglia","team":"Parma","type":"infortunio","text":"Lesione medio grado: rientro 3ª-5ª (la forbice si accorcia). Altri fermi Parma: Cremaschi (ottobre), DAFFARA (coscia, rientro 2ª — vedi alert), Diallo/Elphege/Ndiaye non verificabili su fonti live."},{"name":"Esposito Se.","team":"Cagliari","type":"mercato","text":"CIFRE CORRETTE: il Cagliari è FERMO a 20M cash, il Como offre ~10M + contropartite (Van der Brempt e/o Dossena) giudicate insufficienti; l'Inter ha il 40% sulla rivendita. Secondo certificato (stress) → out; il 'fino al 27/8' non è confermato dalle fonti live. Pedullà: 'la storia più triste del mercato'. NON comprarlo."},{"name":"Deiola","team":"Cagliari","type":"ballottaggio","text":"DECLASSATO (ma non azzerato): il rigore di Coppa è VERO (calciato e ribattuto dopo il VAR) ma Pisacane ha frenato in conferenza ('c'è una gerarchia, si è preso una responsabilità') e NESSUNA testata lo promuove 1° — la guida DAZN non lo dà nemmeno titolare fisso. Scommessa da 3-6 crediti, non il 'furto' che pensavamo."},{"name":"Maldini","team":"Cagliari","type":"ballottaggio","text":"Titolare nella formazione-tipo del Cagliari (la panchina di Coppa era turnover con la Serie C) ma i rigori NON sono tornati suoi (testate spaccate, campo a Deiola). Semi-bruciato (Goal terza fascia): pagare solo il posto."},{"name":"Kevin Carlos","team":"Cagliari","type":"ballottaggio","text":"Titolare nella formazione-tipo ma assente in Coppa (non al 100%) e BRUCIATO (FantaMaster 'da seguire' + Goal 1cr). Rigori non confermati (solo Fantacalcio.it, stale). 6-8 max."},{"name":"Winks","team":"Cagliari","type":"ok","text":"CONFERMATO DAL CAMPO: regista titolare in Coppa. Con Fazzini e Romano titolari: la mediana è quella. I rigori però non sono suoi (Deiola)."},{"name":"Fazzini","team":"Cagliari","type":"ok","text":"Titolare in Coppa, piazzati confermati; rigori dal campo a Deiola."},{"name":"Falcone","team":"Lecce","type":"ok","text":"RESTA e diventa CAPITANO del Lecce (Baschirotto partito); Fruchtl verso il Salisburgo. La voce-Napoli è fredda (il Napoli va su Restes): rischio residuo basso. MV 6,4: comprabile, semi-bruciato."},{"name":"Geubbels","team":"Lecce","type":"ballottaggio","text":"Favorito per il POSTO (titolare nella formazione-tipo e nella probabile col Palermo) e ora anche sui RIGORI 4-3 (Sky/SOS/Goal/Fantacalcio.it vs FantaMaster/F-online/TMW per Stulic). Palermo-Lecce 17/8 = test decisivo."},{"name":"N'Dri","team":"Lecce","type":"ok","text":"CONFERMATO: titolare esterno nel 4-2-3-1 della formazione-tipo. Nessuna guida low cost lo cita: da 1-2 a scommessa vera."},{"name":"Okoye","team":"Udinese","type":"ballottaggio","text":"PRUDENZA: ha giocato (e vinto) in Coppa il 15/8 ma lo staff resta cauto sulla spalla (sovraccarico; preso SELVIK dal Watford come copertura) e pianetafanta 15/8 lo dava ancora ko. Low cost ok senza strapagare."},{"name":"Solet","team":"Udinese","type":"ok","text":"MIGLIORATO: 90' con 'importanti contributi difensivi' in Coppa il 15/8; il 'non al meglio' non trova riscontro e non è in nessuna tabella infortunati. Resta il centrale fairplay ideale (1 giallo in 35); mercato 'pendente' da monitorare."},{"name":"Zaniolo","team":"Udinese","type":"ok","text":"Confermato titolare trequartista e ora anche 1° SULLE PUNIZIONI (fantacalcio.it). Resta il malus cartellini (8 gialli 25/26)."},{"name":"Kabasele","team":"Udinese","type":"squalifica","text":"APERTO 1 o 2 giornate: il comunicato originale e la tabella live dicono 2 (salta Como e Monza), tuttoudinese 14/8 scrive 1 ('salterà il Como'). Prudenzialmente 2. Alla 1ª spazio a Bertola/Ebosse."},{"name":"Zanoli","team":"Udinese","type":"infortunio","text":"Crociato: rientro inizio ottobre. Vojvoda titolare a destra confermato. NUOVI fermi Udinese: GOGLICHIDZE (trauma in allenamento, out in Coppa, da valutare), Chakvetadze (~2ª), Zemura e Bayo non verificabili."},{"name":"Bijlow","team":"Genoa","type":"ok","text":"Titolare col l'Ascoli (16/8): confermato ~85-90%. Vice NON risolto: per noi Stolz, per CalcioDangolo Sommariva. Leali è al Verona (B)."},{"name":"Colombo","team":"Genoa","type":"ok","text":"Titolare certo (in campo con Vitinha stasera) e rigorista per tutte le fonti MA con l'episodio-Ostigard alle spalle (il designato era il norvegese, richiamo pubblico di De Rossi): premio-rigori leggermente ridotto. Riscattato e rinnovato al 2029, a segno in tutte le amichevoli. Il Genoa cerca un vice (Ilenikhena il preferito): concorrenza sì, minaccia no."},{"name":"Sow","team":"Genoa","type":"ballottaggio","text":"MISTO: la formazione-tipo lo dà titolare ma nell'XI vero di stasera la mediana era Frendrup-Baldanzi-Ellertsson. ~40-50%: solo a saldo."},{"name":"Mitaj","team":"Genoa","type":"ok","text":"RISOLTO DAL CAMPO: titolare (quinto sinistro) nel 3-5-2 con l'Ascoli (16/8). Ma FantaMaster e Goal lo hanno già bruciato: da 3 a 4-5 crediti."},{"name":"Meichtry","team":"Genoa","type":"infortunio","text":"Confermato out (recupero non completato). Dai convocati del 16/8: fuori anche Nuredini e VENTURINO ('problemi fisici' — CORREZIONE: risulta ancora del Genoa, il nostro 'prestito alla Roma' era sbagliato o superato); Traorè Hj. out. MESSIAS e HAVEL recuperati e convocati."},{"name":"Dovbyk","team":"Bologna","type":"ballottaggio","text":"Ballottaggio 55/45 con Piccoli e prova opaca col Brighton, ma nella formazione-tipo il 9 del Bologna è lui. E per SOS/Goal è il VICE-RIGORISTA dietro Orsolini (27/32 in carriera): upside-dischetto che non prezzavamo."},{"name":"Piccoli","team":"Bologna","type":"ok","text":"RIVALUTATO: il ballottaggio col Dovbyk opaco è 45/55 vero, esordio già fatto col Brighton. Ora listato Bologna (Qt 8): da vice puro a co-titolare possibile."},{"name":"Holm","team":"Bologna","type":"ballottaggio","text":"RIDIMENSIONATO L'ALLARME: è ENTRATO al 72' col Brighton (15/8), quindi la voce 'soleo, out fino alla 2ª' di pianetafanta è debole. Ballottaggio vero: Zortea 55 / Holm 45."},{"name":"Casale","team":"Bologna","type":"infortunio","text":"NUOVO: adduttori (7/8), ha saltato Pisa e Brighton, dato 'in dubbio per la 2ª' → out o a forte rischio per la 1ª. Con Lucumì alla Juve la coppia d'avvio è Vitik/Heggem: entrambi low cost interessanti."},{"name":"Orsolini","team":"Bologna","type":"ok","text":"Rigorista confermato ma prova opaca col Brighton (fuori al 62'): nessun allarme, solo condizione da ritrovare. Heggem rientrato tardi dal Mondiale."},{"name":"De Ketelaere","team":"Atalanta","type":"infortunio","text":"OUT 1ª confermato (distrazione adduttori), in dubbio anche per la 2ª (fantacalcio.it dice inizio settembre). F-online e CalcioDangolo lo schierano ancora: errore da sfruttare, comprarlo con lo sconto."},{"name":"Ahanor","team":"Atalanta","type":"infortunio","text":"CONFERMATO OUT 1ª (adduttori). Nel frattempo l'XI atteso dà BERNASCONI titolare a sinistra."},{"name":"Raspadori","team":"Atalanta","type":"ok","text":"ALZARE: titolare nel tridente di Sarri sia al Bortolotti sia nella formazione-tipo (con Zalewski: non alternativi). Upgrade confermato dai fatti."},{"name":"Samardzic","team":"Atalanta","type":"ok","text":"Titolare mezzala di Sarri (campo + tipo), tutti i piazzati, fairplay pulito. TRIPLA citazione sulle guide (FantaMaster/Sky/11contro11): non è più uno sleeper, è un acquisto da fascia. Se il mercato lo prezza da riserva è un affare."},{"name":"Scamacca","team":"Atalanta","type":"ok","text":"1° rigorista per 7 fonti su 8 MA sul posto la lettura fresca è STAFFETTA: Scamacca 55 / Krstovic 45 (10 gol a testa lo scorso anno, Sarri alterna per avversario). Tetto abbassato a 90-100, non di più."},{"name":"Sulemana K.","team":"Atalanta","type":"infortunio","text":"Confermato: rientro ottobre (~6ª-8ª), come Hien (che da rientrato resta un mangia-gialli: solo parcheggio a 1)."},{"name":"Malen","team":"Roma","type":"ballottaggio","text":"DECLASSATO da 'certo': 1° rigorista per 6 fonti MA FantaMaster (dedicato, 15/8) dà DYBALA 1° con alternanza; zero parole di Gasperini. Titolare da 9 confermato col Dortmund. Il pacchetto resta forte, il premio-rigori un filo meno."},{"name":"Dybala","team":"Roma","type":"ok","text":"IN FORMA: gol al 4' e assist da corner col Dortmund, 'la luce di Gasperini'. E FantaMaster lo dà PRIMO rigorista in alternanza con Malen: upside-dischetto in più. Rinnovo fermo (attesa ok Friedkin), nessun rischio cessione. Gestione fisica unico tema."},{"name":"Soulè","team":"Roma","type":"mercato","text":"RIACCESO: l'agente Guastadisegno è in Inghilterra a trattare con Sunderland e Fulham (~35M = 20-21M di plusvalenza FFP); bookie 1,70 sull'addio entro settembre. Titolare col Dortmund. Sconto-mercato da riapplicare in pieno."},{"name":"Castro S.","team":"Roma","type":"ballottaggio","text":"Alternativa di Malen (30%) ma Gasperini studia soluzioni per farli COESISTERE (romaforever): upside da monitorare. Pagarlo da co-titolare."},{"name":"Wesley","team":"Roma","type":"infortunio","text":"CHIARITO: distorsione caviglia LIEVE (col Cardiff), esclusione col Dortmund precauzionale, punta la 1ª da titolare. E l'allarme fairplay va RIDOTTO: fonti fresche parlano di 4 gialli in 11 con trend in miglioramento (il '2 rossi + 6 gialli' non trova conferma fresca). Blindato da Gasperini, zero rumor."},{"name":"Bah","team":"Roma","type":"infortunio","text":"CONFERMATO il peggio: rottura del crociato anteriore (uscito in barella col Cardiff). Stop lunghissimo. Pisilli (soleo, ~10 giorni) in rientro; Robinio Vaz ~4ª."},{"name":"Pessina","team":"Monza","type":"infortunio","text":"OPERATO (lussazione rotula): rientro puntato a NOVEMBRE. Ancora schierato titolare da fantacalcio-online (agg. 15/8!), CalcioDangolo e DAZN: resta l'errore più costoso in circolazione. Rigori a Cutrone, Colpani outsider."},{"name":"Cutrone","team":"Monza","type":"ok","text":"Rigorista PROMOSSO 1° fino al rientro di Pessina (novembre, FantaMaster dedicato); unica punta di Juric (3-4-2-1 con Varela-Forson dietro). A secco in Coppa ma il posto è blindato. Semi-bruciato (Goal terza fascia)."},{"name":"Colpani","team":"Monza","type":"ok","text":"L'outsider-rigori REGGE: era 2° dietro Pessina nella gerarchia pre-infortunio (le fonti che dicono 'rigorista Pessina' — Sisal — sono stale: è out fino a novembre) e batte punizioni e corner. Entrato al 70' in Coppa ma titolare nella formazione-tipo. A 5-6 nessuno lo prezza per questo."},{"name":"Akinsanmiro","team":"Monza","type":"ok","text":"PULITO: titolare nella formazione-tipo di Juric e non citato da nessuna guida (la febbre di Coppa è un non-tema). Uno dei pochi sleeper non bruciati."},{"name":"Thiam","team":"Monza","type":"ballottaggio","text":"DECLASSATO: 'ancora il numero uno' ma il Monza cerca un portiere che 'non sarà un semplice vice' (idee: Montipò—ora al Venezia—, Audero, Di Gregorio). Solo a 1-3 con gli occhi aperti."},{"name":"Comuzzo","team":"Torino","type":"infortunio","text":"Colpo alla tibia in Coppa (uscito al 68'): prime indicazioni RASSICURANTI ('non dovrebbe essere nulla di grave') ma esiti esami NON ancora pubblicati. Il nome più urgente da ricontrollare."},{"name":"Simeone","team":"Torino","type":"ok","text":"PROMOSSO DAL CAMPO: titolare e gol all'8' in Coppa, uscito solo per crampi. Prima scelta di Abate con Zapata fermo. Il segnale più forte del turno: voti, gol e fairplay (1 giallo in 32)."},{"name":"Zapata D.","team":"Torino","type":"infortunio","text":"BOCCIATO per l'avvio: fuori dai convocati anche in Coppa ('non ancora al top'), zero minuti stagionali. Non è un investimento."},{"name":"Njie","team":"Torino","type":"mercato","text":"DEPENNARE: non convocato (sovraccarico) E il Salisburgo ha RILANCIATO a 12M + percentuale (fiducia in crescita, Crystal Palace in corsa). Rischio cessione altissimo."},{"name":"Oristanio","team":"Torino","type":"ballottaggio","text":"RIAPERTO: panchina in Coppa il 15/8 MA trequartista TITOLARE nella formazione-tipo di Abate accanto a Vlasic. 50/50 vero con Casadei: a 2-3 torna sensato. Nessuna guida lo cita."},{"name":"Casadei","team":"Torino","type":"ok","text":"PROMOSSO: titolare 90' in Coppa da sotto-punta con Vlasic, mai sostituito. Perno di Abate: il low cost C del Toro è lui, non Oristanio/Njie."},{"name":"Perri","team":"Torino","type":"mercato","text":"FONTI DELLO STESSO GIORNO IN CONFLITTO DURO: fantacalcio.it 'è fatta', Tuttosport h16 'a un passo', Toro.it 'un accordo non c'è ancora' (nodo formula, il Leeds rifiuta il prestito secco). NON tesserato e NON listato al 16/8 sera, più un 'lieve problema fisico'. Gerarchia dichiarata: Perri 1°, Mascardi 2°, Paleari 3° (in uscita Samp). All'asta: Mascardi è la copertura a costo zero, Perri solo se listato."},{"name":"Israel","team":"Torino","type":"infortunio","text":"Operato: out fino a gennaio."},{"name":"Douvikas","team":"Como","type":"ok","text":"Titolare confermato (~85%). Delap RAFFREDDATO (il Como 'non apre al prestito' — Sky 16/8); Morata infortunato ma 'sta meglio' (Fabregas), resta ai margini con uscita legata al colpo in attacco. Il rigore in amichevole del 31/7 NON è verificabile, ma è 2° rigorista per 5 fonti."},{"name":"Morata","team":"Como","type":"mercato","text":"Infortunato ma 'sta meglio' (Fabregas): disponibilità 1ª APERTA. Resta ai margini, uscita legata al colpo-attacco del Como (Esposito Se. o mister X). Lasciarlo comunque."},{"name":"Kempf","team":"Como","type":"ballottaggio","text":"RISALITO — il declassamento era prematuro: ha giocato ENTRAMBE le amichevoli col Liverpool del 16/8, mentre CHALOBAH non è stato schierato in nessuna delle due (motivo non verificabile). Ramon 70 / Kempf 45-60 / Chalobah 55-65: da 1-2 a 3-4 crediti."},{"name":"Addai","team":"Como","type":"infortunio","text":"Voce ora UNIFORME: rottura del tendine d'Achille operata, rientro ottobre (~6ª). Fabregas: 'troppo presto'. Fuori dai giochi d'avvio."},{"name":"Kaiki","team":"Como","type":"ballottaggio","text":"RISCHIO AL RIBASSO: VALLE titolare in entrambe le amichevoli col Liverpool (16/8), Kaiki in nessuna — ma gli aggregatori lo danno all'80% e le guide lo hanno bruciato. 50/50 vero: non pagare i 10 previsti, 4-6 max."},{"name":"Stankovic F.","team":"Venezia","type":"ok","text":"RUMOR SMENTITO: lo scambio col Verona è MONTIPÒ-LELLA e Montipò arriverebbe da VICE (il Venezia cerca un secondo tra Scuffet e Montipò). Titolare ~90%, 6.5 in Coppa. Bruciato: lo consigliano tutti."},{"name":"Adams A.","team":"Venezia","type":"ok","text":"UPGRADE RIGORI: 1° per 5 fonti contro 1 (l'alternanza con Rrahmani è lettura minoritaria di FantaMaster; SOS parità). Doppietta + assist in Coppa: bruciatissimo, budget 20-25."},{"name":"Yeboah J.","team":"Venezia","type":"ok","text":"CORREZIONE RIGORI: NON è il designato (2/4 scorsa stagione, indicato come alternativa; sui piazzati è 2° dietro Busio). Resta titolare fisso col gol in Coppa e l'investitura di Stroppa. Bruciato (Goal terza fascia): pagare posto+gol, non i rigori."},{"name":"Bella-Kotchap","team":"Venezia","type":"ok","text":"Titolare in Coppa nel terzetto. CONFERMATO dal campo — ma la difesa ha ballato (2 gol in 39'): voti a rischio nelle prime."},{"name":"Schingtienne","team":"Venezia","type":"ok","text":"Titolare in Coppa: confermato dal campo, ancora ignorato dalle guide. Sleeper puro che regge."},{"name":"Halhal","team":"Venezia","type":"ballottaggio","text":"CONFLITTO: titolare in Coppa ma la formazione-tipo dà MORENO terzo centrale. Resta sleeper da 2-3, non di più, finché il quadro non si chiarisce."},{"name":"Hainaut","team":"Venezia","type":"ballottaggio","text":"CONFLITTO: titolare in Coppa ma nel tipo il quinto destro è CORREIA. Ballottaggio vero: 2-3 max."},{"name":"Basic","team":"Venezia","type":"ok","text":"RISOLTO — FALSO ALLARME: era assente per la NASCITA DEL FIGLIO, nessun problema fisico né di mercato. Rientra e la formazione-tipo lo dà titolare in mediana (45-55 col Lecce). A 1-2 è un regalo; il caso-mercato del Venezia è Duncan."},{"name":"Sverko","team":"Venezia","type":"infortunio","text":"Confermato out (~fine ottobre), come Adorante (schiena, operato, scavalcato anche sui rigori): fuori dai 27 convocati di Coppa."},{"name":"Frosinone (modulo)","team":"Frosinone","type":"ballottaggio","text":"XI REALE di Coppa (16/8, 3-0 al Juve Stabia): 4-2-3-1 Palmisani; Calvani, Monterisi, Akpoguma, Oyono A.; Calò, Cichella; GHEDJEMIS, SCHMID, KVERNADZE; Raimondo. DOPPIETTA di Kvernadze + gol Calvani. RIBALTONE sul nostro stato: Schmid e Ghedjemis DENTRO, Fini in panchina, Koutsoupias e Bracaglia FUORI dall'XI (mediana a 2, terzini Calvani/Oyono)."},{"name":"Palmisani","team":"Frosinone","type":"ok","text":"SALE a 65-70%: titolare e clean sheet nel 3-0 al Juve Stabia (Desplanches in panchina); Alvini lo elogia ('può diventare uno dei migliori portieri italiani'). Nessuna guida lo cita: il P-scommessa migliore del listone."},{"name":"Ostigard","team":"Genoa","type":"ballottaggio","text":"FRENATO: in PANCHINA con l'Ascoli (16/8) — il terzetto era Marcandalli-OTOA-Vasquez. Può essere turnover di Coppa, ma il 'promosso titolare certo' va congelato finché non si vede l'XI di campionato. Resta l'ex designato sui rigori (episodio-Colombo) e i 7 gialli: pagarlo solo da D4 a prezzo pieno se rientra nell'XI col Napoli."},{"name":"Obert","team":"Cagliari","type":"fairplay","text":"Titolare in Coppa e il Cagliari ha RIFIUTATO 10M del Lens (blindato). Resta il D più sanzionato della wishlist: 9 ammonizioni nel 25/26. Piazzati veri, fairplay pessimo."},{"name":"Calhanoglu","team":"Inter","type":"fairplay","text":"Rigorista più solido della A ma 7 gialli in sole 22 presenze nel 25/26 (0,32/gara, il peggior rateo tra i big): il fairplay lo paga."},{"name":"Vlasic","team":"Torino","type":"fairplay","text":"Pacchetto bonus completo confermato dal campo (90' in Coppa) ma 7 ammonizioni nel 25/26: resta il miglior C low per bonus, scontare il malus."},{"name":"Mandragora","team":"Fiorentina","type":"fairplay","text":"MIGLIORATO: la 'schiena' è sciatalgia in risoluzione, esordio con la Roma non a rischio. Resta recidivo cartellini (7 gialli nel 25/26 E nel 24/25)."},{"name":"Rovella","team":"Lazio","type":"fairplay","text":"NOVITÀ: è il 1° TIRATORE DI PUNIZIONI della Lazio (fantacalcio.it), davanti a Zaccagni. Resta la trappola statistica sui gialli (13 nel 24/25). Piazzati veri a prezzo basso."},{"name":"Locatelli","team":"Juventus","type":"fairplay","text":"Recidivo strutturale: 9 gialli nel 25/26 e 9 nel 24/25. Titolare sì, ma il fairplay piange."},{"name":"Dodò","team":"Fiorentina","type":"mercato","text":"IN USCITA VERA: cessione 'certa e concordata' verso il NOTTINGHAM FOREST per il filone probabili (contro il 'rinnovo-ponte' del filone mercato: fonti in conflitto, entrambe 15-16/8). In campo il duello a destra è ormai Jimenez A. 55 / Joao Mario 45. Non comprarlo."},{"name":"Mastantuono","team":"Fiorentina","type":"ballottaggio","text":"CONFLITTO: la formazione-tipo lo dà TITOLARE nel tridente di Grosso, ma in Coppa è di nuovo subentrato (58'). E FantaMaster lo indica come possibile primissima opzione futura sui rigori (già 2° sui piazzati). Metà prezzo e occhi aperti: l'upside è tornato."},{"name":"Gudmundsson A.","team":"Fiorentina","type":"ok","text":"In gol al 2' in Coppa da trequartista dietro Kean e rigorista confermato. Sul mercato è 'di fatto in vendita' (15-20M, sondaggio Atalanta) ma nessuna offerta depositata: comprare con un occhio all'1/9."},{"name":"Ndour","team":"Fiorentina","type":"ok","text":"Titolare E gol in Coppa nella mediana di Grosso, ma ormai BRUCIATO (pazzidifanta + guide): costerà 10+."},{"name":"Parisi","team":"Fiorentina","type":"infortunio","text":"NUOVO (mancava in lista): crociato, rientro novembre."},{"name":"Kristensen T.","team":"Atalanta","type":"ballottaggio","text":"FRENATO: ufficiale il 13/8 ma ZERO minuti — col Bilbao al Bortolotti ha giocato KOSSOUNOU nel terzetto. Kristensen 55 / Kossounou 45 per le fonti. Resta occasione, ma non a 10: 5-7."},{"name":"Pellegrino M.","team":"Fiorentina","type":"mercato","text":"Ora listato FIORENTINA (Qt 15, FVM 60): parte DIETRO Kean (90/10) ma Fantacalcio-online lo mette già 2° rigorista viola. Non pagarlo da titolare; da vice-con-rigori-potenziali vale 3-5."},{"name":"Pavard","team":"Inter","type":"mercato","text":"CAMBIATO: verso la PERMANENZA (nessuna offerta concreta, ingaggio 5M). Resta fuori dalle gerarchie: lasciarlo comunque."},{"name":"Rabiot","team":"Milan","type":"ok","text":"Rientrato a Milanello solo il 16/8 (post-Mondiale) MA nella formazione-tipo è titolare in mediana con Modric: scontare solo le primissime giornate, non l'anno."},{"name":"Bellanova","team":"Atalanta","type":"mercato","text":"OFFERTA FORMALE del Fulham da 20M il 16/8: RESPINTA, 'incedibile' (ma l'Atalanta 'riflette'; Everton e Real Sociedad monitorano). Sul campo è LUI il quinto destro di Sarri (Zappacosta entra al 60'). Comprare con un occhio al mercato fino all'1/9."},{"name":"Diao","team":"Como","type":"infortunio","text":"NUOVO: infortunato, Fabregas lo dà in rientro per il Torino (2ª) → OUT per la 1ª col l'Udinese. Sulla trequarti spazio a Jesus Rodriguez/Baturina con Paz."},{"name":"Atta","team":"Fiorentina","type":"infortunio","text":"NUOVO: uscito al 64' di Fiorentina-Benevento (14/8) per un problema fisico ('si ferma Atta' — Tuttosport). Titolare designato di Grosso: monitorare fino all'asta prima di pagarlo da C1-C2."},{"name":"Daffara","team":"Parma","type":"infortunio","text":"NUOVO: lesione di basso grado alla coscia destra, rientro 2ª (TMW). Corvi resta titolare senza rivali alla 1ª; Daffara solo da 1 credito per l'alternanza futura."},{"name":"Duncan","team":"Venezia","type":"mercato","text":"NUOVO: è LUI l'assente senza spiegazione fisica di Coppa (non Basic), citato tra le possibili uscite. Non comprarlo."},{"name":"Romagnoli","team":"Lazio","type":"mercato","text":"NUOVO: escluso dai convocati per Lazio-Mantova (16/8) — Sky mercato lo lista tra i casi aperti. Il compagno di Doekhi al centro resta Provstgaard (titolare col Mantova). Verificare prima di pagarlo."},{"name":"Goglichidze","team":"Udinese","type":"infortunio","text":"NUOVO: trauma da impatto in allenamento, assente in Coppa, rientro da valutare (tuttoudinese 14/8)."},{"name":"Taylor K.","team":"Lazio","type":"ok","text":"CONFERMATO E RAFFORZATO: titolare nell'XI col Mantova (16/8) e 2° rigorista per 4 fonti (SOS parla addirittura di parità con Zaccagni). Frattesi aggiunge concorrenza nel reparto ma il primo nome Lazio resta lui."},{"name":"Chalobah T.","team":"Como","type":"ballottaggio","text":"FRENATO: NON schierato in NESSUNA delle due amichevoli col Liverpool del 16/8 (Kempf le ha giocate entrambe), motivo NON VERIFICABILE — nessuna fonte parla di infortunio. Tutte le guide lo danno titolare certo: è il punto più importante da richiudere prima del 22/8. Congelare l'acquisto a prezzo pieno."},{"name":"Paz N.","team":"Como","type":"ballottaggio","text":"CAUTELA AVVIO: rientro dal Mondiale anticipato al 12/8 per averlo in campionato, ma ZERO minuti nelle amichevoli — titolare alla 1ª ~75%, rischio spezzone. Sull'anno resta il C1 designato (Real ha rinunciato al riacquisto per il 26/27); il Como in Champions ruoterà."},{"name":"Mendy P.","team":"Cagliari","type":"infortunio","text":"NUOVO: affaticamento all'adduttore, uscito all'intervallo di Coppa per motivo medico — forfait 'quasi certo' col Parma. Davanti ora è BORRELLI 60-65 (Kevin Carlos non convocato, programma personalizzato). La scommessa Mendy scende a 1-2."},{"name":"Lontani","team":"Parma","type":"mercato","text":"NUOVO: il 2008 preso a zero dal Milan è TITOLARE in coppia con Tourè nell'XI reale del Parma (doppietta all'esordio, 77 minuti; Frigan è la riserva) — 55-60% titolare col Cagliari. NON È LISTATO: se entra nel listone prima dell'asta è un colpo da 3-6 crediti; monitorare l'aggiornamento quotazioni."},{"name":"Keita M.","team":"Parma","type":"ballottaggio","text":"FRENATO: in Coppa il titolare in mediana è stato KONATÉ (esordiente, NON listato), Keita dentro solo al 66'. Il 'titolare inamovibile' non regge più: 3-5 crediti, non di più."},{"name":"Troilo","team":"Parma","type":"ok","text":"NUOVO DAL CAMPO: il terzo centrale del terzetto reale è LUI (non Valenti, rimasto in panchina senza entrare): Delprato-Troilo-Circati. Qt 3: low cost da 2 crediti che nessuna guida cita."},{"name":"Cambiaghi","team":"Bologna","type":"ok","text":"RIBALTATO DI NUOVO, IN MEGLIO: titolare a SINISTRA col Brighton, e Rowe è entrato al 62' al posto di ORSOLINI (a destra) — gli aggregatori sbagliano fascia. Cambiaghi 55 / Rowe 45. Col cambio ruolo A→C torna un acquisto sensato a 4-6."},{"name":"Palma","team":"Udinese","type":"ok","text":"NUOVO DAL CAMPO: centrale titolare del terzetto in Coppa (con Abankwah e Solet) e candidato forte anche alla 1ª (Bertola 60 / Palma 55; EBOSSE È FUORI DAL PROGETTO, clausola 2,5M). Qt 2: titolare vero a zero crediti, nessuna guida lo cita."},{"name":"Angelino","team":"Roma","type":"ballottaggio","text":"NUOVO: non convocato per l'amichevole col Dortmund, motivo NON VERIFICABILE. A sinistra ha giocato Rensch. Verificare prima di pagarlo."},{"name":"Zambo Anguissa","team":"Napoli","type":"ok","text":"RISALITO: favorito su De Bruyne nell'XI atteso (55-60) per il filone probabili e per la guida DAZN del 15/8. Il tipo di inizio agosto lo escludeva: fonti in conflitto, ma quelle fresche lo rimettono dentro. Torna comprabile da titolare a prezzo medio."},{"name":"Noslin","team":"Lazio","type":"ballottaggio","text":"PRECISAZIONE: parte titolare col Mantova ma da ESTERNO del tridente, non da 9 (il 9 è conteso Dia/Ratkov). Da 1-3 per il posto, senza premi."},{"name":"Vitik","team":"Bologna","type":"infortunio","text":"DOPPIO SEGNALE: fermo per affaticamento alla coscia destra e col Brighton la coppia è stata HELLAND-Heggem. Resta il candidato al buco-Lucumì (51/49 su Helland per le fonti) ma non è più un titolare certo: 2-3 crediti, e occhio a Helland a 1."},{"name":"Fini","team":"Frosinone","type":"ballottaggio","text":"CORREZIONE: il 16/8 era ASSENTE PER SQUALIFICA (filone probabili), non bocciato dal campo. Dal rientro il ballottaggio sull'esterno resta con Ghedjemis/Kvernadze titolari: scommessa da 1-2, non da depennare."}],"sleepers":{"P":[{"name":"Muric","team":"Sassuolo","why":"BRUCIATO (titolarità ok 75-80%): nei 'budget' SOS e nelle scommesse Goal del 16/8; Turati resta come vice. Test Cesena 17/8","price":4},{"name":"Corvi","team":"Parma","why":"CONFERMATO E RAFFORZATO (Suzuki venduto, Daffara ko fino alla 2ª) ma BRUCIATO dalle guide del 16/8","price":4},{"name":"Provedel","team":"Inter","why":"DECLASSATO: Martinez 60-70% e formazione-tipo con lui; resta il turnover dichiarato di Chivu (Provedel titolare in amichevole con la Juve). Coppia-Inter a 2-3","price":2},{"name":"Stankovic F.","team":"Venezia","why":"RUMOR MONTIPÒ SMENTITO (arriverebbe da vice, scambio Montipò-Lella): titolare ~90% ma BRUCIATO (budget SOS + scommesse Goal 16/8)","price":8},{"name":"Motta","team":"Lazio","why":"A 1 credito: vice di Mandas 'vicino in gerarchia' (CalcioDangolo lo chiama 'il ballottaggio più aperto della A'), spazio in coppa e forse in campionato","price":1},{"name":"Palmisani","team":"Frosinone","why":"IL MIGLIORE DEL REPARTO: titolare + clean sheet nel 3-0 del 16/8 (65-70% su Desplanches), elogi di Alvini, NESSUNA guida lo cita","price":2},{"name":"Falcone","team":"Lecce","why":"CONFERMATO semi-bruciato: resta da CAPITANO (Fruchtl al Salisburgo), la voce-Napoli è fredda. MV 6,4","price":8},{"name":"Mascardi","team":"Torino","why":"NUOVO: titolare in Coppa e unico portiere del Toro con minuti ufficiali; se Perri non firma/lista in tempo è la copertura a costo zero. Qt 1","price":1}],"D":[{"name":"Bella-Kotchap","team":"Venezia","why":"Titolare in Coppa: confermato dal campo (ma la difesa ha ballato: 2 gol in 39')","price":6},{"name":"Halhal","team":"Venezia","why":"DECLASSARE: titolare in Coppa MA la formazione-tipo dà Moreno terzo centrale. Conflitto aperto: 2-3 max","price":2},{"name":"Hainaut","team":"Venezia","why":"DECLASSARE: titolare in Coppa MA nel tipo il quinto destro è Correia. Ballottaggio vero: 2-3 max","price":2},{"name":"Vojvoda","team":"Udinese","why":"CONFERMATO ma BRUCIATO: nelle 'sorprese' FantaMaster 13/8. Titolare 90' anche il 15/8","price":6},{"name":"Schingtienne","team":"Venezia","why":"Titolare in Coppa e ancora ignorato dalle guide: sleeper puro che regge","price":3},{"name":"Haps","team":"Venezia","why":"Quinto sinistro titolare in Coppa: confermato, copertura ancora bassa","price":6},{"name":"Kristensen T.","team":"Atalanta","why":"FRENATO: ufficiale ma zero minuti — col Bilbao ha giocato Kossounou (55/45). Resta occasione ma a 5-7, non a 10","price":6},{"name":"Marin R.","team":"Napoli","why":"RISCHIO ALTO: Badiashile in CHIUSURA (visite 18/8). Da 1-2, sapendo che può durare poco","price":2},{"name":"Obert","team":"Cagliari","why":"Titolare in Cop /* ============================== utils ============================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => (s ?? '').toString().normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const ROLES = ['P','D','C','A'];
const ROLENAME = {P:'Portieri', D:'Difensori', C:'Centrocampisti', A:'Attaccanti'};

/* ============================== indexes ============================== */
const byId = new Map(DATA.players.map(p => [p.id, p]));
const byNorm = new Map();           // norm name -> [player]
for (const p of DATA.players) {
  p._n = norm(p.name); p._t = norm(p.team);
  if (!byNorm.has(p._n)) byNorm.set(p._n, []);
  byNorm.get(p._n).push(p);
}
function findPlayer(name, team) {
  const cands = byNorm.get(norm(name)) || [];
  if (cands.length === 1) return cands[0];
  if (team) { const hit = cands.find(p => p._t === norm(team)); if (hit) return hit; }
  return cands[0] || null;
}
const slotById = new Map(DATA.slots.map(s => [s.id, s]));
// wishlist index: pid -> [{role, slot, prio, maxprice, ...}]  ·  slot id -> group
const wishByPid = new Map();
const wishBySlot = new Map();
for (const role of ROLES) {
  for (const grp of (DATA.wishlist[role] || [])) {
    wishBySlot.set(grp.slot, {role, ...grp});
    grp.players.forEach(w => {
      const p = findPlayer(w.name, w.team);
      if (!p) return;
      if (!wishByPid.has(p.id)) wishByPid.set(p.id, []);
      wishByPid.get(p.id).push({role, slot: grp.slot, profile: grp.profile, slotBudget: grp.budget, ...w});
    });
  }
}
// sleepers index
const sleepByPid = new Map();
for (const role of Object.keys(DATA.sleepers || {})) {
  for (const s of DATA.sleepers[role]) {
    const p = findPlayer(s.name, s.team);
    if (!p) continue;
    if (!sleepByPid.has(p.id)) sleepByPid.set(p.id, []);
    sleepByPid.get(p.id).push(s);
  }
}
// alerts index
const alertByPid = new Map();
for (const a of (DATA.alerts || [])) {
  const p = findPlayer(a.name, a.team);
  if (!p) continue;
  if (!alertByPid.has(p.id)) alertByPid.set(p.id, []);
  alertByPid.get(p.id).push(a);
}

/* ============================== state ============================== */
const LS_KEY = 'fantaasta_2627_v1';
const LS_SIM = 'fantaasta_2627_sim';
let simMode = false;
try { simMode = localStorage.getItem('fantaasta_sim_on') === '1'; } catch (e) {}
const lsKey = () => simMode ? LS_SIM : LS_KEY;
let state = loadState();
function defaultState() {
  return { budget: DATA.budget, roleBudget: {...DATA.roleBudget}, actions: [],
           oppNames: Array.from({length: 9}, (_, i) => `Squadra ${i + 2}`) };
}
function loadState() {
  try {
    const raw = localStorage.getItem(lsKey());
    if (raw) return {...defaultState(), ...JSON.parse(raw)};
  } catch (e) {}
  if (simMode) return defaultState();   // la sim parte pulita, niente cookie
  try {
    const m = document.cookie.match(/(?:^|;\s*)fantaasta_bk=([^;]+)/);
    if (m) {
      const st = {...defaultState(), ...JSON.parse(decodeURIComponent(m[1]))};
      toast('Stato ripristinato dal cookie di backup', 'warn');
      return st;
    }
  } catch (e) {}
  return defaultState();
}
function save() {
  const raw = JSON.stringify(state);
  try { localStorage.setItem(lsKey(), raw); } catch (e) {}
  if (simMode) return;                  // il cookie di backup resta dell'asta vera
  // cookie backup (4KB limit): full state, else buys only
  let ck = raw;
  if (encodeURIComponent(ck).length > 3800) {
    ck = JSON.stringify({...state, actions: state.actions.filter(a => a.t === 'buy')});
  }
  if (encodeURIComponent(ck).length <= 3900) {
    document.cookie = 'fantaasta_bk=' + encodeURIComponent(ck) + ';max-age=7776000;path=/;SameSite=Lax';
  }
}

/* derived view of state */
function derive() {
  const mine = state.actions.filter(a => a.t === 'buy');
  const gone = state.actions.filter(a => a.t === 'gone');
  const minePid = new Map(mine.map(a => [a.pid, a]));
  const gonePid = new Map(gone.map(a => [a.pid, a]));
  const spent = mine.reduce((s,a) => s + a.price, 0);
  const spentRole = {P:0,D:0,C:0,A:0};
  const cntRole = {P:0,D:0,C:0,A:0};
  const slotFill = new Map();
  for (const a of mine) { spentRole[a.role] += a.price; cntRole[a.role]++; if (a.slot) slotFill.set(a.slot, a); }
  const totSlots = ROLES.reduce((s,r) => s + DATA.roleSlots[r], 0);
  const left = state.budget - spent;
  const slotsLeft = totSlots - mine.length;
  // dynamic budget: spread surplus/deficit over empty slots, proportional to their planned budget
  const emptyPlanSum = DATA.slots.reduce((s,x) => s + (slotFill.has(x.id) ? 0 : x.budget), 0);
  const factor = emptyPlanSum > 0 ? left / emptyPlanSum : 0;
  const opps = (state.oppNames || []).map(name => {
    const buys = gone.filter(a => a.buyer === name);
    const oSpent = buys.reduce((s,a) => s + (a.price || 0), 0);
    const cnt = {P:0,D:0,C:0,A:0};
    buys.forEach(a => cnt[a.role]++);
    const oLeft = state.budget - oSpent;
    const oSlotsLeft = totSlots - buys.length;
    const canBuyRole = {};
    ROLES.forEach(r => canBuyRole[r] = cnt[r] < DATA.roleSlots[r]);
    return {name, spent: oSpent, cnt, left: oLeft, slotsLeft: oSlotsLeft, canBuyRole,
            maxBid: Math.max(0, oLeft - Math.max(0, oSlotsLeft - 1))};
  });
  return {mine, gone, minePid, gonePid, spent, spentRole, cntRole, slotFill, left, slotsLeft, opps,
          emptyPlanSum, factor, planDelta: left - emptyPlanSum,
          adjBudget: id => { const s = slotById.get(id); return s ? Math.round(s.budget * factor) : 0; },
          maxBid: Math.max(0, left - Math.max(0, slotsLeft - 1)),
          avg: slotsLeft ? Math.floor(left / slotsLeft) : 0};
}
function freeSlots(role) {
  const d = derive();
  return DATA.slots.filter(s => s.role === role && !d.slotFill.has(s.id));
}
// wishlist entries of a slot still on the board (not mine, not gone) as {w, p}
function slotAvailable(slotId, d) {
  const grp = wishBySlot.get(slotId);
  if (!grp) return [];
  return grp.players.map(w => ({w, p: findPlayer(w.name, w.team)}))
    .filter(x => x.p && !d.minePid.has(x.p.id) && !d.gonePid.has(x.p.id));
}

/* ============================== actions ============================== */
function doBuy(p, price, slotId) {
  state.actions.push({t:'buy', pid:p.id, name:p.name, role:p.r, team:p.team, slot:slotId, price, ts:Date.now()});
  save(); renderAll();
  const d = derive();
  toast(`✅ <b>${esc(p.name)}</b> → ${slotId} a <b>${price}</b> · restano ${d.left} crediti`);
  $('#stCred').classList.add('flash'); setTimeout(()=>$('#stCred').classList.remove('flash'), 600);
}
function doGone(p, price=null, buyer='') {
  state.actions.push({t:'gone', pid:p.id, name:p.name, role:p.r, team:p.team, price, buyer, ts:Date.now()});
  save(); renderAll();
  toast(`⛔ <b>${esc(p.name)}</b> preso da altri${buyer ? ` (<b>${esc(buyer)}</b>${price ? ` a ${price}` : ''})` : ''}`, 'warn');
}

/* gone card: Shift+Invio → prezzo → tasto 1-9 per il compratore (0/Invio = non so) */
let goneTarget = null;
function openGone(p) {
  goneTarget = p; buyTarget = null;
  const names = state.oppNames || [];
  const card = $('#buycard');
  card.hidden = false;
  card.innerHTML = `
    <div class="bctop">
      <span class="rb ${p.r}">${p.r}</span>
      <span class="bcname">${esc(p.name)}</span>
      <span class="bcteam">${esc(p.team)} · andato a un altro</span>
    </div>
    <div class="buyrow">
      <input type="number" id="gonePrice" min="1" placeholder="crediti">
      <input id="goneWho" placeholder="a chi? 1-9 · 0=?" hidden>
      <button class="ghost" id="goneSkip" title="Registra e basta (Esc)">Registra senza dettagli</button>
    </div>
    <div class="gonewho" id="goneBtns" hidden>
      ${names.map((n, i) => `<button data-b="${esc(n)}"><b>${i + 1}</b>${esc(n)}</button>`).join('')}
      <button data-b=""><b>0</b>non so</button>
    </div>
    <div class="hint" style="margin:6px 0 0">Invio = avanti · Esc = registra senza dettagli</div>`;
  const priceEl = $('#gonePrice'), whoEl = $('#goneWho');
  const finalize = (price, buyer) => {
    const t = goneTarget; goneTarget = null;
    doGone(t, price, buyer);
    closeBuy();
  };
  priceEl.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      if (!names.length) { finalize(parseInt(priceEl.value, 10) || null, ''); return; }
      whoEl.hidden = false; $('#goneBtns').hidden = false; whoEl.focus();
    }
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); finalize(parseInt(priceEl.value, 10) || null, ''); }
  });
  whoEl.addEventListener('keydown', e => {
    e.preventDefault(); e.stopPropagation();
    if (/^[1-9]$/.test(e.key)) { const n = names[+e.key - 1]; if (n) finalize(parseInt(priceEl.value, 10) || null, n); }
    else if (e.key === '0' || e.key === 'Enter' || e.key === 'Escape') finalize(parseInt(priceEl.value, 10) || null, '');
  });
  $('#goneSkip').addEventListener('click', () => finalize(parseInt(priceEl.value, 10) || null, ''));
  card.querySelectorAll('#goneBtns button').forEach(b =>
    b.addEventListener('click', () => finalize(parseInt(priceEl.value, 10) || null, b.dataset.b)));
  priceEl.focus();
  $('#results').classList.remove('open');
}

  const a = state.actions.pop();

}
function removeAction(idx) {
  const a = state.actions.splice(idx, 1)[0];
  save(); renderAll();
  if (a) toast(`🗑 Rimosso ${esc(a.name)} dal log`);
}

/* ============================== search ============================== */
let selIdx = 0, curResults = [];
function doSearch(q) {
  const nq = norm(q);
  const box = $('#results');
  if (nq.length < 2) { box.classList.remove('open'); curResults = []; return; }
  const d = derive();
  const scored = [];
  for (const p of DATA.players) {
    if (d.cntRole[p.r] >= DATA.roleSlots[p.r] && !d.minePid.has(p.id)) continue;
    let s = 0;
    if (p._n.startsWith(nq)) s = 100;
    else if (p._n.split(' ').some(w => w.startsWith(nq))) s = 85;
    else if (p._n.includes(nq)) s = 62;
    else if (p._t.startsWith(nq)) s = 32;
    else continue;
    const w = wishByPid.get(p.id);
    if (w) s += 26 - Math.min(w[0].prio, 10);
    if (sleepByPid.has(p.id)) s += 8;
    if (d.minePid.has(p.id) || d.gonePid.has(p.id)) s -= 45;
    scored.push([s + (p.fvm || 0) / 2000, p]);
  }
  scored.sort((a,b) => b[0] - a[0]);
  curResults = scored.slice(0, 9).map(x => x[1]);
  selIdx = 0;
  renderResults();
}
function renderResults() {
  const d = derive();
  const box = $('#results');
  if (!curResults.length) { box.classList.remove('open'); return; }
  box.innerHTML = curResults.map((p, i) => {
    const w = wishByPid.get(p.id);
    const sl = sleepByPid.get(p.id);
    const al = alertByPid.get(p.id);
    const mine = d.minePid.get(p.id), gone = d.gonePid.get(p.id);
    let badges = '';
    if (w) badges += `<span class="wish">★ ${w.map(x => `${x.slot} #${x.prio}`).join(' · ')} · max ${w[0].maxprice}</span>`;
    if (!w && sl) badges += `<span class="sleep">◆ occasione · ~${esc(sl[0].price ?? '?')}</span>`;
    if (al) badges += `<span class="adot" title="${esc(al.map(a=>a.text).join(' | '))}"></span>`;
    if (mine) badges += `<span class="tag mine">mio · ${mine.price}</span>`;
    if (gone) badges += `<span class="tag gone">andato</span>`;
    return `<div class="res ${i===selIdx?'sel':''} ${mine||gone?'dead':''}" data-i="${i}">
      <span class="rb ${p.r}">${p.r}</span>
      <span class="nm">${esc(p.name)}</span><span class="tm">${esc(p.team)}</span>
      ${badges}
      <span class="fig">Qt ${p.qta} · FVM ${p.fvm} · S ${p.score ?? '–'}</span>
    </div>`;
  }).join('');
  box.classList.add('open');
  box.querySelectorAll('.res').forEach(el => {
    el.addEventListener('click', () => openBuy(curResults[+el.dataset.i]));
  });
}

/* ============================== walk-away ============================== */
/* prezzo oltre cui mollare: max del piano corretto per alternative rimaste
   (FantaScore ≥75% del target), tetto slot riproporzionato e pressione avversari */
function walkAway(p, slotId, d) {
  const w = (wishByPid.get(p.id) || []).find(x => x.slot === slotId) || (wishByPid.get(p.id) || [])[0];
  const sl = (sleepByPid.get(p.id) || [])[0];
  const adj = d.adjBudget(slotId);
  const base = w?.maxprice ?? sl?.price ?? adj ?? 1;
  const myScore = p.score || 50;
  const alts = slotAvailable(slotId, d).filter(x => x.p.id !== p.id && (x.p.score || 0) >= .75 * myScore).length;
  const f = alts >= 3 ? .92 : alts === 2 ? 1 : alts === 1 ? 1.08 : 1.22;
  let v = Math.round(base * f);
  if (adj) v = Math.min(v, Math.round(adj * 1.35));
  v = Math.min(v, d.maxBid);
  const rivals = d.opps.filter(o => o.canBuyRole[p.r] && o.maxBid > 0);
  const topRival = rivals.length ? Math.max(...rivals.map(o => o.maxBid)) : 0;
  if (topRival + 1 < v) v = topRival + 1;   // nessuno può arrivarci: non pagare di più
  v = Math.max(1, v);
  return {v, alts, topRival, overtakers: rivals.filter(o => o.maxBid >= v)};
}

/* ============================== simulation ============================== */
/* prezzo atteso: FVM riscalato sui crediti totali del tavolo (10 squadre), ±25% */
const SIMSCALE = (() => {
  const top = DATA.players.map(p => p.fvm || 0).sort((a,b) => b - a).slice(0, 250);
  const sum = top.reduce((s,v) => s + v, 0);
  return sum > 0 ? (DATA.budget * 10) / sum : 1;
})();
let simPending = null;   // {p, price, bot} — chiamata sul banco
function simPickBot(p, price, d) {
  const elig = d.opps.filter(o => o.canBuyRole[p.r] && o.slotsLeft > 0);
  if (!elig.length) return null;
  const can = elig.filter(o => o.maxBid >= price);
  const pool = can.length ? can : elig;
  const bot = pool[Math.floor(Math.random() * pool.length)];
  return {bot, price: Math.max(1, Math.min(price, bot.maxBid))};
}
function simStep(interactive) {
  const d = derive();
  if (d.slotsLeft <= 0 && !interactive) return false;
  const pool = DATA.players
    .filter(p => !d.minePid.has(p.id) && !d.gonePid.has(p.id) && (p.fvm || 0) > 1)
    .sort((a,b) => (b.fvm || 0) - (a.fvm || 0));
  if (!pool.length) { toast('Listone esaurito: simulazione finita', 'warn'); return false; }
  const p = pool[Math.floor(Math.random() * Math.min(12, pool.length))];
  const price = Math.max(1, Math.round((p.fvm || 1) * SIMSCALE * (0.75 + Math.random() * 0.5)));
  const pick = simPickBot(p, price, d);
  if (!interactive) {
    if (pick) doGone(p, pick.price, pick.bot.name);
    else doGone(p, null, '');
    return true;
  }
  simPending = pick ? {p, price: pick.price, bot: pick.bot.name} : {p, price, bot: ''};
  openBuy(p);
  $('#buycard .bctop')?.insertAdjacentHTML('afterend',
    `<div class="simline">🤖 I bot arrivano a <b>${simPending.price}</b>${simPending.bot ? ` (${esc(simPending.bot)})` : ''} — compra a ≥${simPending.price + 1} o <kbd>Esc</kbd> per lasciarglielo.</div>`);
  return true;
}
function simNext() { return simStep(true); }
function simResolvePending() {
  if (!simPending) return;
  const s = simPending; simPending = null;
  if (s.bot) doGone(s.p, s.price, s.bot);
  else doGone(s.p, null, '');
}
function toggleSim(on) {
  simMode = on ?? !simMode;
  simPending = null;
  try { localStorage.setItem('fantaasta_sim_on', simMode ? '1' : '0'); } catch (e) {}
  state = loadState();
  closeBuy(); renderAll();
  toast(simMode ? '🤖 Simulazione attiva: prova generale, l\'asta vera non viene toccata'
                : 'Simulazione chiusa: sei tornato all\'asta vera');
}
