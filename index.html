<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FantaAsta 2026-27 · Sala d'asta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=Spline+Sans+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c1210; --panel:#131c18; --panel2:#0f1613; --raise:#182420;
  --line:#233129; --line2:#2e4136;
  --ink:#eaf1ec; --mut:#8fa39a; --faint:#5d6f66;
  --volt:#c6f14d; --volt-ink:#16200a; --gold:#ecc65c;
  --warn:#f5a524; --bad:#ff5d5d; --ok:#43cf8e;
  --rP:#f2a33c; --rD:#43cf8e; --rC:#5aabff; --rA:#ff6363;
  --radius:10px;
  --num:'Spline Sans Mono',ui-monospace,'SF Mono',monospace;
  --cond:'Barlow Condensed','Arial Narrow',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scrollbar-color:#2e4136 #0c1210}
body{
  background:
    radial-gradient(1200px 500px at 50% -180px, rgba(198,241,77,.07), transparent 60%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.011) 0 90px, transparent 90px 180px),
    var(--bg);
  color:var(--ink);
  font:15px/1.45 Barlow,system-ui,sans-serif;
  min-height:100vh;
}
b,strong{font-weight:600}
button{font:inherit;cursor:pointer;border:1px solid var(--line2);background:var(--raise);color:var(--ink);border-radius:8px;padding:6px 12px;transition:.15s}
button:hover{border-color:var(--volt);color:var(--volt)}
button.primary{background:var(--volt);border-color:var(--volt);color:var(--volt-ink);font-weight:700}
button.primary:hover{filter:brightness(1.1);color:var(--volt-ink)}
button.ghost{background:transparent}
button.danger:hover{border-color:var(--bad);color:var(--bad)}
input,select{font:inherit;background:var(--panel2);border:1px solid var(--line2);color:var(--ink);border-radius:8px;padding:7px 10px;outline:none}
input:focus,select:focus{border-color:var(--volt)}
::placeholder{color:var(--faint)}
h2{font-family:var(--cond);text-transform:uppercase;letter-spacing:.08em;font-size:15px;font-weight:600;color:var(--mut)}

/* ---------- header scoreboard ---------- */
header{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(180deg,#0e1512 0%,rgba(14,21,18,.94) 100%);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(8px);
  padding:10px 22px;
  display:flex;align-items:center;gap:26px;flex-wrap:wrap;
}
.brand{font-family:var(--cond);font-weight:700;font-size:26px;letter-spacing:.04em;text-transform:uppercase}
.brand em{font-style:normal;color:var(--volt)}
.brand small{display:block;font-size:11px;letter-spacing:.28em;color:var(--mut);font-weight:500}
.score{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.stat{min-width:64px}
.stat label{display:block;font-family:var(--cond);text-transform:uppercase;letter-spacing:.14em;font-size:10.5px;color:var(--mut)}
.stat b{font-family:var(--num);font-size:22px;font-weight:700;letter-spacing:-.02em}
.stat.hero b{font-size:34px;color:var(--gold);text-shadow:0 0 24px rgba(236,198,92,.35)}
.stat b.flash{animation:flash .6s}
@keyframes flash{0%{color:var(--volt)}100%{}}
.meters{display:grid;grid-template-columns:repeat(4,minmax(90px,120px));gap:6px 14px;margin-left:8px}
.meter{font-size:11px}
.meter .mrow{display:flex;justify-content:space-between;color:var(--mut);font-family:var(--num);font-size:10.5px}
.meter .mrow b:first-child{color:var(--ink)}
.meter .bar{height:5px;border-radius:3px;background:var(--line);margin-top:3px;overflow:hidden}
.meter .bar i{display:block;height:100%;border-radius:3px;transition:width .3s}
.meter.over .bar i{background:var(--warn)!important}
.meter.over .mrow{color:var(--warn)}
.hactions{margin-left:auto;display:flex;gap:8px;align-items:center}
.hactions button{padding:5px 10px;font-size:13px}

/* ---------- opponents strip ---------- */
#oppbar{max-width:1560px;margin:10px auto 0;padding:0 22px;display:flex;gap:8px;flex-wrap:wrap}
.opp{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12px;display:flex;gap:8px;align-items:baseline;white-space:nowrap}
.opp .on{font-family:var(--cond);text-transform:uppercase;letter-spacing:.05em;font-size:12px;color:var(--mut)}
.opp .ol{font-family:var(--num);font-size:14px;font-weight:700;color:var(--gold)}
.opp .os{font-family:var(--num);font-size:10.5px;color:var(--faint)}
.opp .om{font-family:var(--num);font-size:10.5px;color:var(--mut)}
.opp.done{opacity:.45}
.opp.rich .ol{color:var(--volt)}

/* ---------- gone card & walk-away ---------- */
.gonewho{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.gonewho button{font-size:12.5px;padding:4px 9px}
.gonewho button b{font-family:var(--num);color:var(--volt);margin-right:5px}
#goneWho{width:120px;font-family:var(--num)}
.cap.walk{border-color:rgba(198,241,77,.4)}
.cap.walk b{color:var(--volt)}
#walkinfo{font-size:12.5px;color:var(--mut);margin:2px 0 8px}
#walkinfo b{color:var(--ink)}
.scpill{font-family:var(--num);font-size:11px;border:1px solid var(--line2);border-radius:5px;padding:1px 6px;color:var(--mut);white-space:nowrap}
.scpill.hi{color:var(--volt);border-color:rgba(198,241,77,.4)}
.scpill.mid{color:var(--gold);border-color:rgba(236,198,92,.4)}

/* ---------- mirror (second screen) ---------- */
body.mini main{grid-template-columns:1fr}
body.mini main>section:first-child,body.mini .hactions,body.mini #simbar{display:none}
body.mini .tabbody{pointer-events:none}
body.mini .tabs{top:0}
.minitag{font-family:var(--cond);text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--rC);border:1px solid rgba(90,171,255,.4);border-radius:5px;padding:1px 8px;margin-left:10px}

/* ---------- report ---------- */
.repgrid{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.rep-deal{color:var(--ok);font-family:var(--num);font-size:13px}
.rep-over{color:var(--warn);font-family:var(--num);font-size:13px}

/* ---------- simulation mode ---------- */
#simbar{margin:10px 0 0;padding:8px 12px;border:1px dashed rgba(245,165,36,.6);border-radius:8px;font-size:13px;color:var(--warn);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#simbar[hidden]{display:none}
#simbar button{padding:3px 10px;font-size:12.5px}
body.sim header{border-bottom-color:rgba(245,165,36,.7)}
body.sim #btnSim{border-color:var(--warn);color:var(--warn)}
.simline{margin-top:8px;font-size:13.5px;color:var(--warn)}
.simline b{font-family:var(--num)}

/* ---------- layout ---------- */
main{max-width:1560px;margin:18px auto;padding:0 22px;display:grid;grid-template-columns:minmax(400px,4.4fr) 7fr;gap:20px;align-items:start}
@media(max-width:1080px){main{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}

/* ---------- search ---------- */
.searchbox{position:relative}
#q{
  width:100%;padding:15px 18px;font-size:19px;border-radius:12px;
  background:var(--panel);border:1px solid var(--line2);
  box-shadow:0 8px 30px rgba(0,0,0,.35);
}
#q:focus{border-color:var(--volt);box-shadow:0 0 0 3px rgba(198,241,77,.14),0 8px 30px rgba(0,0,0,.35)}
.hint{margin:7px 4px 0;font-size:12px;color:var(--faint)}
.hint kbd{background:var(--raise);border:1px solid var(--line2);border-radius:4px;padding:0 5px;font-family:var(--num);font-size:11px;color:var(--mut)}
#results{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:40;background:var(--panel);border:1px solid var(--line2);border-radius:12px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.55);display:none}
#results.open{display:block}
.res{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.res:last-child{border-bottom:0}
.res.sel{background:rgba(198,241,77,.09)}
.res .nm{font-weight:600;font-size:15.5px;white-space:nowrap}
.res .tm{color:var(--mut);font-size:13px}
.res .fig{margin-left:auto;font-family:var(--num);font-size:12px;color:var(--mut);white-space:nowrap}
.res.dead .nm,.res.dead .tm{text-decoration:line-through;color:var(--faint)}
.res .why{font-size:11.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.rb{font-family:var(--cond);font-weight:700;font-size:12px;width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;flex:none;color:#10150d}
.rb.P{background:var(--rP)}.rb.D{background:var(--rD)}.rb.C{background:var(--rC)}.rb.A{background:var(--rA)}
.wish{font-family:var(--num);font-size:11px;background:rgba(198,241,77,.13);color:var(--volt);border:1px solid rgba(198,241,77,.3);border-radius:5px;padding:1px 6px;white-space:nowrap}
.sleep{font-family:var(--num);font-size:11px;background:rgba(90,171,255,.12);color:var(--rC);border:1px solid rgba(90,171,255,.3);border-radius:5px;padding:1px 6px;white-space:nowrap}
.tag{font-family:var(--cond);text-transform:uppercase;font-size:10.5px;letter-spacing:.08em;border-radius:5px;padding:1px 7px}
.tag.mine{background:rgba(67,207,142,.15);color:var(--ok);border:1px solid rgba(67,207,142,.4)}
.tag.gone{background:rgba(255,93,93,.12);color:var(--bad);border:1px solid rgba(255,93,93,.35)}
.adot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none;box-shadow:0 0 8px var(--warn)}

/* ---------- buy card ---------- */
#buycard{margin-top:14px;padding:16px 18px;border-color:var(--line2);box-shadow:0 14px 40px rgba(0,0,0,.4);animation:pop .18s}
@keyframes pop{from{transform:translateY(-6px);opacity:0}}
#buycard .bctop{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
#buycard .bcname{font-family:var(--cond);font-size:30px;font-weight:700;letter-spacing:.01em}
#buycard .bcteam{color:var(--mut)}
#buycard .figs{margin-left:auto;font-family:var(--num);font-size:13px;color:var(--mut)}
.bcwish{margin:10px 0 4px;display:flex;flex-direction:column;gap:5px}
.bcwish .wrow{font-size:13.5px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.bcwish .wrow .pos{font-family:var(--num);color:var(--volt);font-size:12.5px;white-space:nowrap}
.bcwish .wrow .nt{color:var(--mut);font-size:12.5px}
.bcalert{margin-top:8px;font-size:13px;color:var(--warn);display:flex;gap:8px;align-items:baseline}
.bcrig{margin-top:8px;font-size:12.5px;color:var(--mut)}
.caps{display:flex;gap:10px;margin:12px 0;flex-wrap:wrap}
.cap{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 12px;min-width:96px}
.cap label{display:block;font-family:var(--cond);text-transform:uppercase;font-size:10px;letter-spacing:.12em;color:var(--faint)}
.cap b{font-family:var(--num);font-size:19px}
.cap.main b{color:var(--volt)}
.bcalts{margin:2px 0 10px}
.bcalts .altshead{font-family:var(--cond);text-transform:uppercase;letter-spacing:.1em;font-size:11px;color:var(--faint);margin-bottom:3px}
.bcalts .altrow{display:flex;gap:8px;align-items:baseline;font-size:13px;padding:2px 0}
.bcalts .pr{font-family:var(--num);color:var(--faint);font-size:11px}
.bcalts .tm{color:var(--mut);font-size:12.5px}
.bcalts .mx{font-family:var(--num);color:var(--gold);font-size:12px}
.buyrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
#price{width:130px;font-family:var(--num);font-size:24px;font-weight:700;padding:8px 12px;text-align:center}
#slotSel{max-width:230px}
.buyerr{color:var(--bad);font-size:13px;margin-top:8px;min-height:18px}

/* ---------- advice ---------- */
.advice{margin-top:16px;padding:14px 16px}
.advice h2{margin-bottom:10px}
.adv-role{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:13.5px}
.chip:hover{border-color:var(--volt)}
.chip .px{font-family:var(--num);color:var(--gold);font-size:12px}
.chip .sl{font-family:var(--num);color:var(--faint);font-size:11px}
.chip .sc{font-family:var(--num);font-size:10.5px;color:var(--warn)}
.chip.scarce{border-color:rgba(245,165,36,.55)}
.chip.last{border-color:rgba(255,93,93,.6)}
.chip.last .sc{color:var(--bad)}
.scbadge{font-family:var(--num);font-size:10.5px;color:var(--warn);border:1px solid rgba(245,165,36,.4);border-radius:4px;padding:0 5px;margin-left:6px;white-space:nowrap}
.scbadge.last{color:var(--bad);border-color:rgba(255,93,93,.45)}
.adjup{color:var(--ok);font-weight:600}
.adjdown{color:var(--warn);font-weight:600}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:4px;padding:8px 10px;border-bottom:1px solid var(--line);position:sticky;top:74px;background:var(--panel);z-index:30;border-radius:var(--radius) var(--radius) 0 0;flex-wrap:wrap}
.tabs button{border:0;background:transparent;color:var(--mut);font-family:var(--cond);text-transform:uppercase;letter-spacing:.08em;font-size:14.5px;font-weight:600;padding:7px 14px;border-radius:7px}
.tabs button.on{background:var(--raise);color:var(--volt)}
.tabs .cnt{font-family:var(--num);font-size:11px;opacity:.8}
.tabbody{padding:14px 16px;min-height:300px}

/* rosa */
.rgroup{margin-bottom:18px}
.rghead{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.rghead h3{font-family:var(--cond);text-transform:uppercase;letter-spacing:.1em;font-size:16px}
.rghead .rgfig{font-family:var(--num);font-size:12px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-family:var(--cond);text-transform:uppercase;letter-spacing:.09em;font-size:11px;color:var(--faint);text-align:left;padding:4px 8px;border-bottom:1px solid var(--line)}
td{padding:6px 8px;border-bottom:1px solid var(--line)}
tr:hover td{background:rgba(255,255,255,.02)}
td.num,th.num{text-align:right;font-family:var(--num);font-size:13px}
.slotid{font-family:var(--num);color:var(--faint);font-size:12px}
.owned{color:var(--ok);font-weight:600}
.emptyslot{color:var(--faint)}
.nexthint{color:var(--mut);font-size:12.5px}
.nexthint b{color:var(--ink);font-weight:500}
.xbtn{border:0;background:none;color:var(--faint);padding:2px 6px;font-size:14px}
.xbtn:hover{color:var(--bad)}

/* liste */
.wl-slot{margin-bottom:16px}
.wl-slot>header{position:static;display:flex;gap:10px;align-items:baseline;background:none;border:0;padding:4px 0;backdrop-filter:none}
.wl-slot h3{font-family:var(--cond);font-size:16px;text-transform:uppercase;letter-spacing:.06em}
.wl-slot .wsb{font-family:var(--num);color:var(--gold);font-size:12px}
.wl-list{list-style:none}
.wl-list li{display:flex;gap:9px;align-items:baseline;padding:5px 6px;border-bottom:1px dashed var(--line);cursor:pointer;flex-wrap:wrap}
.wl-list li:hover{background:rgba(255,255,255,.025)}
.wl-list .pr{font-family:var(--num);color:var(--faint);font-size:12px;width:18px;flex:none}
.wl-list .nm{font-weight:600}
.wl-list .tm,.wl-list .ti{color:var(--mut);font-size:12.5px}
.wl-list .mx{margin-left:auto;font-family:var(--num);color:var(--gold);font-size:12.5px;white-space:nowrap}
.wl-list li.dead .nm,.wl-list li.dead .tm{text-decoration:line-through;color:var(--faint)}
.wl-list li.mine .nm{color:var(--ok)}
.wl-list .note{flex-basis:100%;font-size:12px;color:var(--faint);padding-left:27px}
.rig-yes{color:var(--gold);font-size:12px}
.filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.fchip{border-radius:20px;padding:4px 14px;font-family:var(--cond);text-transform:uppercase;letter-spacing:.06em;font-size:13px}
.fchip.on{background:var(--volt);color:var(--volt-ink);border-color:var(--volt);font-weight:700}

/* log */
.logrow{display:flex;gap:10px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line);font-size:14px;flex-wrap:wrap}
.logrow .lt{font-family:var(--num);color:var(--faint);font-size:11px;width:44px}
.logrow input{padding:3px 8px;font-family:var(--num);font-size:13px}
.logrow input.pz{width:70px}
.logrow input.by{width:130px}

/* news */
.newsblock{margin-bottom:20px}
.alert-item{display:flex;gap:9px;padding:7px 4px;border-bottom:1px dashed var(--line);font-size:13.5px;align-items:baseline}
.alert-item .at{font-family:var(--cond);text-transform:uppercase;font-size:10.5px;letter-spacing:.08em;border-radius:4px;padding:1px 7px;flex:none}
.at.infortunio{background:rgba(255,93,93,.14);color:var(--bad)}
.at.mercato{background:rgba(90,171,255,.14);color:var(--rC)}
.at.ballottaggio{background:rgba(245,165,36,.14);color:var(--warn)}
.at.ok{background:rgba(67,207,142,.14);color:var(--ok)}
.at.squalifica{background:rgba(255,93,93,.14);color:var(--bad)}
.at.fairplay{background:rgba(186,120,255,.14);color:#ba78ff}
.srcs{font-size:12px;color:var(--faint);line-height:1.8}

/* toast */
#toasts{position:fixed;left:20px;bottom:20px;z-index:100;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--raise);border:1px solid var(--line2);border-left:3px solid var(--volt);border-radius:8px;padding:10px 16px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:pop .2s}
.toast.err{border-left-color:var(--bad)}
.toast.warn{border-left-color:var(--warn)}

/* dialog */
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line2);border-radius:12px;padding:20px 22px;min-width:320px}
dialog::backdrop{background:rgba(5,8,7,.7)}
dialog h2{margin-bottom:14px;color:var(--ink)}
.setrow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.setrow label{width:150px;color:var(--mut);font-size:14px}
.setrow input{width:90px;font-family:var(--num)}
.dlgbtns{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.footer-note{max-width:1560px;margin:8px auto 30px;padding:0 22px;color:var(--faint);font-size:12px}
</style>
</head>
<body>

<header>
  <div class="brand">Fanta<em>·</em>Asta <small>Serie A 2026–27 · Classic</small></div>
  <div class="score">
    <div class="stat hero"><label>Crediti rimasti</label><b id="stCred">–</b></div>
    <div class="stat"><label>Speso</label><b id="stSpent">–</b></div>
    <div class="stat"><label>Slot liberi</label><b id="stSlots">–</b></div>
    <div class="stat"><label>Media / slot</label><b id="stAvg">–</b></div>
    <div class="stat"><label>Max singolo</label><b id="stCap">–</b></div>
    <div class="stat" title="Residuo reale meno somma dei budget pianificati degli slot vuoti"><label>Vs piano</label><b id="stPlan">–</b></div>
    <div class="meters" id="meters"></div>
  </div>
  <div class="hactions">
    <button id="btnUndo" title="Annulla ultima operazione (Ctrl+Z)">↩ Undo</button>
    <button id="btnMirror" title="Apri le Liste in una finestra separata (secondo schermo, sola lettura, si aggiorna da sola)">⧉</button>
    <button id="btnSim" title="Modalità simulazione: prova generale con bot, senza toccare l'asta vera">🤖</button>
    <button id="btnSet" title="Budget e impostazioni">⚙</button>
    <button id="btnExp" title="Scarica backup JSON">⬇</button>
    <button id="btnImp" title="Ripristina da backup">⬆</button>
    <button id="btnCsv" title="Scarica la rosa in CSV (Excel)">CSV</button>
    <button id="btnReset" class="danger" title="Azzera l'asta">✕</button>
    <input type="file" id="impFile" accept=".json" hidden>
  </div>
</header>

<div id="oppbar"></div>

<main>
  <section>
    <div class="searchbox">
      <input id="q" placeholder="Digita un nome o una squadra…" autocomplete="off" spellcheck="false" autofocus>
      <div id="results"></div>
    </div>
    <div class="hint"><kbd>↑↓</kbd> scegli · <kbd>Invio</kbd> l'ho comprato · <kbd>Shift+Invio</kbd> preso da altri (poi prezzo + tasto <kbd>1-9</kbd> per chi) · <kbd>Esc</kbd> pulisci · <kbd>Ctrl+Z</kbd> undo</div>

e indietro (panchina col Betis): alla 1ª ~25%. Profilo A1 intatto sull'anno: lo sconto d'avvio è l'occasione."},{"name":"Bonny","team":"Inter","type":"ok","text":"IN POLE alla 1ª (~85%): titolare col Betis con assist, 'già in buona forma'. La coppia d'avvio è Bonny-Esposito. 6-8 crediti non basteranno più."},{"name":"Esposito F.P.","team":"Inter","type":"ok","text":"Titolare col Betis: alla 1ª ~75% con Lautaro/Thuram indietro. A secco in 4 amichevoli ma il posto d'avvio è suo."},{"name":"Diouf","team":"Inter","type":"ok","text":"Confermato dal campo (titolare a destra col Betis): alla 1ª ~70% (Spence non al meglio atleticamente). Sul medio periodo la fascia passa a Spence."},{"name":"Spence","team":"Inter","type":"mercato","text":"UFFICIALE (30M+5+10% rivendita, fino al 2031): quinto destro designato a regime, ma alla 1ª parte Diouf. Listato D a Qt 12."},{"name":"Stones","team":"Inter","type":"ballottaggio","text":"Titolare col Betis (65/35 su Bisseck) ma 267 giorni saltati in due stagioni: rendimento alto, affidabilità bassa. Non pagarlo da inamovibile."},{"name":"Luis Henrique","team":"Inter","type":"mercato","text":"NUOVO: accordo Inter-Roma trovato (~25-30M) ma bloccato sull'ingaggio del giocatore; se salta, l'Inter valuta Perisic. Spence gli ha chiuso lo spazio: in uscita, non comprare. La sua cessione sblocca Curtis Jones."},{"name":"Mkhitaryan","team":"Inter","type":"squalifica","text":"Squalificato per la 1ª (con Britschgi/Parma 1g e Kabasele/Udinese 2g). Lista CHIUSA: solo loro 3 in A. Gli aggregatori lo ignorano."},{"name":"Meret","team":"Napoli","type":"ok","text":"Titolare indiscusso di Allegri (~88%). CAMBIO sul vice: ora è FALCONE (Lecce) in pole — ha superato Kovar e Vicario (che va alla Juve); Restes non più in pole (costa 20M+, su di lui Villa e Ipswich)."},{"name":"Milinkovic-Savic V.","team":"Napoli","type":"mercato","text":"In uscita verso Hull City (~15-18M), stallo sulla formula (Napoli vuole obbligo). Nessuna news 16-17/8. Solo da 3° portiere è partito titolare (Aris) con KDB fuori: non più solo 'indietro'. Opzione da 1-2."},{"name":"Vergara","team":"Napoli","type":"ok","text":"Recuperato (in gruppo): scommessa da 1-2 valida. Nessuna notizia nuova."},{"name":"Lucca","team":"Napoli","type":"ballottaggio","text":"Bocciato confermato: fuori dal tipo, Hojlund inamovibile. 1-2 max."},{"name":"Perin","team":"Juventus","type":"ok","text":"TITOLARE alla 1ª (85-90%: 'stavolta gioca Perin' — Spalletti) ma A SCADENZA: la Juve ha SCARTATO Dibu (frattura dito + 15M) e chiuso su VICARIO dal Tottenham (accordo col giocatore, chiusura attesa in 24-72h, ~15M, diritto/obbligo conteso tra fonti). Dalla 2ª-3ª la porta è di Vicario. Perin vale 2-3 crediti per le primissime."},{"name":"Di Gregorio","team":"Juventus","type":"mercato","text":"Fuori dal progetto, bocciato da Spalletti, in uscita: Valencia in accelerazione (prestito con obbligo ~15M condizionato). In più sindrome influenzale il 16/8. Depennare."},{"name":"Kolo Muani","team":"Juventus","type":"ok","text":"Titolare certo (~70%), rigorista in pole per 4 fonti MA designazione dedotta (Goal dà Yildiz, il precedente di marzo dice Locatelli): premio-rigori ridotto. David in uscita spinta dal club: concorrenza minima."},{"name":"David","team":"Juventus","type":"mercato","text":"CAMBIATO in peggio: lui vuole restare ma il CLUB spinge per la cessione (panchina intera col Palermo, bookie 1,60); Villa ha chiesto info. Zirkzee vincolato alla sua uscita e non compare in nessuna tipo. Lasciarlo."},{"name":"Yildiz","team":"Juventus","type":"ok","text":"MIGLIORATO ancora: Spalletti soddisfatto del recupero, operazione scongiurata, fuori da tutte le tabelle infortunati, obiettivo 23/8 confermato. 1° sulle PUNIZIONI (riga certa) e possibile 1° sui rigori per Goal: upside piazzati intatto, gestione da prezzare."},{"name":"Thuram K.","team":"Juventus","type":"infortunio","text":"MIGLIORATO: allenamento COMPLETO col gruppo il 16/8 (sindrome femoro-rotulea superata). Disponibile per Frosinone ma condizione da costruire."},{"name":"Ekhator","team":"Juventus","type":"infortunio","text":"NUOVO: lesione di basso grado alla coscia dx, differenziato, da valutare per il 23/8. FantaMaster lo consigliava a 6cr: lasciar perdere."},{"name":"Alajbegovic","team":"Juventus","type":"ballottaggio","text":"Trequarti contesa (McKennie 50/Alajbegovic 45). ATTENZIONE PREZZO: BetFlag lo fascia a ~20cr per l'hype: non superare 5-6."},{"name":"Koopmeiners","team":"Juventus","type":"ballottaggio","text":"Invariato: alternativa, nessuna fonte lo mette nell'XI. Trappola a prezzo pieno."},{"name":"Kalulu","team":"Juventus","type":"ok","text":"Terzino destro titolare, ballottaggio con Celik APERTO (60/40). Da difensore normale."},{"name":"Lucumì","team":"Juventus","type":"mercato","text":"UFFICIALE (firma annunciata 17/8, 20M+bonus, fino al 2030): alla Juve in ballottaggio con Kelly (55/45). Il buco al Bologna apre a Vitik/Heggem, con Cabal in arrivo dal mercato (prestito con diritto ~10M, manca solo il via libera)."},{"name":"Zhegrova","team":"Juventus","type":"mercato","text":"Dossier potenzialmente stantio (ultime fonti giugno-luglio: Trabzonspor/Besiktas). Resta esubero: non investire."},{"name":"Frattesi","team":"Lazio","type":"ballottaggio","text":"RIDIMENSIONATO: panchina anche col Mantova (dentro al 70' nello 0-2). Alla 1ª è 50/50 con Dele-Bashiru. L'Inter ha il 50% sulla rivendita. Investimento da 12-14, non da 18+."},{"name":"Lazio (rosa)","team":"Lazio","type":"ballottaggio","text":"ELIMINATA DALLA COPPA ITALIA dal Mantova (Serie B): 0-2 in casa, Gattuso contestato dalla curva ('una batosta, ci metto la faccia'), pagelle disastrose (Cancellieri 4, Doekhi 5). Mercato in entrata quasi bloccato. Premio di rischio su TUTTA la rosa Lazio all'asta."},{"name":"Zaccagni","team":"Lazio","type":"ok","text":"Rigorista 1° confermato e RESTA ('Resto alla Lazio, sono in debito coi tifosi' — Pedullà 17/8). Resta il malus disciplina. Voto 5 col Mantova: partenza in salita ma il pacchetto regge."},{"name":"Dia","team":"Lazio","type":"ok","text":"RISOLTO DAL CAMPO: TITOLARE da 9 col Mantova (Ratkov al 71', Noslin al 79' da esterno). Alla 1ª Dia ~65%. Resta l'ipotesi 9 dal mercato se si sblocca Pinamonti."},{"name":"Ratkov","team":"Lazio","type":"ballottaggio","text":"Subentro col Mantova: alla 1ª ~25%. Solo a 2-3."},{"name":"Noslin","team":"Lazio","type":"ballottaggio","text":"Subentro col Mantova (esterno, non 9): da 1-2 per il posto, senza premi."},{"name":"Cataldi","team":"Lazio","type":"infortunio","text":"Post-operatorio pubalgia: prima finestra ~3ª (30/8). Non più rigorista per nessuna fonte fresca: l'assicurazione a 2-4 vale poco."},{"name":"Isaksen","team":"Lazio","type":"infortunio","text":"Operato (ernia sportiva bilaterale), NON convocato col Mantova, rientro ~3ª (SOS; pianetafanta ottimista, non fidarsi). Sconto d'avvio obbligato."},{"name":"Romagnoli","team":"Lazio","type":"infortunio","text":"CHIARITO: NON è mercato — Gattuso: 'non si allena da tre giorni per problemi ai TENDINI'. Rischio concreto anche per la 1ª; l'affare Al-Sadd è saltato. Provstgaard resta il titolare (~75%)."},{"name":"Tavares N.","team":"Lazio","type":"infortunio","text":"Infiammazione al ginocchio, in bilico anche per la convocazione + ipotesi scambio Tomori viva. Pedraza è la scelta (~70%). Solo a saldo estremo."},{"name":"Pedraza","team":"Lazio","type":"ok","text":"PROMOSSO: titolare col Mantova e ~70% alla 1ª (Tavares ko/in uscita). Bruciato (FantaMaster 4cr dal 24/7): 2-4 crediti."},{"name":"Patric","team":"Lazio","type":"infortunio","text":"OUT 1ª (lavoro aerobico appena iniziato); out anche GIGOT (schiena, NUOVO). Pellegrini Lu. recuperato (rientrato col Mantova al 63')."},{"name":"Taylor K.","team":"Lazio","type":"ok","text":"Titolare anche col Mantova e 2° rigorista operativo (Cataldi out). Il primo nome Lazio resta lui — col premio di rischio ambiente."},{"name":"Pinamonti","team":"Sassuolo","type":"mercato","text":"CORREZIONE: la trattativa Lazio è VIVA, non ferma — Sassuolo chiede 15M, Lazio offre ~10M, nodo formula (prestito con obbligo condizionato); ok del giocatore già dato. Escluso col Cesena per tutela. Icardi resta alternativa (ma valuta altre offerte). Rischio alto in entrambe le direzioni: scontare."},{"name":"Bowie","team":"Sassuolo","type":"ok","text":"RIALZATO: 9 TITOLARE nelle probabili di stasera col Cesena (Pinamonti fuori per mercato); se Pinamonti parte è il 9 del Sassuolo. Bruciato (FantaMaster/Goal): 6-10 crediti."},{"name":"Berardi","team":"Sassuolo","type":"infortunio","text":"PEGGIORATO nel quadro: ha saltato TUTTA la preseason (caviglia trascinata da febbraio), Aquilani: 'spero di riaverlo presto'. Probabili di stasera discordanti (una lo mette trequartista, una lo esclude). Alla 1ª ~35% dal 1'. NON pagarlo da rigorista attivo: all'avvio tira Laurienté."},{"name":"Muric","team":"Sassuolo","type":"ballottaggio","text":"DECLASSATO a ~65%: riscattato per 7M MA ha dichiarato conclusa l'esperienza in neroverde e il club valuta la cessione (SassuoloNews: 'l'erede è Turati'); probabili di stasera discordanti Muric/Turati. Solo a sconto o in coppia con Turati."},{"name":"Obrador","team":"Sassuolo","type":"ballottaggio","text":"RIBALTONE-2: superato — DOIG titolare a sinistra nelle probabili del 17/8 e nella tipo di Aquilani ('Obrador arrivato tardi, poca integrazione'). Da 1-2 max."},{"name":"Boloca","team":"Sassuolo","type":"infortunio","text":"Confermati: Boloca (settembre), Candè (metà settembre), Pieragnolo (ottobre), Konè I. (dic/gen), Walukiewicz in recupero. Idzes RIENTRATO in gruppo il 16/8."},{"name":"Suzuki","team":"Parma","type":"mercato","text":"FATTA: all'Aston Villa (30M+5, 5 anni). Depennare. Il Parma valuta 5 portieri svincolati come copertura futura: nessuno insidia Corvi alla 1ª."},{"name":"Corvi","team":"Parma","type":"ok","text":"Titolare senza rivali alla 1ª (Suzuki venduto, Daffara ko fino alla 2ª). Bruciato dalle guide: 3-5 crediti."},{"name":"Daffara","team":"Parma","type":"infortunio","text":"Lesione di basso grado alla coscia, rientro 2ª: da 1 credito per l'alternanza futura. (La voce 'si gioca il posto con Corvi' è pre-infortunio.)"},{"name":"Tourè E.","team":"Parma","type":"ballottaggio","text":"Titolare confermato (~70%) e ora CANDIDATO 1° sui rigori post-Pellegrino (Goal 16/8, 3/3 in carriera) ma quadro conteso (TuttoFantacalcio: Valeri; F-online: Bernabè): pagarlo da titolare, premio-rigori piccolo. Attenzione all'omonimo Idrissa Tourè (va al Monza)."},{"name":"Romero D.","team":"Parma","type":"ballottaggio","text":"RIDIMENSIONATO: nell'XI reale di Coppa davanti c'erano Lontani-Tourè con Frigan riserva; la seconda punta è contesa (Lontani 40/Frigan 35/Elphege 25). Bruciato (FantaMaster). 3-4 max."},{"name":"Elphege","team":"Parma","type":"ballottaggio","text":"Conflitto condizione NON risolto (in dubbio per TuttoFantacalcio) e concorrenza Lontani/Frigan: 1-2 max."},{"name":"Troilo","team":"Parma","type":"ballottaggio","text":"CONFLITTO TRA RICOSTRUZIONI della stessa Coppa: per una fonte il terzetto era Delprato-Troilo-Circati (Valenti mai entrato), per un'altra la linea era a 4 con VALENTI dal 1'. Da 1-2 con occhi aperti, non da certezza."},{"name":"Nicolussi Caviglia","team":"Parma","type":"infortunio","text":"Lesione medio grado: rientro inizio settembre. Cremaschi ottobre. Britschgi squalificato 1ª. NUOVO dal mercato: preso De Martis (2008, Lanús)."},{"name":"Esposito Se.","team":"Cagliari","type":"mercato","text":"ROTTURA TOTALE col Cagliari, fuori dal progetto: Como fermo a ~10M+contropartite vs 20M cash richiesti; anche Napoli e Lazio alla finestra; l'Inter ha la % sulla rivendita. NON comprarlo (a meno di sblocco pre-asta)."},{"name":"Mendy P.","team":"Cagliari","type":"infortunio","text":"ARBITRATO: era TITOLARE da 9 con l'Arezzo il 14/8, poi distrazione all'adduttore all'intervallo → forfait probabile col Parma (fonti sarde: ~20-30%); DAZN lo tiene in ballottaggio. Se out: Borrelli. Mina invece è 'verso il recupero' per la 1ª."},{"name":"Borrelli","team":"Cagliari","type":"ballottaggio","text":"Candidato 9 col Parma se Mendy non recupera (Kevin Carlos in personalizzato). BRUCIATO (Goal/sportcafe24) e la tipo DAZN tiene Kevin Carlos davanti: 2-3 crediti, non di più."},{"name":"Kevin Carlos","team":"Cagliari","type":"infortunio","text":"In programma PERSONALIZZATO, non gioca dal 14/8: 1ª a rischio. Bruciato. 5 max. I rigori (solo Fantacalcio.it) non sono una riga affidabile."},{"name":"Mina","team":"Cagliari","type":"ok","text":"NUOVO: lavora individualmente ma è dato 'verso il recupero' per il Parma (fonti sarde 15/8). Ed è nei nomi-rigori di 3 liste: se rientra, il pacchetto regge."},{"name":"Deiola","team":"Cagliari","type":"ballottaggio","text":"DECLASSATO confermato: nessuna lista fresca lo cita sui rigori (TuttoFantacalcio: Fazzini-Mina-Maldini) e per DAZN è il backup di ADOPO in mediana. Da 3-4, per il posto part-time."},{"name":"Fazzini","team":"Cagliari","type":"ok","text":"L'unica riga piazzati solida del Cagliari (punizioni 1° per 2 fonti concordi) + candidato rigori per 2 liste. Preferito a Romano in mediana (DAZN). Bruciato (pazzidifanta, fantacalcio.it dedicato)."},{"name":"Winks","team":"Cagliari","type":"ok","text":"Regista titolare confermato ma BRUCIATO (fantacalcio.it 'perché comprare' del 16/8 + Goal 1cr): prezzo su."},{"name":"Falcone","team":"Lecce","type":"mercato","text":"RISCHIO NUOVO: in POLE come vice-Meret al Napoli (CalcioNapoli24 16/8, ha superato Kovar e Vicario). Il presidente nega offerte e lui è freddo, ma il Napoli insiste (prima deve cedere Milinkovic). Se parte va da RISERVA: doppio danno. Capitano e titolare stasera: comprare solo a sconto."},{"name":"Geubbels","team":"Lecce","type":"ok","text":"RAFFORZATO: 5-3 sui rigori (7/7 in carriera) e TITOLARE nell'XI probabile di stasera col Palermo (Stulic panchina). Non è più uno sleeper: pagare posto+rigori."},{"name":"Stulic","team":"Lecce","type":"ballottaggio","text":"Panchina nell'XI probabile di stasera: contro-scommessa solo a 1-2."},{"name":"N'Dri","team":"Lecce","type":"ok","text":"Titolare nell'XI di stasera, confermato. Ormai bruciato (Goal 1cr 'stagione della svolta'): 2-4."},{"name":"Berisha M.","team":"Lecce","type":"infortunio","text":"INFORTUNATO (non convocato col Palermo, con Kaba; Siebert squalificato solo in Coppa): fuori dalla corsa rigori e dalla 1ª probabilmente. I piazzati passano a Pierotti/Gandelman."},{"name":"Vicario","team":"Juventus","type":"mercato","text":"LA porta Juve è SUA: accordo col giocatore fatto, intesa col Tottenham in chiusura (~15M, diritto/obbligo conteso tra fonti; Sky 17/8: 'si lavora per chiudere'). NON listato: se compare in un listone aggiornato è un acquisto da 8-12; alla 1ª comunque Perin."},{"name":"Okoye","team":"Udinese","type":"ok","text":"MIGLIORATO: 90' in Coppa il 15/8, spalla ok, cautela rientrata (~75-88%). CORREZIONE: Selvik NON è arrivato (va al Brest) — il vice è PADELLI."},{"name":"Kabasele","team":"Udinese","type":"squalifica","text":"RISOLTO: 2 GIORNATE (5 fonti concordi; il '1 giornata' di tuttoudinese era errato). Salta Como e Monza. Al suo posto PALMA con Abankwah. ATTENZIONE: pazzidifanta e FantaMaster lo schierano ancora titolare — errore da sfruttare."},{"name":"Palma","team":"Udinese","type":"ok","text":"RAFFORZATO: centrale titolare in Coppa (con Abankwah e Solet) e primo candidato per le prime 2 giornate (Kabasele squalificato 2g, Ebosse fuori dal progetto; Bertola NON ha giocato). Qt 2: titolare vero a zero. Runjaic: 'prestazione lucida e pulita'."},{"name":"Solet","team":"Udinese","type":"ok","text":"90' in Coppa, 2° rigorista per indicazione di Runjaic, centrale fairplay ideale (1 giallo in 35). Mercato 'pendente' da monitorare."},{"name":"Zaniolo","team":"Udinese","type":"ok","text":"Trequartista titolare confermato dal campo (Coppa) e 1° sulle PUNIZIONI. NON è candidato ai rigori (1 in carriera). Resta il malus cartellini."},{"name":"Goglichidze","team":"Udinese","type":"ok","text":"RISOLTO: botta in allenamento, 'nulla di serio' (~85% disponibile)."},{"name":"Zanoli","team":"Udinese","type":"infortunio","text":"Crociato: rientro ottobre (Vojvoda titolare a destra confermato dal campo). Chakvetadze frattura metatarso: ~2ª-3ª."},{"name":"Bijlow","team":"Genoa","type":"ok","text":"Titolare confermato (~90%): il 4-1 all'Ascoli (rimonta dallo 0-1) lo conferma; un solo gol subito su deviazione di Otoa. Vice: Stolz in vantaggio su Sommariva."},{"name":"Colombo","team":"Genoa","type":"ok","text":"Titolare certo e IN GOL con l'Ascoli (62'). Rigorista per tutte le fonti; l'episodio-Ostigard è di APRILE (peso ridotto ma non zero). ~70% col vice in arrivo dal mercato."},{"name":"Baldanzi","team":"Genoa","type":"ok","text":"TITOLARE E IN GOL (45') da trequartista nel 3-4-2-1 con l'Ascoli; 1° sulle punizioni. Alla 1ª ~75%. Bruciato: budget 14-16."},{"name":"Ostigard","team":"Genoa","type":"ok","text":"RISOLTO: la panchina del 16/8 era TURNOVER (entrato al 46'), tutte le tipo lo danno titolare in campionato (~75%). Restano i 7 gialli: da D4 con malus fairplay."},{"name":"Sow","team":"Genoa","type":"ballottaggio","text":"Misto confermato: entrato al 46' con l'Ascoli ma le probabili lo danno favorito in mediana per la 1ª (~65 su Ellertsson). Bruciato (Goal 1cr). 2-4."},{"name":"Mitaj","team":"Genoa","type":"ok","text":"Titolare quinto sinistro il 16/8 con ASSIST (corner per Marcandalli), uscito al 46' (turnover). Ballottaggio 55-45 con Ellertsson/Martin. Bruciato (3 fonti): 3-5."},{"name":"Marcandalli","team":"Genoa","type":"ok","text":"NUOVO DAL CAMPO: braccetto titolare e GOL di testa su corner con l'Ascoli. Le guide lo citano solo come backup: low cost da 1-3."},{"name":"Havel","team":"Genoa","type":"ok","text":"RAFFORZATO: recuperato, convocato e IN GOL da subentrato (80') con l'Ascoli. Prima alternativa a Colombo: scommessa da 1-2 che nessuna guida cita."},{"name":"Messias","team":"Genoa","type":"infortunio","text":"NUOVO: adduttore, tempi da definire (era appena rientrato). Meichtry out fino a fine agosto (CAMBIATO: out certo 1ª); Traorè Hj. senza tempistica (De Rossi)."},{"name":"Dovbyk","team":"Bologna","type":"ballottaggio","text":"Ballottaggio 55/45 con Piccoli confermato (Piccoli preso il 14/8 apposta per il duello). Vice-rigorista per Goal/SOS (27/32): upside-dischetto reale."},{"name":"Piccoli","team":"Bologna","type":"ok","text":"Co-titolare vero (45/55), esordio già fatto col Brighton. ATTENZIONE: gli aggregatori non lo hanno ancora nelle probabili (arrivato 14/8). Qt 8: buon prezzo/rischio."},{"name":"Holm","team":"Bologna","type":"ok","text":"RECUPERATO: ingresso al 72' col Brighton, obiettivo dichiarato la 1ª con la Lazio (~85% disponibile). Ma nella tipo di Tedesco Zortea resta favorito 60/40. La voce 'out fino alla 2ª' era falsa."},{"name":"Casale","team":"Bologna","type":"infortunio","text":"Confermato a forte rischio 1ª (~30%, bicipite femorale/adduttori). Con Lucumì alla Juve la coppia è HEGGEM (85%) + VITIK (50; Helland 40). E dal mercato arriva CABAL (Juve, manca solo il via libera)."},{"name":"Vitik","team":"Bologna","type":"ok","text":"RIABILITATO: le probabili aggiornate lo danno TITOLARE con Heggem (Helland alternativa). L'affaticamento non è confermato dalle tabelle. 2-4 crediti."},{"name":"Cambiaghi","team":"Bologna","type":"ballottaggio","text":"BOCCIATO: 'Rowe nettamente favorito' nelle probabili aggiornate. Il segnale del Brighton non regge. Solo a saldo (1-3)."},{"name":"Orsolini","team":"Bologna","type":"ok","text":"Rigorista 1° unanime confermato. Nessun allarme."},{"name":"De Ketelaere","team":"Atalanta","type":"infortunio","text":"PEGGIORATO: OUT 1ª e rientro a inizio settembre (in dubbio anche la 2ª). Nel tridente del 4-3-3 di Sarri al rientro: comprare SOLO con sconto pieno. F-online/CalcioDangolo lo schierano ancora: errore da sfruttare."},{"name":"Atalanta (modulo)","team":"Atalanta","type":"ballottaggio","text":"SARRI GIOCA 4-3-3, NON più difesa a 3: Bellanova/Zappacosta TERZINI in ballottaggio 50/50 (non quinti), Kristensen 55/Kossounou 45, Scalvini centrale, Bernasconi ~60 a sinistra (Ahanor: per la tabella infortuni è out, ma qualche fonte lo rimette tra le opzioni — NON risolto). Molte fonti girano ancora formazioni 25/26 con Lookman/Juric: inservibili."},{"name":"Bellanova","team":"Atalanta","type":"mercato","text":"Nel 4-3-3 è TERZINO in ballottaggio 50/50 con Zappacosta (non più quinto titolare certo). Offerta Fulham 20M respinta ma colloqui aperti (Romano 16/8); Everton/Tottenham/Forest interessate. Ridimensionare a 6-8."},{"name":"Raspadori","team":"Atalanta","type":"ok","text":"Titolare nel tridente (con De Ketelaere out ha ancora più spazio): upgrade confermato."},{"name":"Samardzic","team":"Atalanta","type":"ok","text":"Mezzala titolare del 4-3-3, piazzati, fairplay pulito. Acquisto da fascia (20-28), non più sleeper."},{"name":"Gaetano","team":"Atalanta","type":"ok","text":"PROMOSSO: Sarri lo usa da REGISTA ('dovrebbe guadagnarsi la titolarità assoluta') e sale sui piazzati. Semi-bruciato (Goal 1cr): 8-12."},{"name":"Scamacca","team":"Atalanta","type":"ok","text":"1° rigorista unanime ma staffetta col posto: Scamacca 55/Krstovic 45. Tetto 90-100."},{"name":"Kristensen T.","team":"Atalanta","type":"ballottaggio","text":"55/45 su Kossounou confermato ('Kristensen e Scalvini partono avanti'). 5-7 crediti."},{"name":"Sulemana K.","team":"Atalanta","type":"infortunio","text":"Confermato: rientro ottobre, come Hien (mangia-gialli: solo parcheggio a 1)."},{"name":"Malen","team":"Roma","type":"ok","text":"Rigorista 1° per 5 fonti contro 1: il conteso si è sgonfiato (l'alternanza è la lettura del solo FantaMaster). Titolare da 9 (65/35 su Castro). Pacchetto pieno."},{"name":"Dybala","team":"Roma","type":"ok","text":"In forma (gol e assist col Dortmund), 1° sui piazzati a prescindere dai rigori, ~70% col consueto tema gestione. Nessun rischio cessione."},{"name":"Soulè","team":"Roma","type":"mercato","text":"DOPPIO FRONTE: Sunderland/Fulham (interesse senza offerta formale, ~35M) + proposto al MILAN nell'ipotesi scambio con Nkunku. Titolare (~70%) ma sconto-mercato pieno fino all'1/9."},{"name":"Castro S.","team":"Roma","type":"ballottaggio","text":"Alternativa di Malen (~35%): pagarlo da co-titolare, upside coesistenza da monitorare."},{"name":"Wesley","team":"Roma","type":"ok","text":"CORREZIONE DI LATO: gioca a SINISTRA (Molina a destra). Distorsione lieve assorbibile: ~80% alla 1ª (se non ce la fa: Rensch). Fairplay ok."},{"name":"Bah","team":"Roma","type":"infortunio","text":"Crociato confermato, lungodegente. NUOVI incerti Roma: Pisilli (muscolare) e Vaz (collaterale). E la Roma tratta Rodrigo Mora (ok Friedkin) e Luis Henrique."},{"name":"Pessina","team":"Monza","type":"infortunio","text":"Operato (lussazione rotula): rientro novembre. Ancora schierato/indicato rigorista da TuttoFantacalcio, F-online, CalcioDangolo, DAZN, Sisal: resta l'errore più diffuso e sfruttabile."},{"name":"Cutrone","team":"Monza","type":"ok","text":"Rigorista 1° fino a novembre CONFERMATO (le liste che danno Pessina o Petagna sono stale: uno è operato, l'altro va al Pisa). Unica punta di Juric (~80%). Bruciatissimo: 10-14."},{"name":"Colpani","team":"Monza","type":"ballottaggio","text":"RIDIMENSIONATO: PANCHINA in Coppa (3-0 all'Avellino) — titolare ~60%, con Forson (in gol) emergente. Le punizioni restano sue con Pessina out. 4-5 crediti, non di più."},{"name":"Akinsanmiro","team":"Monza","type":"ballottaggio","text":"NON PIÙ PULITO: fuori in Coppa (febbre) e ripreso dalle guide (Goal 1cr). Titolare nella tipo ma verificare: 3-5."},{"name":"Varela G.","team":"Monza","type":"ok","text":"DOPPIETTA da titolare in Coppa accanto a Cutrone (65/35 su Mota). Ancora fuori dalle tipo degli aggregatori: il low cost A del Monza è lui. 4-6."},{"name":"Thiam","team":"Monza","type":"ok","text":"RAFFORZATO: titolare in Coppa (3-0), Pizzignacco trattenuto, piste esterne chiuse (Montipò al Venezia, Di Gregorio verso Valencia). ~80%: da 2-5 è tornato un buon P3."},{"name":"Comuzzo","team":"Torino","type":"infortunio","text":"NON RISOLTO: colpo alla tibia in Coppa (uscito al 67' per Ismajli), prime indicazioni rassicuranti ma ESAMI NON PUBBLICATI (una ricostruzione lo dà 90' in campo: falsa). ~55-70%. Bruciato come low cost (TuttoFantacalcio/BetFlag): verificare prima di pagarlo."},{"name":"Simeone","team":"Torino","type":"ok","text":"Titolare e gol in Coppa: prima scelta di Abate (~75%), fairplay ottimo. Confermato."},{"name":"Zapata D.","team":"Torino","type":"infortunio","text":"Confermato bocciato per l'avvio: zero minuti. Non è un investimento."},{"name":"Njie","team":"Torino","type":"mercato","text":"PARTENZA PROBABILE: il Crystal Palace ha superato il Salisburgo (~20M bonus inclusi vs 12M+percentuale); decisione a Cairo 'nelle prossime ore'. Depennare."},{"name":"Oristanio","team":"Torino","type":"ballottaggio","text":"DECLASSATO: panchina in Coppa (Casadei titolare 90' da sotto-punta) + bruciato (pazzidifanta). 2 max."},{"name":"Casadei","team":"Torino","type":"ok","text":"CONFERMATO perno di Abate (titolare 90' in Coppa con Vlasic). ATTENZIONE PREZZO: BetFlag lo fascia a ~20cr — non inseguire oltre 13."},{"name":"Perri","team":"Torino","type":"mercato","text":"FATTA (Romano 16/8): prestito 1M + diritto ~14M dal Leeds, visite attese OGGI 17/8 e presentazione 18/8 (fonti discordi sui giorni). Titolare atteso col Milan (~60%, Mascardi 40) ma zero precampionato + lieve noia fisica segnalata. NON listato: se non compare, la porta Toro si copre con Mascardi a 1. Paleari in uscita."},{"name":"Israel","team":"Torino","type":"infortunio","text":"Operato (spalla): out fino a dicembre/gennaio."},{"name":"Douvikas","team":"Como","type":"ok","text":"Titolare confermato (~80-85%). Delap resta bloccato sulla formula (Chelsea no al prestito); Morata ai margini con status ambiguo. 2° rigorista."},{"name":"Morata","team":"Como","type":"mercato","text":"Status AMBIGUO: ha giocato il test a porte chiuse col Liverpool ma non compare in nessuna proiezione di XI; assente dalle tabelle infortunati. Uscita legata al colpo in attacco (Kean?). Lasciarlo."},{"name":"Kempf","team":"Como","type":"ballottaggio","text":"RIDIMENSIONATO DI NUOVO: Chalobah è recuperato e titolare (84' ad Anfield). Kempf torna alternativa: 1-2."},{"name":"Chalobah T.","team":"Como","type":"ok","text":"RISOLTO IL GIALLO: nessun infortunio — TITOLARE fino all'84' ad Anfield il 16/8, Fabregas lo elogia ('già un giocatore fatto'). ~85-95% alla 1ª: torna comprabile da titolare."},{"name":"Kaiki","team":"Como","type":"ballottaggio","text":"TORNATO FAVORITO: col Liverpool è partito LUI (Valle subentrato al 35'). Kaiki 60/Valle 40. Resta bruciato (Sisal): 4-6 max."},{"name":"Paz N.","team":"Como","type":"ballottaggio","text":"PRECISATO: ha giocato 20' nel 2° test col Liverpool ('ha acceso la squadra') ma resta fuori dall'XI proiettato: alla 1ª ~60-75% con rischio spezzone. Sull'anno resta il C1 designato."},{"name":"Diao","team":"Como","type":"infortunio","text":"OUT 1ª confermato (rientro col Torino alla 2ª). Sulla trequarti Liberali/Rodriguez con Baturina."},{"name":"Addai","team":"Como","type":"infortunio","text":"Rottura tendine d'Achille operata: rientro ottobre. Confermato."},{"name":"Kean","team":"Fiorentina","type":"mercato","text":"NUOVO ALERT: ASSALTO COMO IN CORSO — rilancio atteso a ore (TMW 17/8 h6:38; Pedullà: prima offerta ufficiale oggi/domani, si parla di 35-45M bonus inclusi). La Fiorentina chiede 45-50 e dichiara di tenerlo. Prezzare il rischio fino all'1/9."},{"name":"Dodò","team":"Fiorentina","type":"mercato","text":"RISOLTO il conflitto: vince il RINNOVO-PONTE (TMW 12/8: 'inversione di marcia', nessuna offerta Forest, gentlemen's agreement per il rinnovo annuale). MA in Coppa era in PANCHINA: la destra è contesa (Joao Mario dal campo, Jimenez dal mercato, Fortini caso). 3-4 max."},{"name":"Jimenez A.","team":"Fiorentina","type":"ballottaggio","text":"CONFLITTO APERTO sulla des /* ============================== utils ============================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => (s ?? '').toString().normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const ROLES = ['P','D','C','A'];
const ROLENAME = {P:'Portieri', D:'Difensori', C:'Centrocampisti', A:'Attaccanti'};

/* ============================== indexes ============================== */
const byId = new Map(DATA.players.map(p => [p.id, p]));
const byNorm = new Map();           // norm name -> [player]
for (const p of DATA.players) {
  p._n = norm(p.name); p._t = norm(p.team);
  if (!byNorm.has(p._n)) byNorm.set(p._n, []);
  byNorm.get(p._n).push(p);
}
function findPlayer(name, team) {
  const cands = byNorm.get(norm(name)) || [];
  if (cands.length === 1) return cands[0];
  if (team) { const hit = cands.find(p => p._t === norm(team)); if (hit) return hit; }
  return cands[0] || null;
}
const slotById = new Map(DATA.slots.map(s => [s.id, s]));
// wishlist index: pid -> [{role, slot, prio, maxprice, ...}]  ·  slot id -> group
const wishByPid = new Map();
const wishBySlot = new Map();
for (const role of ROLES) {
  for (const grp of (DATA.wishlist[role] || [])) {
    wishBySlot.set(grp.slot, {role, ...grp});
    grp.players.forEach(w => {
      const p = findPlayer(w.name, w.team);
      if (!p) return;
      if (!wishByPid.has(p.id)) wishByPid.set(p.id, []);
      wishByPid.get(p.id).push({role, slot: grp.slot, profile: grp.profile, slotBudget: grp.budget, ...w});
    });
  }
}
// sleepers index
const sleepByPid = new Map();
for (const role of Object.keys(DATA.sleepers || {})) {
  for (const s of DATA.sleepers[role]) {
    const p = findPlayer(s.name, s.team);
    if (!p) continue;
    if (!sleepByPid.has(p.id)) sleepByPid.set(p.id, []);
    sleepByPid.get(p.id).push(s);
  }
}
// alerts index
const alertByPid = new Map();
for (const a of (DATA.alerts || [])) {
  const p = findPlayer(a.name, a.team);
  if (!p) continue;
  if (!alertByPid.has(p.id)) alertByPid.set(p.id, []);
  alertByPid.get(p.id).push(a);
}

/* ============================== state ============================== */
const LS_KEY = 'fantaasta_2627_v1';
const LS_SIM = 'fantaasta_2627_sim';
let simMode = false;
try { simMode = localStorage.getItem('fantaasta_sim_on') === '1'; } catch (e) {}
const lsKey = () => simMode ? LS_SIM : LS_KEY;
let state = loadState();
function defaultState() {
  return { budget: DATA.budget, roleBudget: {...DATA.roleBudget}, actions: [],
           oppNames: Array.from({length: 9}, (_, i) => `Squadra ${i + 2}`) };
}
function loadState() {
  try {
    const raw = localStorage.getItem(lsKey());
    if (raw) return {...defaultState(), ...JSON.parse(raw)};
  } catch (e) {}
  if (simMode) return defaultState();   // la sim parte pulita, niente cookie
  try {
    const m = document.cookie.match(/(?:^|;\s*)fantaasta_bk=([^;]+)/);
    if (m) {
      const st = {...defaultState(), ...JSON.parse(decodeURIComponent(m[1]))};
      toast('Stato ripristinato dal cookie di backup', 'warn');
      return st;
    }
  } catch (e) {}
  return defaultState();
}
function save() {
  const raw = JSON.stringify(state);
  try { localStorage.setItem(lsKey(), raw); } catch (e) {}
  if (simMode) return;                  // il cookie di backup resta dell'asta vera
  // cookie backup (4KB limit): full state, else buys only
  let ck = raw;
  if (encodeURIComponent(ck).length > 3800) {
    ck = JSON.stringify({...state, actions: state.actions.filter(a => a.t === 'buy')});
  }
  if (encodeURIComponent(ck).length <= 3900) {
    document.cookie = 'fantaasta_bk=' + encodeURIComponent(ck) + ';max-age=7776000;path=/;SameSite=Lax';
  }
}

/* derived view of state */
function derive() {
  const mine = state.actions.filter(a => a.t === 'buy');
  const gone = state.actions.filter(a => a.t === 'gone');
  const minePid = new Map(mine.map(a => [a.pid, a]));
  const gonePid = new Map(gone.map(a => [a.pid, a]));
  const spent = mine.reduce((s,a) => s + a.price, 0);
  const spentRole = {P:0,D:0,C:0,A:0};
  const cntRole = {P:0,D:0,C:0,A:0};
  const slotFill = new Map();
  for (const a of mine) { spentRole[a.role] += a.price; cntRole[a.role]++; if (a.slot) slotFill.set(a.slot, a); }
  const totSlots = ROLES.reduce((s,r) => s + DATA.roleSlots[r], 0);
  const left = state.budget - spent;
  const slotsLeft = totSlots - mine.length;
  // dynamic budget: spread surplus/deficit over empty slots, proportional to their planned budget
  const emptyPlanSum = DATA.slots.reduce((s,x) => s + (slotFill.has(x.id) ? 0 : x.budget), 0);
  const factor = emptyPlanSum > 0 ? left / emptyPlanSum : 0;
  const opps = (state.oppNames || []).map(name => {
    const buys = gone.filter(a => a.buyer === name);
    const oSpent = buys.reduce((s,a) => s + (a.price || 0), 0);
    const cnt = {P:0,D:0,C:0,A:0};
    buys.forEach(a => cnt[a.role]++);
    const oLeft = state.budget - oSpent;
    const oSlotsLeft = totSlots - buys.length;
    const canBuyRole = {};
    ROLES.forEach(r => canBuyRole[r] = cnt[r] < DATA.roleSlots[r]);
    return {name, spent: oSpent, cnt, left: oLeft, slotsLeft: oSlotsLeft, canBuyRole,
            maxBid: Math.max(0, oLeft - Math.max(0, oSlotsLeft - 1))};
  });
  return {mine, gone, minePid, gonePid, spent, spentRole, cntRole, slotFill, left, slotsLeft, opps,
          emptyPlanSum, factor, planDelta: left - emptyPlanSum,
          adjBudget: id => { const s = slotById.get(id); return s ? Math.round(s.budget * factor) : 0; },
          maxBid: Math.max(0, left - Math.max(0, slotsLeft - 1)),
          avg: slotsLeft ? Math.floor(left / slotsLeft) : 0};
}
function freeSlots(role) {
  const d = derive();
  return DATA.slots.filter(s => s.role === role && !d.slotFill.has(s.id));
}
// wishlist entries of a slot still on the board (not mine, not gone) as {w, p}
function slotAvailable(slotId, d) {
  const grp = wishBySlot.get(slotId);
  if (!grp) return [];
  return grp.players.map(w => ({w, p: findPlayer(w.name, w.team)}))
    .filter(x => x.p && !d.minePid.has(x.p.id) && !d.gonePid.has(x.p.id));
}

function doBuy(p, price, slotId) {
  state.actions.push({t:'buy', pid:p.id, name:p.name, role:p.r, team:p.team, slot:slotId, price, ts:Date.now()});
  save(); renderAll();
  const d = derive();
  toast(`✅ <b>${esc(p.name)}</b> → ${slotId} a <b>${price}</b> · restano ${d.left} crediti`);
  $('#stCred').classList.add('flash'); setTimeout(()=>$('#stCred').classList.remove('flash'), 600);
}
function doGone(p, price=null, buyer='') {
  state.actions.push({t:'gone', pid:p.id, name:p.name, role:p.r, team:p.team, price, buyer, ts:Date.now()});
  save(); renderAll();
  toast(`⛔ <b>${esc(p.name)}</b> preso da altri${buyer ? ` (<b>${esc(buyer)}</b>${price ? ` a ${price}` : ''})` : ''}`, 'warn');
}

  const card = $('#buycard');
  card.hidden = false;
  card.innerHTML = `

      <button class="ghost" id="goneSkip" title="Registra e basta (Esc)">Registra senza dettagli</button>
    </div>
    <div class="gonewho" id="goneBtns" hidden>
      ${names.map((n, i) => `<button data-b="${esc(n)}"><b>${i + 1}</b>${esc(n)}</button>`).join('')}
      <button data-b=""><b>0</b>non so</button>
    </div>
    <div class="hint" style="margin:6px 0 0">Invio = avanti · Esc = registra senza dettagli</div>`;
  const priceEl = $('#gonePrice'), whoEl = $('#goneWho');
  const finalize = (price, buyer) => {
    const t = goneTarget; goneTarget = null;
    doGone(t, price, buyer);
    closeBuy();
  };
  priceEl.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      if (!names.length) { finalize(parseInt(priceEl.value, 10) || null, ''); return; }
      whoEl.hidden = false; $('#goneBtns').hidden = false; whoEl.focus();
    }
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); finalize(parseInt(priceEl.value, 10) || null, ''); }
  });
  whoEl.addEventListener('keydown', e => {
    e.preventDefault(); e.stopPropagation();
    if (/^[1-9]$/.test(e.key)) { const n = names[+e.key - 1]; if (n) finalize(parseInt(priceEl.value, 10) || null, n); }
    else if (e.key === '0' || e.key === 'Enter' || e.key === 'Escape') finalize(parseInt(priceEl.value, 10) || null, '');
  });
  $('#goneSkip').addEventListener('click', () => finalize(parseInt(priceEl.value, 10) || null, ''));
  card.querySelectorAll('#goneBtns button').forEach(b =>
    b.addEventListener('click', () => finalize(parseInt(priceEl.value, 10) || null, b.dataset.b)));

  $('#results').classList.remove('open');

/* ============================== search ============================== */
let selIdx = 0, curResults = [];
function doSearch(q) {
  const nq = norm(q);
  const box = $('#results');
  if (nq.length < 2) { box.classList.remove('open'); curResults = []; return; }
  const d = derive();
  const scored = [];
  for (const p of DATA.players) {
    if (d.cntRole[p.r] >= DATA.roleSlots[p.r] && !d.minePid.has(p.id)) continue;
    let s = 0;
    if (p._n.startsWith(nq)) s = 100;
    else if (p._n.split(' ').some(w => w.startsWith(nq))) s = 85;
    else if (p._n.includes(nq)) s = 62;
    else if (p._t.startsWith(nq)) s = 32;
    else continue;
    const w = wishByPid.get(p.id);
    if (w) s += 26 - Math.min(w[0].prio, 10);
    if (sleepByPid.has(p.id)) s += 8;
    if (d.minePid.has(p.id) || d.gonePid.has(p.id)) s -= 45;
    scored.push([s + (p.fvm || 0) / 2000, p]);
  }
  scored.sort((a,b) => b[0] - a[0]);
  curResults = scored.slice(0, 9).map(x => x[1]);
  selIdx = 0;
  renderResults();
}
function renderResults() {
  const d = derive();
  const box = $('#results');
  if (!curResults.length) { box.classList.remove('open'); return; }
  box.innerHTML = curResults.map((p, i) => {
    const w = wishByPid.get(p.id);
    const sl = sleepByPid.get(p.id);
    const al = alertByPid.get(p.id);
    const mine = d.minePid.get(p.id), gone = d.gonePid.get(p.id);
    let badges = '';
    if (w) badges += `<span class="wish">★ ${w.map(x => `${x.slot} #${x.prio}`).join(' · ')} · max ${w[0].maxprice}</span>`;
    if (!w && sl) badges += `<span class="sleep">◆ occasione · ~${esc(sl[0].price ?? '?')}</span>`;
    if (al) badges += `<span class="adot" title="${esc(al.map(a=>a.text).join(' | '))}"></span>`;
    if (mine) badges += `<span class="tag mine">mio · ${mine.price}</span>`;
    if (gone) badges += `<span class="tag gone">andato</span>`;
    return `<div class="res ${i===selIdx?'sel':''} ${mine||gone?'dead':''}" data-i="${i}">
      <span class="rb ${p.r}">${p.r}</span>
      <span class="nm">${esc(p.name)}</span><span class="tm">${esc(p.team)}</span>
      ${badges}
      <span class="fig">Qt ${p.qta} · FVM ${p.fvm} · S ${p.score ?? '–'}</span>
    </div>`;
  }).join('');
  box.classList.add('open');
  box.querySelectorAll('.res').forEach(el => {
    el.addEventListener('click', () => openBuy(curResults[+el.dataset.i]));
  });
}

/* ============================== walk-away ============================== */
/* prezzo oltre cui mollare: max del piano corretto per alternative rimaste
   (FantaScore ≥75% del target), tetto slot riproporzionato e pressione avversari */
function walkAway(p, slotId, d) {
  const w = (wishByPid.get(p.id) || []).find(x => x.slot === slotId) || (wishByPid.get(p.id) || [])[0];
  const sl = (sleepByPid.get(p.id) || [])[0];
  const adj = d.adjBudget(slotId);
  const base = w?.maxprice ?? sl?.price ?? adj ?? 1;
  const myScore = p.score || 50;
  const alts = slotAvailable(slotId, d).filter(x => x.p.id !== p.id && (x.p.score || 0) >= .75 * myScore).length;
  const f = alts >= 3 ? .92 : alts === 2 ? 1 : alts === 1 ? 1.08 : 1.22;
  let v = Math.round(base * f);
  if (adj) v = Math.min(v, Math.round(adj * 1.35));
  v = Math.min(v, d.maxBid);
  const rivals = d.opps.filter(o => o.canBuyRole[p.r] && o.maxBid > 0);
  const topRival = rivals.length ? Math.max(...rivals.map(o => o.maxBid)) : 0;
  if (topRival + 1 < v) v = topRival + 1;   // nessuno può arrivarci: non pagare di più
  v = Math.max(1, v);
  return {v, alts, topRival, overtakers: rivals.filter(o => o.maxBid >= v)};
}

/* ============================== simulation ============================== */
/* prezzo atteso: FVM riscalato sui crediti totali del tavolo (10 squadre), ±25% */
const SIMSCALE = (() => {
  const top = DATA.players.map(p => p.fvm || 0).sort((a,b) => b - a).slice(0, 250);
  const sum = top.reduce((s,v) => s + v, 0);
  return sum > 0 ? (DATA.budget * 10) / sum : 1;
})();
let simPending = null;   // {p, price, bot} — chiamata sul banco
function simPickBot(p, price, d) {
  const elig = d.opps.filter(o => o.canBuyRole[p.r] && o.slotsLeft > 0);
  if (!elig.length) return null;
  const can = elig.filter(o => o.maxBid >= price);
  const pool = can.length ? can : elig;
  const bot = pool[Math.floor(Math.random() * pool.length)];
  return {bot, price: Math.max(1, Math.min(price, bot.maxBid))};
}
function simStep(interactive) {
  const d = derive();
  if (d.slotsLeft <= 0 && !interactive) return false;
  const pool = DATA.players
    .filter(p => !d.minePid.has(p.id) && !d.gonePid.has(p.id) && (p.fvm || 0) > 1)
    .sort((a,b) => (b.fvm || 0) - (a.fvm || 0));
  if (!pool.length) { toast('Listone esaurito: simulazione finita', 'warn'); return false; }
  const p = pool[Math.floor(Math.random() * Math.min(12, pool.length))];
  const price = Math.max(1, Math.round((p.fvm || 1) * SIMSCALE * (0.75 + Math.random() * 0.5)));
  const pick = simPickBot(p, price, d);
  if (!interactive) {
    if (pick) doGone(p, pick.price, pick.bot.name);
    else doGone(p, null, '');
    return true;
  }
  simPending = pick ? {p, price: pick.price, bot: pick.bot.name} : {p, price, bot: ''};
  openBuy(p);
  $('#buycard .bctop')?.insertAdjacentHTML('afterend',
    `<div class="simline">🤖 I bot arrivano a <b>${simPending.price}</b>${simPending.bot ? ` (${esc(simPending.bot)})` : ''} — compra a ≥${simPending.price + 1} o <kbd>Esc</kbd> per lasciarglielo.</div>`);
  return true;
}
function simNext() { return simStep(true); }
function simResolvePending() {
  if (!simPending) return;
  const s = simPending; simPending = null;
  if (s.bot) doGone(s.p, s.price, s.bot);
  else doGone(s.p, null, '');
}
function toggleSim(on) {

      : sl.length ? `<div class="bcwish">${sl.map(x => `<div class="wrow"><span class="pos" style="color:var(--rC)">◆ occasione dal web · ~${esc(x.price ?? '?')}</span><span>${esc(x.why || '')}</span></div>`).join('')}</div>`

      ${free.length ? `<div class="cap walk" title="Prezzo di walk-away: piano corretto per alternative rimaste, tetto slot e pressione avversari"><label>Molla a</label><b id="capWalk">–</b></div>` : ''}

  $('#btnGone').addEventListener('click', () => openGone(p));
  $('#btnCancel').addEventListener('click', closeBuy);
  priceEl?.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); confirmBuy(); }
    if (e.key === 'Escape') { e.preventDefault(); closeBuy(); }
  });
  $('#results').classList.remove('open');
}
function confirmBuy() {
  if (!buyTarget) return;
  const d = derive();
  const price = parseInt($('#price').value, 10);
  const slotId = $('#slotSel').value;
  const err = $('#buyerr');
  if (!price || price < 1) { err.textContent = 'Inserisci i crediti pagati.'; $('#price').focus(); return; }
  if (d.minePid.has(buyTarget.id)) { err.textContent = 'Già comprato.'; return; }
  if (price > d.maxBid) { err.textContent = `Impossibile: puoi offrire al massimo ${d.maxBid} (devi tenere 1 credito per ogni altro slot vuoto).`; return; }
  if (!slotId) { err.textContent = 'Nessuno slot libero per questo ruolo.'; return; }
  const p = buyTarget;
  if (simPending && simPending.p.id === p.id) simPending = null;   // battuto il bot
  closeBuy();
  doBuy(p, price, slotId);
}
function closeBuy() {
  buyTarget = null;
  $('#buycard').hidden = true;
  $('#buycard').innerHTML = '';
  const q = $('#q'); q.value = ''; curResults = []; $('#results').classList.remove('open'); q.focus();
  simResolvePending();   // in sim: se la chiamata era sul banco, il bot se lo porta via
}

$('#tabs').addEventListener('click', e => {

});
function renderTab() {
  const body = $('#tabbody');
  if (curTab === 'rosa') body.innerHTML = viewRosa();
  else if (curTab === 'liste') body.innerHTML = viewListe();
  else if (curTab === 'listone') body.innerHTML = viewListone();

  else if (curTab === 'report') body.innerHTML = viewReport();
  else body.innerHTML = viewNews();
  bindTab(body);
}
function bindTab(body) {
  body.querySelectorAll('[data-open]').forEach(el => el.addEventListener('click', ev => {
    if (ev.target.closest('button,input,select')) return;
    const p = byId.get(+el.dataset.open); if (p) openBuy(p);
  }));
  body.querySelectorAll('[data-unslot]').forEach(el => el.addEventListener('click', () => {
    const i = state.actions.findIndex(a => a.t === 'buy' && a.slot === el.dataset.unslot);
    if (i >= 0 && confirm(`Rimuovere ${state.actions[i].name} dalla rosa?`)) removeAction(i);
  }));
  body.querySelectorAll('[data-del]').forEach(el => el.addEventListener('click', () => {
    const i = +el.dataset.del;
    if (confirm(`Rimuovere "${state.actions[i]?.name}" dal log?`)) removeAction(i);
  }));
  body.querySelectorAll('[data-editprice]').forEach(el => el.addEventListener('change', () => {
    const a = state.actions[+el.dataset.editprice];
    const v = parseInt(el.value, 10);
    if (a && v >= 0) { a.price = v || null; save(); renderAll(); }
  }));
  body.querySelectorAll('[data-editbuyer]').forEach(el => el.addEventListener('change', () => {
    const a = state.actions[+el.dataset.editbuyer];
    if (a) { a.buyer = el.value; save(); }
  }));
  // listone controls
  const lq = body.querySelector('#lq');
  if (lq) {
    lq.addEventListener('input', () => { listoneFilter.q = lq.value; refreshListoneRows(body); });
    body.querySelector('#lteam').addEventListener('change', e => { listoneFilter.team = e.target.value; refreshListoneRows(body); });
    body.querySelector('#lsort').addEventListener('change', e => { listoneFilter.sort = e.target.value; refreshListoneRows(body); });
    body.querySelectorAll('.fchip[data-role]').forEach(ch => ch.addEventListener('click', () => {
      listoneFilter.role = listoneFilter.role === ch.dataset.role ? '' : ch.dataset.role;
      body.querySelectorAll('.fchip[data-role]').forEach(x => x.classList.toggle('on', x.dataset.role === listoneFilter.role));
      refreshListoneRows(body);
    }));
  }
}

      <b>${esc(a.name)}</b> <span style="color:var(--mut)">${esc(a.team)}${a.slot ? ' · ' + a.slot : ''}</span>
      <input class="pz" type="number" min="0" value="${a.price ?? ''}" placeholder="crediti" data-editprice="${i}" title="Crediti pagati">
      ${a.t === 'gone' ? `<input class="by" list="oppdl" value="${esc(a.buyer || '')}" placeholder="chi l'ha preso?" data-editbuyer="${i}">` : ''}
      <button class="xbtn" data-del="${i}" title="Elimina">✕</button>
    </div>`).join('') + `<datalist id="oppdl">${(state.oppNames || []).map(n => `<option value="${esc(n)}">`).join('')}</datalist>`;
}

function viewReport() {
  const d = derive();
  const fvmMine = d.mine.reduce((s,a) => s + (byId.get(a.pid)?.fvm || 0), 0);
  const scMine = d.mine.length ? Math.round(d.mine.reduce((s,a) => s + (byId.get(a.pid)?.score || 0), 0) / d.mine.length) : 0;
  const buysRows = d.mine.map(a => {
    const p = byId.get(a.pid);
    const w = (wishByPid.get(a.pid) || []).find(x => x.slot === a.slot) || (wishByPid.get(a.pid) || [])[0];
    const max = w?.maxprice ?? (sleepByPid.get(a.pid) || [])[0]?.price ?? null;
    const delta = max != null ? max - a.price : null;
    return `<tr><td class="slotid">${a.slot}</td><td><span class="rb ${a.role}">${a.role}</span> <b>${esc(a.name)}</b> <span style="color:var(--mut)">${esc(a.team)}</span></td>
      <td class="num">${a.price}</td><td class="num">${max ?? '—'}</td>
      <td>${delta == null ? '' : delta >= 0 ? `<span class="rep-deal">▼ ${delta} sotto il max</span>` : `<span class="rep-over">▲ ${-delta} oltre il max</span>`}</td>
      <td class="num">${p?.score ?? ''}</td></tr>`;
  }).join('');
  const missed = [];
  for (const role of ROLES) for (const grp of (DATA.wishlist[role] || [])) {
    for (const w of grp.players.filter(x => x.prio <= 3)) {
      const p = findPlayer(w.name, w.team);
      const g = p && d.gonePid.get(p.id);
      if (g) missed.push(`<div class="altrow"><span class="pr">${grp.slot} #${w.prio}</span><b>${esc(w.name)}</b><span class="tm">${esc(w.team)}</span>
        <span>${g.buyer ? `→ ${esc(g.buyer)}` : '→ altri'}${g.price ? ` per <b>${g.price}</b>` : ''}</span><span class="mx">tuo max ${w.maxprice}</span></div>`);
    }
  }
  return `
    <div class="repgrid">
      <div class="cap"><label>Speso</label><b>${d.spent}</b></div>
      <div class="cap"><label>Residuo</label><b>${d.left}</b></div>
      <div class="cap"><label>Vs piano</label><b>${(d.planDelta > 0 ? '+' : '') + d.planDelta}</b></div>
      <div class="cap"><label>FVM rosa</label><b>${fvmMine}</b></div>
      <div class="cap"><label>Score medio</label><b>${scMine || '—'}</b></div>
      <div class="cap"><label>Slot pieni</label><b>${d.mine.length}/25</b></div>
    </div>
    <div class="newsblock"><h2>Speso per reparto</h2>
      <table><thead><tr><th>Reparto</th><th class="num">Speso</th><th class="num">Budget</th><th class="num">Delta</th><th class="num">Slot</th></tr></thead><tbody>
      ${ROLES.map(r => { const dl = state.roleBudget[r] - d.spentRole[r];
        return `<tr><td><span class="rb ${r}">${r}</span> ${ROLENAME[r]}</td><td class="num">${d.spentRole[r]}</td><td class="num">${state.roleBudget[r]}</td>
        <td class="num" style="color:${dl >= 0 ? 'var(--ok)' : 'var(--warn)'}">${dl >= 0 ? '+' + dl : dl}</td><td class="num">${d.cntRole[r]}/${DATA.roleSlots[r]}</td></tr>`; }).join('')}
      </tbody></table></div>
    <div class="newsblock"><h2>Acquisti vs piano</h2>
      ${d.mine.length ? `<table><thead><tr><th>Slot</th><th>Giocatore</th><th class="num">Pagato</th><th class="num">Max piano</th><th>Esito</th><th class="num">Score</th></tr></thead><tbody>${buysRows}</tbody></table>`
        : '<p style="color:var(--faint)">Nessun acquisto ancora.</p>'}</div>
    <div class="newsblock"><h2>Occasioni sfumate (top-3 di lista andati ad altri)</h2>
      ${missed.length ? `<div class="bcalts">${missed.join('')}</div>` : '<p style="color:var(--faint)">Nessuna, per ora: i primi nomi delle tue liste sono ancora lì (o già tuoi).</p>'}</div>
    <div class="newsblock"><h2>Il tavolo</h2>
      <table><thead><tr><th>Squadra</th><th class="num">Speso</th><th class="num">Residuo</th><th class="num">Max offerta</th><th>Rosa</th></tr></thead><tbody>
      <tr><td><b>Tu</b></td><td class="num">${d.spent}</td><td class="num">${d.left}</td><td class="num">${d.maxBid}</td><td class="num" style="text-align:left">${ROLES.map(r => `${d.cntRole[r]}${r}`).join(' ')}</td></tr>
      ${d.opps.map(o => `<tr><td>${esc(o.name)}</td><td class="num">${o.spent}</td><td class="num">${o.left}</td><td class="num">${o.maxBid}</td>
        <td class="num" style="text-align:left">${ROLES.map(r => `${o.cnt[r]}${r}`).join(' ')}</td></tr>`).join('')}
      </tbody></table>
      <p style="color:var(--faint);font-size:12px;margin-top:6px">I dati degli avversari valgono quanto i prezzi/compratori registrati con Shift+Invio.</p></div>`;
}

function viewNews() {
  const alerts = DATA.alerts || [];
  const rig = DATA.rigoristi || {};
  const sleepers = DATA.sleepers || {};
  const teams = Object.keys(rig).sort();
  return `
    ${alerts.length ? `<div class="newsblock"><h2>⚠ Alert pre-asta ${DATA.researchDate ? `<span style="text-transform:none;letter-spacing:0">(ricerca del ${esc(DATA.researchDate)})</span>` : ''}</h2>
      ${alerts.map(a => `<div class="alert-item"><span class="at ${esc(a.type)}">${esc(a.type)}</span><span><b>${esc(a.name)}</b> (${esc(a.team)}) — ${esc(a.text)}</span></div>`).join('')}</div>` : '<p style="color:var(--faint)">Nessun alert caricato (research.json non ancora generato).</p>'}
    ${teams.length ? `<div class="newsblock"><h2>🎯 Rigoristi e piazzati</h2>
      <table><thead><tr><th>Squadra</th><th>Rigori</th><th>Punizioni</th><th>Corner</th></tr></thead><tbody>
      ${teams.map(t => `<tr><td><b>${esc(t)}</b></td><td>${esc(rig[t].rigori || '')}</td><td>${esc(rig[t].punizioni || '')}</td><td>${esc(rig[t].corner || '')}</td></tr>`).join('')}
      </tbody></table></div>` : ''}
    ${Object.keys(sleepers).length ? `<div class="newsblock"><h2>◆ Occasioni dal web (sleeper)</h2>
      ${ROLES.filter(r => sleepers[r]?.length).map(r => `
        <h3 style="font-family:var(--cond);margin:10px 0 4px"><span class="rb ${r}">${r}</span> ${ROLENAME[r]}</h3>
        <ul class="wl-list">${sleepers[r].map(s => {
          const p = findPlayer(s.name, s.team);
          return `<li ${p ? `data-open="${p.id}"` : ''}><span class="nm">${esc(s.name)}</span><span class="tm">${esc(s.team)}</span>
            <span class="ti">${esc(s.why || '')}</span><span class="mx">~${esc(s.price ?? '?')}</span></li>`;
        }).join('')}</ul>`).join('')}</div>` : ''}
    ${(DATA.sources || []).length ? `<div class="newsblock"><h2>Fonti consultate</h2><p class="srcs">${DATA.sources.map(esc).join('<br>')}</p></div>` : ''}`;
}

/* ============================== global keys & wiring ============================== */
const qEl = $('#q');
qEl.addEventListener('input', () => doSearch(qEl.value));
qEl.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { e.preventDefault(); if (curResults.length) { selIdx = (selIdx + 1) % curResults.length; renderResults(); } }
  else if (e.key === 'ArrowUp') { e.preventDefault(); if (curResults.length) { selIdx = (selIdx - 1 + curResults.length) % curResults.length; renderResults(); } }
  else if (e.key === 'Enter') {
    e.preventDefault();
    const p = curResults[selIdx];
    if (!p) return;
    if (e.shiftKey) { qEl.value = ''; curResults = []; openGone(p); }
    else openBuy(p);
  }
  else if (e.key === 'Escape') { qEl.value = ''; curResults = []; $('#results').classList.remove('open'); }
});
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
  if (e.key === 'Escape' && goneTarget) { const t = goneTarget; goneTarget = null; doGone(t); closeBuy(); return; }
  if (e.key === 'Escape' && buyTarget) { closeBuy(); return; }
  // any printable char refocuses search (when not already in an input)
  if (!e.ctrlKey && !e.metaKey && !e.altKey && e.key.length === 1 && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName || '')) {
    qEl.focus();
  }
});
document.addEventListener('click', e => {
  if (!e.target.closest('.searchbox')) $('#results').classList.remove('open');
});

$('#btnUndo').addEventListener('click', undo);
$('#btnMirror').addEventListener('click', () => {
  window.open(location.pathname + '?view=liste', 'fantaasta_mirror', 'width=1100,height=900');
  toast('⧉ Liste aperte in una finestra separata: trascinala sul secondo schermo');
});
$('#btnSim').addEventListener('click', () => toggleSim());
$('#simExitBtn').addEventListener('click', () => toggleSim(false));
$('#simNextBtn').addEventListener('click', () => simNext());
$('#simAutoBtn').addEventListener('click', () => { for (let i = 0; i < 10; i++) if (!simStep(false)) break; });
$('#simResetBtn').addEventListener('click', () => {
  if (confirm('Azzerare la simulazione?')) { state = defaultState(); save(); renderAll(); toast('Simulazione azzerata'); }
});
$('#btnReset').addEventListener('click', () => {
  if (confirm('Azzerare TUTTA l\'asta? (acquisti, giocatori andati, budget)') && confirm('Sicuro sicuro? Non si torna indietro (hai fatto un export?)')) {
    state = defaultState(); save(); renderAll(); toast('Asta azzerata');
  }
});
$('#btnExp').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(state, null, 1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `fantaasta-backup-${new Date().toISOString().slice(0,16).replace(/[:T]/g,'-')}.json`;
  a.click();
  toast('Backup scaricato ⬇');
});
function buildCsv() {
  const d = derive();
  const rows = [['slot','ruolo','nome','squadra','prezzo']];
  for (const r of ROLES) for (const s of DATA.slots.filter(x => x.role === r)) {
    const a = d.slotFill.get(s.id);
    rows.push([s.id, r, a?.name || '', a?.team || '', a ? a.price : '']);
  }
  return rows.map(row => row.map(v => /[";\n]/.test(String(v)) ? `"${String(v).replace(/"/g,'""')}"` : String(v)).join(';')).join('\r\n');
}
$('#btnCsv').addEventListener('click', () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + buildCsv()], {type:'text/csv;charset=utf-8'}));
  a.download = `fantaasta-rosa-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  toast('Rosa CSV scaricata ⬇');
});
$('#btnImp').addEventListener('click', () => $('#impFile').click());
$('#impFile').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(txt => {
    const st = JSON.parse(txt);
    if (!Array.isArray(st.actions)) throw new Error('bad');
    state = {...defaultState(), ...st}; save(); renderAll();
    toast('Backup ripristinato ⬆');
  }).catch(() => toast('File non valido', 'err'));
  e.target.value = '';
});
$('#btnSet').addEventListener('click', () => {
  $('#setBudget').value = state.budget;
  ROLES.forEach(r => $('#set' + r).value = state.roleBudget[r]);
  $('#setOpps').value = (state.oppNames || []).join('\n');
  $('#dlgSet').showModal();
});
$('#setCancel').addEventListener('click', () => $('#dlgSet').close());
$('#setSave').addEventListener('click', () => {
  const b = parseInt($('#setBudget').value, 10);
  if (b > 0) state.budget = b;
  ROLES.forEach(r => { const v = parseInt($('#set' + r).value, 10); if (v >= 0) state.roleBudget[r] = v; });
  state.oppNames = $('#setOpps').value.split('\n').map(s => s.trim()).filter(Boolean).slice(0, 15);
  save(); renderAll(); $('#dlgSet').close(); toast('Impostazioni salvate');
});

/* ============================== boot ============================== */
function renderAll() {
  document.body.classList.toggle('sim', simMode);
  $('#simbar').hidden = !simMode;
  renderHeader(); renderOpps(); renderAdvice(); renderTab();
}
window.DATA = DATA;
Object.defineProperty(window, 'state', {get: () => state, configurable: true});

/* mirror mode (?view=<tab>): sola lettura per il secondo schermo, sync automatico */
const VIEW = new URLSearchParams(location.search).get('view');
if (VIEW) {
  document.body.classList.add('mini');
  curTab = ['rosa','liste','listone','log','report','news'].includes(VIEW) ? VIEW : 'liste';
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === curTab));
  document.querySelector('.brand').insertAdjacentHTML('beforeend', '<span class="minitag">specchio · sola lettura</span>');
  const resync = () => { state = loadState(); renderAll(); };
  window.addEventListener('storage', e => { if (!e.key || e.key === lsKey()) resync(); });
  let lastRaw = null;
  setInterval(() => {                        // fallback per file:// dove gli storage event non arrivano
    let raw = null;
    try { raw = localStorage.getItem(lsKey()); } catch (e) {}
    if (raw !== lastRaw) { lastRaw = raw; resync(); }
  }, 2500);
}
$('#footNote').textContent = `Listone ufficiale ${DATA.season}: ${DATA.players.length} giocatori · Rosa 3P+8D+8C+6A · I dati restano solo in questo browser (localStorage + cookie di backup). Fai un export ⬇ a fine asta.`;
renderAll();
qEl.focus();
</script>
