<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FantaAsta 2026-27 · Sala d'asta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=Spline+Sans+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c1210; --panel:#131c18; --panel2:#0f1613; --raise:#182420;
  --line:#233129; --line2:#2e4136;
  --ink:#eaf1ec; --mut:#8fa39a; --faint:#5d6f66;
  --volt:#c6f14d; --volt-ink:#16200a; --gold:#ecc65c;
  --warn:#f5a524; --bad:#ff5d5d; --ok:#43cf8e;
  --rP:#f2a33c; --rD:#43cf8e; --rC:#5aabff; --rA:#ff6363;
  --radius:10px;
  --num:'Spline Sans Mono',ui-monospace,'SF Mono',monospace;
  --cond:'Barlow Condensed','Arial Narrow',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scrollbar-color:#2e4136 #0c1210}
body{
  background:
    radial-gradient(1200px 500px at 50% -180px, rgba(198,241,77,.07), transparent 60%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.011) 0 90px, transparent 90px 180px),
    var(--bg);
  color:var(--ink);
  font:15px/1.45 Barlow,system-ui,sans-serif;
  min-height:100vh;
}
b,strong{font-weight:600}
button{font:inherit;cursor:pointer;border:1px solid var(--line2);background:var(--raise);color:var(--ink);border-radius:8px;padding:6px 12px;transition:.15s}
button:hover{border-color:var(--volt);color:var(--volt)}
button.primary{background:var(--volt);border-color:var(--volt);color:var(--volt-ink);font-weight:700}
button.primary:hover{filter:brightness(1.1);color:var(--volt-ink)}
button.ghost{background:transparent}
button.danger:hover{border-color:var(--bad);color:var(--bad)}
input,select{font:inherit;background:var(--panel2);border:1px solid var(--line2);color:var(--ink);border-radius:8px;padding:7px 10px;outline:none}
input:focus,select:focus{border-color:var(--volt)}
::placeholder{color:var(--faint)}
h2{font-family:var(--cond);text-transform:uppercase;letter-spacing:.08em;font-size:15px;font-weight:600;color:var(--mut)}

/* ---------- header scoreboard ---------- */
header{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(180deg,#0e1512 0%,rgba(14,21,18,.94) 100%);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(8px);
  padding:10px 22px;
  display:flex;align-items:center;gap:26px;flex-wrap:wrap;
}
.brand{font-family:var(--cond);font-weight:700;font-size:26px;letter-spacing:.04em;text-transform:uppercase}
.brand em{font-style:normal;color:var(--volt)}
.brand small{display:block;font-size:11px;letter-spacing:.28em;color:var(--mut);font-weight:500}
.score{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.stat{min-width:64px}
.stat label{display:block;font-family:var(--cond);text-transform:uppercase;letter-spacing:.14em;font-size:10.5px;color:var(--mut)}
.stat b{font-family:var(--num);font-size:22px;font-weight:700;letter-spacing:-.02em}
.stat.hero b{font-size:34px;color:var(--gold);text-shadow:0 0 24px rgba(236,198,92,.35)}
.stat b.flash{animation:flash .6s}
@keyframes flash{0%{color:var(--volt)}100%{}}
.meters{display:grid;grid-template-columns:repeat(4,minmax(90px,120px));gap:6px 14px;margin-left:8px}
.meter{font-size:11px}
.meter .mrow{display:flex;justify-content:space-between;color:var(--mut);font-family:var(--num);font-size:10.5px}
.meter .mrow b:first-child{color:var(--ink)}
.meter .bar{height:5px;border-radius:3px;background:var(--line);margin-top:3px;overflow:hidden}
.meter .bar i{display:block;height:100%;border-radius:3px;transition:width .3s}
.meter.over .bar i{background:var(--warn)!important}
.meter.over .mrow{color:var(--warn)}
.hactions{margin-left:auto;display:flex;gap:8px;align-items:center}
.hactions button{padding:5px 10px;font-size:13px}

/* ---------- layout ---------- */
main{max-width:1560px;margin:18px auto;padding:0 22px;display:grid;grid-template-columns:minmax(400px,4.4fr) 7fr;gap:20px;align-items:start}
@media(max-width:1080px){main{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}

/* ---------- search ---------- */
.searchbox{position:relative}
#q{
  width:100%;padding:15px 18px;font-size:19px;border-radius:12px;
  background:var(--panel);border:1px solid var(--line2);
  box-shadow:0 8px 30px rgba(0,0,0,.35);
}
#q:focus{border-color:var(--volt);box-shadow:0 0 0 3px rgba(198,241,77,.14),0 8px 30px rgba(0,0,0,.35)}
.hint{margin:7px 4px 0;font-size:12px;color:var(--faint)}
.hint kbd{background:var(--raise);border:1px solid var(--line2);border-radius:4px;padding:0 5px;font-family:var(--num);font-size:11px;color:var(--mut)}
#results{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:40;background:var(--panel);border:1px solid var(--line2);border-radius:12px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.55);display:none}
#results.open{display:block}
.res{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.res:last-child{border-bottom:0}
.res.sel{background:rgba(198,241,77,.09)}
.res .nm{font-weight:600;font-size:15.5px;white-space:nowrap}
.res .tm{color:var(--mut);font-size:13px}
.res .fig{margin-left:auto;font-family:var(--num);font-size:12px;color:var(--mut);white-space:nowrap}
.res.dead .nm,.res.dead .tm{text-decoration:line-through;color:var(--faint)}
.res .why{font-size:11.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.rb{font-family:var(--cond);font-weight:700;font-size:12px;width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;flex:none;color:#10150d}
.rb.P{background:var(--rP)}.rb.D{background:var(--rD)}.rb.C{background:var(--rC)}.rb.A{background:var(--rA)}
.wish{font-family:var(--num);font-size:11px;background:rgba(198,241,77,.13);color:var(--volt);border:1px solid rgba(198,241,77,.3);border-radius:5px;padding:1px 6px;white-space:nowrap}
.sleep{font-family:var(--num);font-size:11px;background:rgba(90,171,255,.12);color:var(--rC);border:1px solid rgba(90,171,255,.3);border-radius:5px;padding:1px 6px;white-space:nowrap}
.tag{font-family:var(--cond);text-transform:uppercase;font-size:10.5px;letter-spacing:.08em;border-radius:5px;padding:1px 7px}
.tag.mine{background:rgba(67,207,142,.15);color:var(--ok);border:1px solid rgba(67,207,142,.4)}
.tag.gone{background:rgba(255,93,93,.12);color:var(--bad);border:1px solid rgba(255,93,93,.35)}
.adot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none;box-shadow:0 0 8px var(--warn)}

/* ---------- buy card ---------- */
#buycard{margin-top:14px;padding:16px 18px;border-color:var(--line2);box-shadow:0 14px 40px rgba(0,0,0,.4);animation:pop .18s}
@keyframes pop{from{transform:translateY(-6px);opacity:0}}
#buycard .bctop{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
#buycard .bcname{font-family:var(--cond);font-size:30px;font-weight:700;letter-spacing:.01em}
#buycard .bcteam{color:var(--mut)}
#buycard .figs{margin-left:auto;font-family:var(--num);font-size:13px;color:var(--mut)}
.bcwish{margin:10px 0 4px;display:flex;flex-direction:column;gap:5px}
.bcwish .wrow{font-size:13.5px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.bcwish .wrow .pos{font-family:var(--num);color:var(--volt);font-size:12.5px;white-space:nowrap}
.bcwish .wrow .nt{color:var(--mut);font-size:12.5px}
.bcalert{margin-top:8px;font-size:13px;color:var(--warn);display:flex;gap:8px;align-items:baseline}
.bcrig{margin-top:8px;font-size:12.5px;color:var(--mut)}
.caps{display:flex;gap:10px;margin:12px 0;flex-wrap:wrap}
.cap{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 12px;min-width:96px}
.cap label{display:block;font-family:var(--cond);text-transform:uppercase;font-size:10px;letter-spacing:.12em;color:var(--faint)}
.cap b{font-family:var(--num);font-size:19px}
.cap.main b{color:var(--volt)}
.bcalts{margin:2px 0 10px}
.bcalts .altshead{font-family:var(--cond);text-transform:uppercase;letter-spacing:.1em;font-size:11px;color:var(--faint);margin-bottom:3px}
.bcalts .altrow{display:flex;gap:8px;align-items:baseline;font-size:13px;padding:2px 0}
.bcalts .pr{font-family:var(--num);color:var(--faint);font-size:11px}
.bcalts .tm{color:var(--mut);font-size:12.5px}
.bcalts .mx{font-family:var(--num);color:var(--gold);font-size:12px}
.buyrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
#price{width:130px;font-family:var(--num);font-size:24px;font-weight:700;padding:8px 12px;text-align:center}
#slotSel{max-width:230px}
.buyerr{color:var(--bad);font-size:13px;margin-top:8px;min-height:18px}

/* ---------- advice ---------- */
.advice{margin-top:16px;padding:14px 16px}
.advice h2{margin-bottom:10px}
.adv-role{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:13.5px}
.chip:hover{border-color:var(--volt)}
.chip .px{font-family:var(--num);color:var(--gold);font-size:12px}
.chip .sl{font-family:var(--num);color:var(--faint);font-size:11px}
.chip .sc{font-family:var(--num);font-size:10.5px;color:var(--warn)}
.chip.scarce{border-color:rgba(245,165,36,.55)}
.chip.last{border-color:rgba(255,93,93,.6)}
.chip.last .sc{color:var(--bad)}
.scbadge{font-family:var(--num);font-size:10.5px;color:var(--warn);border:1px solid rgba(245,165,36,.4);border-radius:4px;padding:0 5px;margin-left:6px;white-space:nowrap}
.scbadge.last{color:var(--bad);border-color:rgba(255,93,93,.45)}
.adjup{color:var(--ok);font-weight:600}
.adjdown{color:var(--warn);font-weight:600}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:4px;padding:8px 10px;border-bottom:1px solid var(--line);position:sticky;top:74px;background:var(--panel);z-index:30;border-radius:var(--radius) var(--radius) 0 0;flex-wrap:wrap}
.tabs button{border:0;background:transparent;color:var(--mut);font-family:var(--cond);text-transform:uppercase;letter-spacing:.08em;font-size:14.5px;font-weight:600;padding:7px 14px;border-radius:7px}
.tabs button.on{background:var(--raise);color:var(--volt)}
.tabs .cnt{font-family:var(--num);font-size:11px;opacity:.8}
.tabbody{padding:14px 16px;min-height:300px}

/* rosa */
.rgroup{margin-bottom:18px}
.rghead{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.rghead h3{font-family:var(--cond);text-transform:uppercase;letter-spacing:.1em;font-size:16px}
.rghead .rgfig{font-family:var(--num);font-size:12px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-family:var(--cond);text-transform:uppercase;letter-spacing:.09em;font-size:11px;color:var(--faint);text-align:left;padding:4px 8px;border-bottom:1px solid var(--line)}
td{padding:6px 8px;border-bottom:1px solid var(--line)}
tr:hover td{background:rgba(255,255,255,.02)}
td.num,th.num{text-align:right;font-family:var(--num);font-size:13px}
.slotid{font-family:var(--num);color:var(--faint);font-size:12px}
.owned{color:var(--ok);font-weight:600}
.emptyslot{color:var(--faint)}
.nexthint{color:var(--mut);font-size:12.5px}
.nexthint b{color:var(--ink);font-weight:500}
.xbtn{border:0;background:none;color:var(--faint);padding:2px 6px;font-size:14px}
.xbtn:hover{color:var(--bad)}

/* liste */
.wl-slot{margin-bottom:16px}
.wl-slot>header{position:static;display:flex;gap:10px;align-items:baseline;background:none;border:0;padding:4px 0;backdrop-filter:none}
.wl-slot h3{font-family:var(--cond);font-size:16px;text-transform:uppercase;letter-spacing:.06em}
.wl-slot .wsb{font-family:var(--num);color:var(--gold);font-size:12px}
.wl-list{list-style:none}
.wl-list li{display:flex;gap:9px;align-items:baseline;padding:5px 6px;border-bottom:1px dashed var(--line);cursor:pointer;flex-wrap:wrap}
.wl-list li:hover{background:rgba(255,255,255,.025)}
.wl-list .pr{font-family:var(--num);color:var(--faint);font-size:12px;width:18px;flex:none}
.wl-list .nm{font-weight:600}
.wl-list .tm,.wl-list .ti{color:var(--mut);font-size:12.5px}
.wl-list .mx{margin-left:auto;font-family:var(--num);color:var(--gold);font-size:12.5px;white-space:nowrap}
.wl-list li.dead .nm,.wl-list li.dead .tm{text-decoration:line-through;color:var(--faint)}
.wl-list li.mine .nm{color:var(--ok)}
.wl-list .note{flex-basis:100%;font-size:12px;color:var(--faint);padding-left:27px}
.rig-yes{color:var(--gold);font-size:12px}
.filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.fchip{border-radius:20px;padding:4px 14px;font-family:var(--cond);text-transform:uppercase;letter-spacing:.06em;font-size:13px}
.fchip.on{background:var(--volt);color:var(--volt-ink);border-color:var(--volt);font-weight:700}

/* log */
.logrow{display:flex;gap:10px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line);font-size:14px;flex-wrap:wrap}
.logrow .lt{font-family:var(--num);color:var(--faint);font-size:11px;width:44px}
.logrow input{padding:3px 8px;font-family:var(--num);font-size:13px}
.logrow input.pz{width:70px}
.logrow input.by{width:130px}

/* news */
.newsblock{margin-bottom:20px}
.alert-item{display:flex;gap:9px;padding:7px 4px;border-bottom:1px dashed var(--line);font-size:13.5px;align-items:baseline}
.alert-item .at{font-family:var(--cond);text-transform:uppercase;font-size:10.5px;letter-spacing:.08em;border-radius:4px;padding:1px 7px;flex:none}
.at.infortunio{background:rgba(255,93,93,.14);color:var(--bad)}
.at.mercato{background:rgba(90,171,255,.14);color:var(--rC)}
.at.ballottaggio{background:rgba(245,165,36,.14);color:var(--warn)}
.at.ok{background:rgba(67,207,142,.14);color:var(--ok)}
.at.squalifica{background:rgba(255,93,93,.14);color:var(--bad)}
.srcs{font-size:12px;color:var(--faint);line-height:1.8}

/* toast */
#toasts{position:fixed;left:20px;bottom:20px;z-index:100;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--raise);border:1px solid var(--line2);border-left:3px solid var(--volt);border-radius:8px;padding:10px 16px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:pop .2s}
.toast.err{border-left-color:var(--bad)}
.toast.warn{border-left-color:var(--warn)}

/* dialog */
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line2);border-radius:12px;padding:20px 22px;min-width:320px}
dialog::backdrop{background:rgba(5,8,7,.7)}
dialog h2{margin-bottom:14px;color:var(--ink)}
.setrow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.setrow label{width:150px;color:var(--mut);font-size:14px}
.setrow input{width:90px;font-family:var(--num)}
.dlgbtns{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.footer-note{max-width:1560px;margin:8px auto 30px;padding:0 22px;color:var(--faint);font-size:12px}
</style>
</head>
<body>

<header>
  <div class="brand">Fanta<em>·</em>Asta <small>Serie A 2026–27 · Classic</small></div>
  <div class="score">
    <div class="stat hero"><label>Crediti rimasti</label><b id="stCred">–</b></div>
    <div class="stat"><label>Speso</label><b id="stSpent">–</b></div>
    <div class="stat"><label>Slot liberi</label><b id="stSlots">–</b></div>
    <div class="stat"><label>Media / slot</label><b id="stAvg">–</b></div>
    <div class="stat"><label>Max singolo</label><b id="stCap">–</b></div>
    <div class="stat" title="Residuo reale meno somma dei budget pianificati degli slot vuoti"><label>Vs piano</label><b id="stPlan">–</b></div>
    <div class="meters" id="meters"></div>
  </div>
  <div class="hactions">
    <button id="btnUndo" title="Annulla ultima operazione (Ctrl+Z)">↩ Undo</button>
    <button id="btnSet" title="Budget e impostazioni">⚙</button>
    <button id="btnExp" title="Scarica backup JSON">⬇</button>
    <button id="btnImp" title="Ripristina da backup">⬆</button>
    <button id="btnCsv" title="Scarica la rosa in CSV (Excel)">CSV</button>
    <button id="btnReset" class="danger" title="Azzera l'asta">✕</button>
    <input type="file" id="impFile" accept=".json" hidden>
  </div>
</header>

<main>
  <section>
    <div class="searchbox">
      <input id="q" placeholder="Digita un nome o una squadra…" autocomplete="off" spellcheck="false" autofocus>
      <div id="results"></div>
    </div>
    <div class="hint"><kbd>↑↓</kbd> scegli · <kbd>Invio</kbd> l'ho comprato · <kbd>Shift+Invio</kbd> preso da altri · <kbd>Esc</kbd> pulisci · <kbd>Ctrl+Z</kbd> undo</div>

    <div id="buycard" class="panel" hidden></div>

    <div class="advice panel">
      <h2>Prossimi obiettivi <span style="font-weight:400;text-transform:none;letter-spacing:0">(primo nome libero per ogni slot vuoto)</span></h2>
      <div id="advice"></div>
    </div>
  </section>

  <section class="panel">
    <nav class="tabs" id="tabs">
      <button data-tab="rosa" class="on">Rosa <span class="cnt" id="cntRosa"></span></button>
      <button data-tab="liste">Liste</button>
      <button data-tab="listone">Listone</button>
      <button data-tab="log">Log <span class="cnt" id="cntLog"></span></button>
      <button data-tab="news">News &amp; Rigoristi</button>
    </nav>
    <div class="tabbody" id="tabbody"></div>
  </section>
</main>

<p class="footer-note" id="footNote"></p>

<div id="toasts"></div>

<dialog id="dlgSet">
  <h2>Impostazioni budget</h2>
  <div class="setrow"><label>Budget totale</label><input type="number" id="setBudget" min="1"></div>
  <div class="setrow"><label>Budget Portieri</label><input type="number" id="setP" min="0"></div>
  <div class="setrow"><label>Budget Difensori</label><input type="number" id="setD" min="0"></div>
  <div class="setrow"><label>Budget Centrocampisti</label><input type="number" id="setC" min="0"></div>
  <div class="setrow"><label>Budget Attaccanti</label><input type="number" id="setA" min="0"></div>
  <div class="dlgbtns"><button id="setCancel">Annulla</button><button id="setSave" class="primary">Salva</button></div>
</dialog>

nizioni":"Yildiz, Locatelli, Koopmeiners","corner":"Yildiz, Cambiaso, Locatelli"},"Lazio":{"rigori":"Zaccagni capitano e favorito, ma Taylor K. (14/16) ha numeri migliori; Cataldi (5/5) assicurazione a costo zero","punizioni":"Zaccagni, Cataldi, Taylor K., Rovella","corner":"Zaccagni, Taylor K., Rovella"},"Lecce":{"rigori":"SORPASSO: Geubbels (7/7, la % più pulita della A) su Stulic — non giocano insieme, tira chi è in campo","punizioni":"Gallo, Pierotti, Berisha M.","corner":"Gallo, Pierotti, Berisha M."},"Milan":{"rigori":"Nkunku (17/20; rigore segnato all'84' di Inter-Milan in amichevole) > Ramos G. (11/13) > Pulisic (13/15, infortunato)","punizioni":"Modric, Pulisic, Nkunku, Ricci","corner":"Modric, Pulisic, Bartesaghi, Jashari"},"Monza":{"rigori":"Pessina (16/17, capitano), poi Cutrone, Petagna","punizioni":"Colpani, Pessina, Ciurria","corner":"Pessina, Colpani, Ciurria"},"Napoli":{"rigori":"RISOLTA: De Bruyne (15/17) — Lukaku ufficiale al Fenerbahçe. Hojlund 2° ma 'non un cecchino' dal dischetto","punizioni":"De Bruyne, Politano, Lobotka","corner":"De Bruyne, Politano"},"Parma":{"rigori":"Pellegrino M. (7/9) MA accordo totale con la Fiorentina; dopo di lui Tourè E. (3/3), Bernabè","punizioni":"Bernabè, Nicolussi Caviglia, Valeri","corner":"Bernabè, Nicolussi Caviglia, Valeri"},"Roma":{"rigori":"SORPASSO CONFERMATO: Malen (10/13, 4/5 in giallorosso) davanti a Dybala (43/49) anche con entrambi in campo","punizioni":"Dybala, Soulè, Pellegrini Lo.","corner":"Dybala, Soulè, Wesley"},"Sassuolo":{"rigori":"Berardi (57/66), indiscusso; poi Pinamonti (in uscita, Lazio in pole)","punizioni":"Berardi, Laurientè, Volpato","corner":"Berardi, Laurientè, Volpato"},"Torino":{"rigori":"Vlasic (5/5), poi Kulenovic (15/18), Zapata D.","punizioni":"Vlasic, Oristanio, Ilic","corner":"Vlasic, Oristanio, Ilic"},"Udinese":{"rigori":"Davis K. (4/4), zero concorrenza reale (Ekkelenkamp mai un rigore in carriera)","punizioni":"Zaniolo, Vojvoda, Ekkelenkamp, Miller L.","corner":"Vojvoda, Ekkelenkamp, Miller L., Zaniolo"},"Venezia":{"rigori":"APERTO: Adams A. (3/3 al Siviglia) / Rrahmani Al. (14/18) — alternanza probabile, tira chi è in campo. Adorante scavalcato","punizioni":"Busio, Perez K., Basic, Helgason","corner":"Busio, Perez K., Basic, Helgason"}},"alerts":[{"name":"Buongiorno","team":"Napoli","type":"infortunio","text":"Menisco operato a luglio, stime discordanti (da ottobre a dicembre): prudenzialmente non prima di novembre. Solo parcheggio a 1-2."},{"name":"Neres","team":"Napoli","type":"infortunio","text":"Recupero lento (caviglia operata + infiltrazioni al ginocchio): non in campo nell'ultimo test, 1ª in forte dubbio. Trappola d'asta."},{"name":"Beukema","team":"Napoli","type":"infortunio","text":"Tendinopatia achillea recidiva: salta la 1ª, obiettivo 2ª col Como. Con Buongiorno e Marianucci out sarà titolare al rientro: prendilo a poco, non zero."},{"name":"Marianucci","team":"Napoli","type":"infortunio","text":"Lesione alto grado collaterale ginocchio (8/8): stop ≥2 mesi. Lasciarlo."},{"name":"Marin R.","team":"Napoli","type":"ok","text":"Titolare per forza di cose nell'ultimo test (6-2 all'Aris): con Buongiorno, Beukema e Marianucci out è il difensore Napoli da prendere a 2 per le prime giornate."},{"name":"Pulisic","team":"Milan","type":"infortunio","text":"Microfrattura tibia+perone dal Mondiale: obiettivo 1ª col Torino 'difficile ma non impossibile', rientro realistico tra 1ª e 2ª. Terzo nelle gerarchie rigori."},{"name":"Sulemana K.","team":"Atalanta","type":"infortunio","text":"Lesione 2° grado collaterale ginocchio (8/8 col Schalke): stop ≥2 mesi, rientro stimato ~6ª."},{"name":"Hien","team":"Atalanta","type":"infortunio","text":"Post-operatorio tendine: rientro tra metà settembre (TMW) e ottobre (fantacalcio.it). Solo parcheggio a 1-2."},{"name":"Parisi","team":"Fiorentina","type":"infortunio","text":"Crociato: rientro ~10ª/novembre."},{"name":"Addai","team":"Como","type":"infortunio","text":"Rottura tendine d'Achille, rientro ruyne eredita i rigori, Hojlund sale di fascia."},{"name":"Esposito Se.","team":"Cagliari","type":"mercato","text":"ROTTURA TOTALE: ha lasciato il ritiro senza autorizzazione, sarà ceduto (Atalanta in pole). NON comprarlo a Qt 13; i rigori passano a Maldini."},{"name":"Maldini","team":"Cagliari","type":"ok","text":"Per Sky (10/8) e FantaMaster (12/8) è GIÀ il 1° rigorista del Cagliari, più punizioni dal limite: a Qt 5 è il rigorista più economico della Serie A."},{"name":"Frattesi","team":"Inter","type":"mercato","text":"Verso la LAZIO (accordo di massima 12/8, prestito 1M + obbligo 14M): da spezzoni nell'Inter a mezzala titolare di Gattuso. A Qt 7 diventa un affare se chiude."},{"name":"Di Gregorio","team":"Juventus","type":"mercato","text":"RIBALTONE 12/8: Vicario sfumato, la Juve chiude per SUZUKI dal PSG (prestito secco). Di Gregorio in uscita, Premier in pole. Non pagarlo da titolare."},{"name":"Suzuki","team":"Parma","type":"mercato","text":"Ceduto al PSG (35M) che lo gira SUBITO in prestito alla Juve: se ufficializzato è il titolare bianconero a Qt 7. Occasione, ma solo a ufficialità arrivata; altrimenti ponte Perin."},{"name":"Corvi","team":"Parma","type":"ok","text":"Suzuki ceduto al PSG: Corvi titolare designato (6 clean sheet da subentrato, Cuesta lo conosce). Daffara ko muscolare dal 25/7: precampionato saltato, parte dietro."},{"name":"Milinkovic-Savic V.","team":"Napoli","type":"mercato","text":"Scavalcato da Meret (Allegri vuole un portiere che pari). Pista Juve spenta (arriva Suzuki), restano sirene arabe; il Napoli lo cede solo a titolo definitivo. Max 1 da terzo."},{"name":"Gimenez","team":"Milan","type":"mercato","text":"Doppio motivo per lasciarlo: distorsione alla caviglia (out fino a fine agosto) e cessione al Porto sbloccata dall'incasso Mora. Se parte, Ramos G. inamovibile."},{"name":"Morata","team":"Como","type":"mercato","text":"Chiuso da Douvikas, 1 gol in 30 gare, sondaggi MLS/Golfo: lasciarlo."},{"name":"Pinamonti","team":"Sassuolo","type":"mercato","text":"Lazio in pole (prestito 3 + riscatto 12, nodo rinnovo), Fiorentina raffreddata dopo Pellegrino: alto rischio addio entro l'1/9. Sostituto Bowie."},{"name":"Pellegrino M.","team":"Parma","type":"mercato","text":"ACCORDO TOTALE con la Fiorentina (12/8, ~5M prestito + 25 obbligo), visite in corso: alla Viola sarà ballottaggio con Kean. Non pagarlo da rigorista del Parma."},{"name":"Kean","team":"Fiorentina","type":"ok","text":"PUNTA UNICA confermata al 100%: Grosso ha ridisegnato il modulo (4-3-2-1) attorno a lui. Pellegrino in arrivo è concorrenza, ma il posto è suo. Sui rigori resta dietro Gudmundsson."},{"name":"Piccoli","team":"Fiorentina","type":"mercato","text":"DOPPIA TRAPPOLA: listato Fiorentina ma va al BOLOGNA (visite 12/8, obbligo 18M) dove parte DIETRO Dovbyk. Non pagarlo da titolare."},{"name":"Dovbyk","team":"Bologna","type":"ok","text":"Titolare designato di Tedesco (lavora con lui da 2 settimane, Piccoli arriva dopo e parte dietro); 27/32 dal dischetto in carriera, insidia n.1 a Orsolini."},{"name":"David","team":"Juventus","type":"mercato","text":"Fuori dai piani di Spalletti ma RIFIUTA di partire (Crystal Palace/Villa): rischio concreto 'resta ma non gioca'. Lasciarlo."},{"name":"Koopmeiners","team":"Juventus","type":"mercato","text":"TRAPPOLA DEFINITIVA: col Palermo (11/8) Spalletti lo ha schierato CENTRALE DI DIFESA. Anche se resta e gioca, il potenziale bonus crolla. E resta in uscita (Bologna/Milan)."},{"name":"Solet","team":"Udinese","type":"ok","text":"Cessione sfumata (Inter defilata, il club smentisce i problemi al ginocchio), si va verso il rinnovo: tornato acquistabile con serenità."},{"name":"Dodò","team":"Fiorentina","type":"mercato","text":"Scenario peggiorato: zero offerte concrete MA Joao Mario gli ha preso la fascia. Rischio 'resta e non gioca'. Solo a saldo estremo."},{"name":"Leao","team":"Milan","type":"mercato","text":"Il Galatasaray prepara un rilancio e il Milan deve tagliare la rosa da 33 a 25 entro l'1/9: rischio cessione non nullo. Scontare, non evitare."},{"name":"Pavard","team":"Inter","type":"mercato","text":"Rientrato dal Marsiglia che non l'ha riscattato, in uscita: lasciarlo."},{"name":"Stones","team":"Inter","type":"ballottaggio","text":"Fonti in conflitto: gestione fisica programmata per alcuni, centrale designato del terzetto per il CdS ('difesa camaleontica', ruota con Akanji e Bastoni). Non pagarlo da inamovibile."},{"name":"Spence","team":"Inter","type":"ok","text":"Dal Tottenham (30M+5): è lui l'erede designato di Dumfries sulla fascia destra, titolare."},{"name":"Bisseck","team":"Inter","type":"ballottaggio","text":"Nella difesa 'camaleontica' di Chivu l'indiziato a uscire è lui (ha già mandato messaggi sulla concorrenza di Stones): rischio panchina e persino addio. Paga una fascia sotto."},{"name":"Kristensen T.","team":"Udinese","type":"mercato","text":"OCCASIONE DI LISTONE: listato Udinese ma va all'ATALANTA (fatta, 21-22M, erede Djimsiti): titolare della Dea a Qt 7."},{"name":"Molina N.","team":"Roma","type":"ok","text":"Ufficiale dal 12/8 (13M dall'Atletico): il nuovo padrone della fascia destra di Gasperini."},{"name":"Rensch","team":"Roma","type":"ballottaggio","text":"DECLASSATO: l'arrivo di Molina lo relega a prima alternativa (Wesley stabile a sinistra). A Qt 5 è una riserva: scartare."},{"name":"Castro S.","team":"Roma","type":"ballottaggio","text":"Dalla Roma pagato 35M: nella formazione tipo è in ballottaggio con Malen come 9. Semi-top da pagare con lo sconto del dualismo."},{"name":"Malen","team":"Roma","type":"ok","text":"FALSO ALLARME fisico: era solo febbre, in gruppo dal 6/8, nessun pericolo per la 1ª. Rigorista CONFERMATO (sorpasso su Dybala già a fine 25/26, tira anche con Dybala in campo). Ballottaggio col nuovo Castro come 9."},{"name":"Dybala","team":"Roma","type":"ballottaggio","text":"NON è più il rigorista (Malen tira anche con lui in campo) e con Castro (35M) Gasperini ha già provato assetti senza di lui: posto fisso non garantito. Resta n.1 su punizioni e corner."},{"name":"Scamacca","team":"Atalanta","type":"ballottaggio","text":"Condizione in netta crescita: titolare nel 4-3-3 di Sarri col Schalke (gol, 3 nel precampionato). Avanti su Krstovic ma Sarri ha azzerato le gerarchie rigori: non strapagarlo."},{"name":"Krstovic","team":"Atalanta","type":"ballottaggio","text":"Parte dietro uno Scamacca in crescita e Sarri ha 4 soluzioni davanti: solo a sconto o in coppia."},{"name":"Raspadori","team":"Atalanta","type":"ok","text":"UPGRADE: titolare a sinistra nel 4-3-3 di Sarri (dal 1' col Schalke), davanti a Zalewski/Sulemana/Maldini. Da quarta opzione a titolare."},{"name":"Gudmundsson A.","team":"Fiorentina","type":"ballottaggio","text":"Rigorista favorito (26/29, rigore trasformato col Gubbio) MA doppio rischio: Paratici lo ha messo in vendita (Bournemouth) e per il 2° slot dietro Kean c'è il ballottaggio con Atta. Solo a sconto."},{"name":"Lucca","team":"Napoli","type":"ok","text":"Cessione congelata (caviglia) e doppietta nell'ultimo test: con Lukaku via può restare come vice-Hojlund. A Qt 3 scommessa sensata."},{"name":"Paz N.","team":"Como","type":"ballottaggio","text":"RESTA al Como (accordo col Real, recompra 2027). Top assoluto ma NON è il rigorista (Da Cunha 4/4, Paz 0/2) e mancava nell'ultimo test (rientro Mondiale): non pagare il premio rigori."},{"name":"Orsolini","team":"Bologna","type":"ballottaggio","text":"Resta 1° rigorista, ma Dovbyk (27/32 in carriera) è l'insidia più credibile della A a una gerarchia consolidata."},{"name":"De Bruyne","team":"Napoli","type":"ballottaggio","text":"Ora rigorista n.1 + punizioni + corner: pacchetto bonus completo. Resta il tema minutaggio con Allegri: semi-top, non 1° slot."},{"name":"Hojlund","team":"Napoli","type":"ok","text":"Il caso più netto della A: 'il vostro uomo deve essere lui' (Sky 12/8), 9 titolare senza alternative in un Napoli da 6 gol all'Aris. Dal dischetto però è dietro De Bruyne: pagalo per i gol su azione."},{"name":"Zhe /* ============================== utils ============================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => (s ?? '').toString().normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const ROLES = ['P','D','C','A'];
const ROLENAME = {P:'Portieri', D:'Difensori', C:'Centrocampisti', A:'Attaccanti'};

/* ============================== indexes ============================== */
const byId = new Map(DATA.players.map(p => [p.id, p]));
const byNorm = new Map();           // norm name -> [player]
for (const p of DATA.players) {
  p._n = norm(p.name); p._t = norm(p.team);
  if (!byNorm.has(p._n)) byNorm.set(p._n, []);
  byNorm.get(p._n).push(p);
}
function findPlayer(name, team) {
  const cands = byNorm.get(norm(name)) || [];
  if (cands.length === 1) return cands[0];
  if (team) { const hit = cands.find(p => p._t === norm(team)); if (hit) return hit; }
  return cands[0] || null;
}
const slotById = new Map(DATA.slots.map(s => [s.id, s]));
// wishlist index: pid -> [{role, slot, prio, maxprice, ...}]  ·  slot id -> group
const wishByPid = new Map();
const wishBySlot = new Map();
for (const role of ROLES) {
  for (const grp of (DATA.wishlist[role] || [])) {
    wishBySlot.set(grp.slot, {role, ...grp});
    grp.players.forEach(w => {
      const p = findPlayer(w.name, w.team);
      if (!p) return;
      if (!wishByPid.has(p.id)) wishByPid.set(p.id, []);
      wishByPid.get(p.id).push({role, slot: grp.slot, profile: grp.profile, slotBudget: grp.budget, ...w});
    });
  }
}
// sleepers index
const sleepByPid = new Map();
for (const role of Object.keys(DATA.sleepers || {})) {
  for (const s of DATA.sleepers[role]) {
    const p = findPlayer(s.name, s.team);
    if (!p) continue;
    if (!sleepByPid.has(p.id)) sleepByPid.set(p.id, []);
    sleepByPid.get(p.id).push(s);
  }
}
// alerts index
const alertByPid = new Map();
for (const a of (DATA.alerts || [])) {
  const p = findPlayer(a.name, a.team);
  if (!p) continue;
  if (!alertByPid.has(p.id)) alertByPid.set(p.id, []);
  alertByPid.get(p.id).push(a);
}

/* ============================== state ============================== */
const LS_KEY = 'fantaasta_2627_v1';
let state = loadState();
function defaultState() {
  return { budget: DATA.budget, roleBudget: {...DATA.roleBudget}, actions: [] };
}
function loadState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) return {...defaultState(), ...JSON.parse(raw)};
  } catch (e) {}
  try {
    const m = document.cookie.match(/(?:^|;\s*)fantaasta_bk=([^;]+)/);
    if (m) {
      const st = {...defaultState(), ...JSON.parse(decodeURIComponent(m[1]))};
      toast('Stato ripristinato dal cookie di backup', 'warn');
      return st;
    }
  } catch (e) {}
  return defaultState();
}
function save() {
  const raw = JSON.stringify(state);
  try { localStorage.setItem(LS_KEY, raw); } catch (e) {}
  // cookie backup (4KB limit): full state, else buys only
  let ck = raw;
  if (encodeURIComponent(ck).length > 3800) {
    ck = JSON.stringify({...state, actions: state.actions.filter(a => a.t === 'buy')});
  }
  if (encodeURIComponent(ck).length <= 3900) {
    document.cookie = 'fantaasta_bk=' + encodeURIComponent(ck) + ';max-age=7776000;path=/;SameSite=Lax';
  }
}

  const spent = mine.reduce((s,a) => s + a.price, 0);
  const spentRole = {P:0,D:0,C:0,A:0};
  const cntRole = {P:0,D:0,C:0,A:0};
  const slotFill = new Map();
  for (const a of mine) { spentRole[a.role] += a.price; cntRole[a.role]++; if (a.slot) slotFill.set(a.slot, a); }
  const totSlots = ROLES.reduce((s,r) => s + DATA.roleSlots[r], 0);
  const left = state.budget - spent;
  const slotsLeft = totSlots - mine.length;
  // dynamic budget: spread surplus/deficit over empty slots, proportional to their planned budget
  const emptyPlanSum = DATA.slots.reduce((s,x) => s + (slotFill.has(x.id) ? 0 : x.budget), 0);
  const factor = emptyPlanSum > 0 ? left / emptyPlanSum : 0;
  return {mine, gone, minePid, gonePid, spent, spentRole, cntRole, slotFill, left, slotsLeft,
          emptyPlanSum, factor, planDelta: left - emptyPlanSum,
          adjBudget: id => { const s = slotById.get(id); return s ? Math.round(s.budget * factor) : 0; },
          maxBid: Math.max(0, left - Math.max(0, slotsLeft - 1)),
          avg: slotsLeft ? Math.floor(left / slotsLeft) : 0};
}
function freeSlots(role) {
  const d = derive();
  return DATA.slots.filter(s => s.role === role && !d.slotFill.has(s.id));
}
// wishlist entries of a slot still on the board (not mine, not gone) as {w, p}
function slotAvailable(slotId, d) {
  const grp = wishBySlot.get(slotId);
  if (!grp) return [];
  return grp.players.map(w => ({w, p: findPlayer(w.name, w.team)}))
    .filter(x => x.p && !d.minePid.has(x.p.id) && !d.gonePid.has(x.p.id));
}

/* ============================== toast ============================== */
function toast(html, kind='') {

  el.className = 'toast ' + kind;

  setTimeout(() => { el.style.transition = 'opacity .4s'; el.style.opacity = 0; setTimeout(() => el.remove(), 400); }, 3400);

/* ============================== search ============================== */
let selIdx = 0, curResults = [];
function doSearch(q) {
  const nq = norm(q);
  const box = $('#results');
  if (nq.length < 2) { box.classList.remove('open'); curResults = []; return; }
  const d = derive();
  const scored = [];
  for (const p of DATA.players) {
    if (d.cntRole[p.r] >= DATA.roleSlots[p.r] && !d.minePid.has(p.id)) continue;
    let s = 0;
    if (p._n.startsWith(nq)) s = 100;
    else if (p._n.split(' ').some(w => w.startsWith(nq))) s = 85;
    else if (p._n.includes(nq)) s = 62;
    else if (p._t.startsWith(nq)) s = 32;
    else continue;
    const w = wishByPid.get(p.id);
    if (w) s += 26 - Math.min(w[0].prio, 10);
    if (sleepByPid.has(p.id)) s += 8;
    if (d.minePid.has(p.id) || d.gonePid.has(p.id)) s -= 45;
    scored.push([s + (p.fvm || 0) / 2000, p]);
  }
  scored.sort((a,b) => b[0] - a[0]);
  curResults = scored.slice(0, 9).map(x => x[1]);
  selIdx = 0;
  renderResults();
}
function renderResults() {
  const d = derive();
  const box = $('#results');
  if (!curResults.length) { box.classList.remove('open'); return; }
  box.innerHTML = curResults.map((p, i) => {
    const w = wishByPid.get(p.id);
    const sl = sleepByPid.get(p.id);
    const al = alertByPid.get(p.id);
    const mine = d.minePid.get(p.id), gone = d.gonePid.get(p.id);
    let badges = '';
    if (w) badges += `<span class="wish">★ ${w.map(x => `${x.slot} #${x.prio}`).join(' · ')} · max ${w[0].maxprice}</span>`;
    if (!w && sl) badges += `<span class="sleep">◆ occasione · ~${esc(sl[0].price ?? '?')}</span>`;
    if (al) badges += `<span class="adot" title="${esc(al.map(a=>a.text).join(' | '))}"></span>`;
    if (mine) badges += `<span class="tag mine">mio · ${mine.price}</span>`;
    if (gone) badges += `<span class="tag gone">andato</span>`;
    return `<div class="res ${i===selIdx?'sel':''} ${mine||gone?'dead':''}" data-i="${i}">
      <span class="rb ${p.r}">${p.r}</span>
      <span class="nm">${esc(p.name)}</span><span class="tm">${esc(p.team)}</span>
      ${badges}
      <span class="fig">Qt ${p.qta} · FVM ${p.fvm}</span>
    </div>`;
  }).join('');
  box.classList.add('open');
  box.querySelectorAll('.res').forEach(el => {
    el.addEventListener('click', () => openBuy(curResults[+el.dataset.i]));
  });
}

function confirmBuy() {
  if (!buyTarget) return;
  const d = derive();
  const price = parseInt($('#price').value, 10);
  const slotId = $('#slotSel').value;
  const err = $('#buyerr');
  if (!price || price < 1) { err.textContent = 'Inserisci i crediti pagati.'; $('#price').focus(); return; }
  if (d.minePid.has(buyTarget.id)) { err.textContent = 'Già comprato.'; return; }
  if (price > d.maxBid) { err.textContent = `Impossibile: puoi offrire al massimo ${d.maxBid} (devi tenere 1 credito per ogni altro slot vuoto).`; return; }

  const p = buyTarget;
  closeBuy();
  doBuy(p, price, slotId);
}

      <td style="color:var(--mut)">${esc(p.team)}</td>
      <td class="num">${p.qta}</td><td class="num">${p.fvm}</td>
      <td>${w ? `<span class="wish">★ ${w[0].slot} #${w[0].prio} max ${w[0].maxprice}</span>` : sl ? `<span class="sleep">◆ ~${esc(sl[0].price ?? '?')}</span>` : ''}
          ${mine ? `<span class="tag mine">mio ${mine.price}</span>` : ''}${gone ? '<span class="tag gone">andato</span>' : ''}</td>
    </tr>`;
  }).join('');
}
function refreshListoneRows(body) { body.querySelector('#lrows').innerHTML = listoneRows(); bindTab(body); }
function viewListone() {
  const teams = [...new Set(DATA.players.map(p => p.team))].sort();
  return `<div class="filters">
      <input id="lq" placeholder="Filtra…" value="${esc(listoneFilter.q)}" style="width:160px">
      ${ROLES.map(r => `<button class="fchip ${listoneFilter.role===r?'on':''}" data-role="${r}">${r}</button>`).join('')}
      <select id="lteam"><option value="">Tutte le squadre</option>${teams.map(t => `<option ${listoneFilter.team===t?'selected':''}>${esc(t)}</option>`).join('')}</select>
      <select id="lsort">
        <option value="fvm" ${listoneFilter.sort==='fvm'?'selected':''}>FVM ↓</option>
        <option value="qta" ${listoneFilter.sort==='qta'?'selected':''}>Qt.A ↓</option>
        <option value="name" ${listoneFilter.sort==='name'?'selected':''}>Nome A→Z</option>
      </select>
    </div>
    <table><thead><tr><th></th><th>Nome</th><th>Squadra</th><th class="num">Qt.A</th><th class="num">FVM</th><th>Status</th></tr></thead>
    <tbody id="lrows">${listoneRows()}</tbody></table>
    <p style="color:var(--faint);font-size:12px;margin-top:8px">Mostrati max 250 risultati — filtra per vederli tutti. Click su una riga per aprirla.</p>`;
}

function viewLog() {
  if (!state.actions.length) return '<p style="color:var(--faint)">Nessuna operazione ancora. Il log registra i tuoi acquisti e i giocatori presi dagli altri.</p>';
  return state.actions.map((a, i) => ({a, i})).reverse().map(({a, i}) => `
    <div class="logrow">
      <span class="lt">${new Date(a.ts).toLocaleTimeString('it-IT', {hour:'2-digit',minute:'2-digit'})}</span>
      ${a.t === 'buy' ? '✅' : '⛔'}
      <span class="rb ${a.role}">${a.role}</span>
      <b>${esc(a.name)}</b> <span style="color:var(--mut)">${esc(a.team)}${a.slot ? ' · ' + a.slot : ''}</span>
      <input class="pz" type="number" min="0" value="${a.price ?? ''}" placeholder="crediti" data-editprice="${i}" title="Crediti pagati">
      ${a.t === 'gone' ? `<input class="by" value="${esc(a.buyer || '')}" placeholder="chi l'ha preso?" data-editbuyer="${i}">` : ''}
      <button class="xbtn" data-del="${i}" title="Elimina">✕</button>
    </div>`).join('');
}

function viewNews() {
  const alerts = DATA.alerts || [];
  const rig = DATA.rigoristi || {};
  const sleepers = DATA.sleepers || {};
  const teams = Object.keys(rig).sort();
  return `
    ${alerts.length ? `<div class="newsblock"><h2>⚠ Alert pre-asta ${DATA.researchDate ? `<span style="text-transform:none;letter-spacing:0">(ricerca del ${esc(DATA.researchDate)})</span>` : ''}</h2>
      ${alerts.map(a => `<div class="alert-item"><span class="at ${esc(a.type)}">${esc(a.type)}</span><span><b>${esc(a.name)}</b> (${esc(a.team)}) — ${esc(a.text)}</span></div>`).join('')}</div>` : '<p style="color:var(--faint)">Nessun alert caricato (research.json non ancora generato).</p>'}
    ${teams.length ? `<div class="newsblock"><h2>🎯 Rigoristi e piazzati</h2>
      <table><thead><tr><th>Squadra</th><th>Rigori</th><th>Punizioni</th><th>Corner</th></tr></thead><tbody>
      ${teams.map(t => `<tr><td><b>${esc(t)}</b></td><td>${esc(rig[t].rigori || '')}</td><td>${esc(rig[t].punizioni || '')}</td><td>${esc(rig[t].corner || '')}</td></tr>`).join('')}
      </tbody></table></div>` : ''}
    ${Object.keys(sleepers).length ? `<div class="newsblock"><h2>◆ Occasioni dal web (sleeper)</h2>
      ${ROLES.filter(r => sleepers[r]?.length).map(r => `
        <h3 style="font-family:var(--cond);margin:10px 0 4px"><span class="rb ${r}">${r}</span> ${ROLENAME[r]}</h3>
        <ul class="wl-list">${sleepers[r].map(s => {
          const p = findPlayer(s.name, s.team);
          return `<li ${p ? `data-open="${p.id}"` : ''}><span class="nm">${esc(s.name)}</span><span class="tm">${esc(s.team)}</span>
            <span class="ti">${esc(s.why || '')}</span><span class="mx">~${esc(s.price ?? '?')}</span></li>`;
        }).join('')}</ul>`).join('')}</div>` : ''}
    ${(DATA.sources || []).length ? `<div class="newsblock"><h2>Fonti consultate</h2><p class="srcs">${DATA.sources.map(esc).join('<br>')}</p></div>` : ''}`;
}

/* ============================== global keys & wiring ============================== */
const qEl = $('#q');
qEl.addEventListener('input', () => doSearch(qEl.value));
qEl.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { e.preventDefault(); if (curResults.length) { selIdx = (selIdx + 1) % curResults.length; renderResults(); } }
  else if (e.key === 'ArrowUp') { e.preventDefault(); if (curResults.length) { selIdx = (selIdx - 1 + curResults.length) % curResults.length; renderResults(); } }
  else if (e.key === 'Enter') {
    e.preventDefault();
    const p = curResults[selIdx];
    if (!p) return;
    if (e.shiftKey) { doGone(p); qEl.value = ''; curResults = []; $('#results').classList.remove('open'); }
    else openBuy(p);
  }
  else if (e.key === 'Escape') { qEl.value = ''; curResults = []; $('#results').classList.remove('open'); }
});
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
  if (e.key === 'Escape' && buyTarget) { closeBuy(); return; }
  // any printable char refocuses search (when not already in an input)
  if (!e.ctrlKey && !e.metaKey && !e.altKey && e.key.length === 1 && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName || '')) {
    qEl.focus();
  }
});
document.addEventListener('click', e => {
  if (!e.target.closest('.searchbox')) $('#results').classList.remove('open');
});

$('#btnUndo').addEventListener('click', undo);
$('#btnReset').addEventListener('click', () => {
  if (confirm('Azzerare TUTTA l\'asta? (acquisti, giocatori andati, budget)') && confirm('Sicuro sicuro? Non si torna indietro (hai fatto un export?)')) {
    state = defaultState(); save(); renderAll(); toast('Asta azzerata');
  }
});
$('#btnExp').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(state, null, 1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `fantaasta-backup-${new Date().toISOString().slice(0,16).replace(/[:T]/g,'-')}.json`;
  a.click();
  toast('Backup scaricato ⬇');
});
function buildCsv() {
  const d = derive();
  const rows = [['slot','ruolo','nome','squadra','prezzo']];
  for (const r of ROLES) for (const s of DATA.slots.filter(x => x.role === r)) {
    const a = d.slotFill.get(s.id);
    rows.push([s.id, r, a?.name || '', a?.team || '', a ? a.price : '']);
  }
  return rows.map(row => row.map(v => /[";\n]/.test(String(v)) ? `"${String(v).replace(/"/g,'""')}"` : String(v)).join(';')).join('\r\n');
}
$('#btnCsv').addEventListener('click', () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + buildCsv()], {type:'text/csv;charset=utf-8'}));
  a.download = `fantaasta-rosa-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  toast('Rosa CSV scaricata ⬇');
});
$('#btnImp').addEventListener('click', () => $('#impFile').click());
$('#impFile').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(txt => {
    const st = JSON.parse(txt);
    if (!Array.isArray(st.actions)) throw new Error('bad');
    state = {...defaultState(), ...st}; save(); renderAll();
    toast('Backup ripristinato ⬆');
  }).catch(() => toast('File non valido', 'err'));
  e.target.value = '';
});
$('#btnSet').addEventListener('click', () => {
  $('#setBudget').value = state.budget;
  ROLES.forEach(r => $('#set' + r).value = state.roleBudget[r]);
  $('#dlgSet').showModal();
});
$('#setCancel').addEventListener('click', () => $('#dlgSet').close());
$('#setSave').addEventListener('click', () => {
  const b = parseInt($('#setBudget').value, 10);
  if (b > 0) state.budget = b;
  ROLES.forEach(r => { const v = parseInt($('#set' + r).value, 10); if (v >= 0) state.roleBudget[r] = v; });
  save(); renderAll(); $('#dlgSet').close(); toast('Impostazioni salvate');
});

/* ============================== boot ============================== */
function renderAll() { renderHeader(); renderAdvice(); renderTab(); }
$('#footNote').textContent = `Listone ufficiale ${DATA.season}: ${DATA.players.length} giocatori · Rosa 3P+8D+8C+6A · I dati restano solo in questo browser (localStorage + cookie di backup). Fai un export ⬇ a fine asta.`;
renderAll();
qEl.focus();
</script>
